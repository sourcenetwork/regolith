\* The engine: create_backup copies every table into the pool before it
\* writes the metadata, sealed and naming its key, with the listing and the
\* backup id under the tag; restore refuses a finished target, checks every
\* key before its first write and writes a sealed MANIFEST last; a delete
\* counts every listing. One table, two keys rotated at will, two backups,
\* two restores under every provider, power cuts at every step, and one
\* attacker edit of a listing or one swap of two files' names.
\*
\* SHRUNK to finish inside a minute on one TLC worker: one table slot where
\* there were two (the run with two did not finish in five minutes; now
\* about 180 thousand states). It still covers every step of a backup, a
\* restore and a delete in every order, under every provider, with every
\* power cut and every act of the attacker, and two backups that share a
\* table or hold it under two keys. What it no longer shows is a power cut
\* between two tables of one copy: the REDs ManifestFirst, MetaFirst and
\* CheckAfterCopy keep two slots for those copies, and the Lean proof
\* (restore_manifest_follows_its_tables, backup_metadata_follows_its_tables,
\* last_write_holds_all) covers every number of tables.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two backups in one behaviour: enough for two to share a table, for a
  \* rotation between them, and for one to be deleted.
  MaxBackups = 2
  \* Two restores in one behaviour: one refused or cut short, then another,
  \* or a second over a finished target.
  MaxRestores = 2
  \* One table slot: see SHRUNK above.
  Slots = 1
  \* The engine, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* No metadata file and no restored MANIFEST is plain text.
INVARIANT SealedMetadata
\* A provider with every key the backup needs is never refused.
INVARIANT RightKeysRestore
\* A finished restore holds exactly what the backup held.
INVARIANT FaithfulRestore
\* A refused restore wrote nothing.
INVARIANT RefusalWritesNothing
\* Every table an untampered backup lists is in the pool.
INVARIANT ListedRestores
