\* The engine: create_backup copies every table into the pool before it
\* writes the metadata, sealed and naming its key, with the listing and the
\* backup id under the tag; restore refuses a finished target, checks every
\* key before its first write and writes a sealed MANIFEST last; a delete
\* or a purge sweeps the pool a batch at a time, reading each listing as
\* its walk of meta/ reaches it. One table, two keys rotated at will, two
\* backups, two restores under every provider, power cuts at every step,
\* deletes and purges of any backups, and one attacker edit of a listing,
\* one swap of two files' names, or one metadata file that stops reading.
\* The listing names every file, needing no key; a delete or a purge
\* removes every pool file no remaining listing names, and nothing while
\* one cannot be read.
\*
\* SHRUNK to finish inside a minute on one TLC worker: one table slot where
\* there were two (19.9 million states, 13 minutes; now under half a
\* million). It still covers every step of a backup, a restore, a delete
\* and a purge in every order, under every provider, with every power cut
\* and every act of the attacker, and two backups that share a table or
\* hold it under two keys. What it no longer shows is a power cut between
\* two tables of one copy: MC_BackupSeal_Green_Sweep keeps two slots for
\* the backup's copies and the pool, the REDs ManifestFirst, MetaFirst and
\* CheckAfterCopy keep two for the restore's, and the Lean proof
\* (restore_manifest_follows_its_tables, backup_metadata_follows_its_tables,
\* last_write_holds_all) covers every number of tables.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two backups in one behaviour: enough for two to share a table, for a
  \* rotation between them, and for one to be deleted.
  MaxBackups = 2
  \* Two restores in one behaviour: one refused or cut short, then another,
  \* or a second over a finished target.
  MaxRestores = 2
  \* One entry per batch of the walk of meta/: a boundary after every entry.
  Batch = 1
  \* One pool file per batch of the sweep: the pool holds at most two here
  \* (the one table under each key), so two files take two batches.
  Sweep = 1
  \* One table slot: see SHRUNK above.
  Slots = 1
  \* The engine, no defect.
  Mutant = "none"
