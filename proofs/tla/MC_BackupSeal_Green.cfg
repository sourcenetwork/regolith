\* The engine: create_backup copies every table into the pool before it
\* writes the metadata, sealed and naming its key, with the listing and the
\* backup id under the tag; restore refuses a finished target, checks every
\* key before its first write and writes a sealed MANIFEST last; a delete
\* counts every listing. One table, two keys rotated at will, two backups,
\* two restores under every provider, power cuts at every step, and deletes
\* and purges of any backups. The listing names every file, needing no key;
\* a delete or a purge removes every pool file no remaining listing names.
\*
\* SHRUNK twice to finish in a few seconds of CPU on one TLC worker. First
\* one table slot where there were two (the run with two did not finish in
\* two minutes; down to 269,438 states, 17 to 24 seconds); then no attacker
\* in this run (now 24,994 states, about 7 seconds). It still covers every
\* step of a backup, a restore, a listing, a delete and a purge in every
\* order, under every provider, with every power cut, and two backups that
\* share a table or hold it under two keys. The attacker's edit, swap and
\* unreadable file meet a restore, a delete and a purge in
\* MC_BackupSeal_Green_Attack, which has one restore. What no run shows any
\* more: the attacker's act and two restores in one behaviour (an edited
\* backup refused, then restored again; or a finished target met again
\* after an edit), and a power cut between two tables of one copy in a
\* GREEN run (the REDs ManifestFirst, MetaFirst and CheckAfterCopy keep two
\* tables).
\* The Lean proof covers every number of tables, backups and restores,
\* one restore or delete at a time: entitled_restore_is_faithful,
\* refusal_writes_nothing, edited_listing_refuses, renamed_file_refuses and
\* finished_target_refuses for a restore; collect_keeps_listed,
\* collect_stops_on_unreadable and purge_keeps_the_newest for a delete;
\* listing_names_every_backup and unreadable_is_listed for the listing;
\* restore_manifest_follows_its_tables, backup_metadata_follows_its_tables
\* and last_write_holds_all for the order of writes (Regolith/BackupSeal.lean).
SPECIFICATION Spec
\* No attacker in this run: see SHRUNK above.
CONSTRAINT NoAttack
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two backups in one behaviour: enough for two to share a table, for a
  \* rotation between them, and for one to be deleted.
  MaxBackups = 2
  \* Two restores in one behaviour: one refused or cut short, then another,
  \* or a second over a finished target.
  MaxRestores = 2
  \* One table slot: see SHRUNK above.
  Slots = 1
  \* The engine, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* No metadata file and no restored MANIFEST is plain text.
INVARIANT SealedMetadata
\* A provider with every key the backup needs is never refused.
INVARIANT RightKeysRestore
\* A finished restore holds exactly what the backup held.
INVARIANT FaithfulRestore
\* A refused restore wrote nothing.
INVARIANT RefusalWritesNothing
\* Every table an untampered backup lists is in the pool, even while its
\* metadata does not read.
INVARIANT ListedRestores
\* The listing names every backup the repository holds.
INVARIANT ListingNamesEvery
