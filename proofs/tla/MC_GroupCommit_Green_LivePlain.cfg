\* Liveness and the failed group with a plain write in play: transaction 1
\* writes key 1, transaction 3 reads key 1 and writes key 2, and the plain
\* write 4 writes key 1. Groups of up to three, and a group may fail. Every
\* commit gets its answer in the end (AllTicketsComplete), and every safety
\* invariant holds.
\*
\* Example of what it rules out: the plain write 4 leads a group, stops
\* after it as every leader does, and transaction 3, queued meanwhile, is
\* never led by anyone. Second example: the group holding the plain write
\* fails, and transaction 3 is then refused for a write of key 1 that never
\* landed.
\*
\* This run is MC_GroupCommit_Green_Live with the plain write in place of
\* the second writer of key 1 (4,125 states). What three commits do not
\* show: a commit queued behind a full group of three, which
\* MC_GroupCommit_Green has without the failing group.
\* Lean covers the safety for every number of commits and every group size:
\* group_eq_serial, early_check_split and plain_write_counts_in_group in
\* Regolith/GroupCommit.lean, seqs_dense in Regolith/Pipeline.lean. No Lean
\* theorem states the failed group or the liveness claim.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every commit is done is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three commits: transactions 1 and 3, and the plain write 4.
  Txns = {1, 3, 4}
  \* Commit 4 is a plain write: no snapshot, no validation, it always lands.
  Plain = {4}
  \* The two keys they read and write.
  Keys = {1, 2}
  \* What each commit reads (ReadsW in GroupCommit.tla).
  Reads <- ReadsW
  \* What each commit writes (WritesW in GroupCommit.tla).
  Writes <- WritesW
  \* Transactions 1 and 3 wait for their record to be durable.
  Immediate = {1, 3}
  \* A group takes up to three members.
  MaxGroup = 3
  \* A group's write or sync may fail.
  Faults = TRUE
  \* No commit here is made by commit_nowait: every leader syncs its own group.
  Nowait = {}
  \* The design, no defect.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* The commits that succeeded are the ones a one-at-a-time order would accept.
INVARIANT SerialEquivalent
\* Sequences are handed out in the order the commits were decided.
INVARIANT SeqFollowsDecisionOrder
\* The memtable holds exactly the writes of the commits that landed.
INVARIANT StoreHoldsCommits
\* A reader sees a group all or nothing: what is visible is in the memtable.
INVARIANT VisibleIsApplied
\* A commit that waits for an fsync is not visible before that fsync.
INVARIANT DurableBeforeVisible
\* Every caller is answered at most once, and a done commit exactly once.
INVARIANT TicketsCompleteOnce
\* A "committed" answer is true: the commit is visible, and durable if it asked.
INVARIANT TicketMeansVisible
\* A leader leads one group, then hands off.
INVARIANT BoundedTurn
\* When no step is possible, every commit has its answer.
INVARIANT NoStuckTicket
\* The promise of this run: in the end every commit is done.
PROPERTY AllTicketsComplete
