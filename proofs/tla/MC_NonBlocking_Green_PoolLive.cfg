\* GREEN. Liveness of the shared read, on a run small enough to check a
\* temporal property in a few seconds: two threads miss the one block both
\* read; either may go idle or wake, and the database may close at any point.
\* Every read finishes in every fair run (AllDone), and every invariant holds
\* here too.
\*
\* Example of what it rules out: thread 1 claims the unit for block 1, thread
\* 2 registers on it and goes idle, thread 1 reads the block and tells only
\* itself. Thread 2 sleeps for ever with its read unfinished.
\*
\* This run is the liveness half of MC_NonBlocking_Green_Pool, which keeps
\* the second block and the safety invariants (1,489 states here against
\* 50,906 there). What this size does not show: a thread with a read of its
\* own in flight beside the shared one. Lean covers the safety for every
\* number of threads and units: claim_once, told_at_most_once,
\* every_waiter_told, no_lost_idle_wakeup and busy_never_woken in
\* Regolith/IoQueue.lean; single_thread_finishes there proves that one thread
\* finishes everything. No Lean theorem states that many threads do.

\* The behaviours of the model: Init, then steps of Next, each thread fair.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* One block.
  Blocks = {1}
  \* Both threads read block 1.
  Want <- WantJobs
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* No sync round in this setup.
  Rounds = {}
  \* So no round covers a commit.
  CommittersOf <- CommittersNone
  \* No write stall in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* No timed waits in this setup.
  Timers = {}
  \* So no thread asks for one.
  TimerOf <- TimerOfNone
  \* No thread drops its queue.
  Droppers = {}
  \* Block 1 can be made twice (once per thread).
  MaxUnits = 2
  \* The real code: no bug planted.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* A unit's disk read runs at most once.
INVARIANT SingleRun
\* A queue gets at most one note per unit, and only if it registered.
INVARIANT ExactlyOnce
\* Every queue that registered on a finished unit gets its note.
INVARIANT EveryWaiterTold
\* A read's request sits only on its own thread's queue.
INVARIANT OwnQueue
\* No thread sleeps unwoken with a note in its inbox.
INVARIANT NoLostIdleWakeup
\* Only an idle thread is ever woken.
INVARIANT BusyNeverWoken
\* Every free unit is held by some queue, so some poll runs it.
INVARIANT NoOrphanUnit
\* The promise of this run: every read and job finishes, in every fair run.
PROPERTY AllDone
