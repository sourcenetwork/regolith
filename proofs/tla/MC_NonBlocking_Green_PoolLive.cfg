\* Liveness in pool mode, on a run small enough to check two temporal
\* properties in about ten seconds: one commit task with an on_complete
\* callback, two CacheOnly reads of one block, one self-started unit, and
\* two I/O threads that wait on io_pending and call poll_io. Every ticket
\* completes (EveryTicketCompletes) and every task finishes
\* (AllTasksFinish), and every safety invariant holds here too.
\*
\* Example of what it rules out: a read registers its waker just after the
\* I/O thread looked for waiters and found none, the block arrives, nobody
\* wakes the read, and it waits for ever. The read rechecks after it
\* registers, so it sees the block.
\*
\* This run is the liveness half of MC_NonBlocking_Green_Pool, which keeps
\* both commit tasks and the safety invariants (10,282 states here against
\* 86,521 there). What one commit task does not show is two commits waiting
\* on tickets at once; the safety run shows neither is left stuck
\* (NothingStuck, NoLostWakeup). This model has no Lean counterpart.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every task has finished is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* One task that commits and awaits its ticket.
  CommitTasks = {1}
  \* It also registers an on_complete callback.
  Callbacks = {1}
  \* Two tasks that read through a CacheOnly handle.
  ReadTasks = {3, 4}
  \* One block, not cached at the start.
  Blocks = {1}
  \* Both reads need that one block, so they share its single read.
  BlockOf <- OneBlock
  \* Two of the caller's threads reserved for I/O.
  IoThreads = {1, 2}
  \* One unit of I/O regolith starts by itself.
  SelfJobs = 1
  \* The caller runs a pool of I/O threads.
  Mode = "pool"
  \* The design, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* A parked task has its waker registered on a handle that is not ready.
INVARIANT NoLostWakeup
\* A ticket completes when, and only when, its commit's I/O has run.
INVARIANT TicketCompletesWithItsIo
\* on_complete runs at most once, only on a complete ticket.
INVARIANT CallbackOnce
\* The device is read once per block, however many reads missed it.
INVARIANT SingleFlight
\* While I/O is queued, an I/O thread polls or a notification is stored.
INVARIANT IoPendingFires
\* When no step is possible, every task is done and no I/O is queued.
INVARIANT NothingStuck
\* The promises of this run: every ticket completes ...
PROPERTY EveryTicketCompletes
\* ... and every task finishes.
PROPERTY AllTasksFinish
