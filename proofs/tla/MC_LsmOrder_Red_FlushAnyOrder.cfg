\* The bug: flushes off the commit path without the `flushing` exclusion,
\* installing in the order they finish. The newer frozen memtable's file
\* reaches L0 while the older frozen memtable is still read before L0, so a
\* read of a key both hold returns the older version. ReadNewest fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
