\* Concurrent flushes install in the order they finish. The newer frozen
\* memtable's file reaches L0 while the older frozen memtable is still read
\* before L0, so a read of a key both hold returns the older version.
\* ReadNewest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 5
  MaxL0 = 3
  Picker = "Closure"
  MaxImm = 2
  FlushOrder = "Any"
  Levels = 1
  Ingest = "Off"
  Legacy = "Off"
INVARIANT ReadNewest
INVARIANT TypeOK
INVARIANT LevelsSorted
INVARIANT BisectIsScan
