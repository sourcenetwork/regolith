\* Green_Heads with the block range left ordinary (the head and marker
\* prefixes stay commutative): the second application read the block key as
\* absent, the first one put it, and that read is validated, so the second
\* application is refused. The content-addressed class is what lets it land.
\* INV_DuplicateMergesCommit fails.
SPECIFICATION Spec
CONSTRAINT HeadsWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {3}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {7, 8}
  Remote = 2
  RemoteParents = {0}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT INV_DuplicateMergesCommit
