\* The defect: I/O regolith starts itself (a flush with no worker, the
\* disk check) is queued without firing io_pending. The I/O threads sleep
\* on io_pending while the unit waits forever. IoPendingFires fails; the
\* other invariants are checked too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  CommitTasks = {1, 2}
  Callbacks = {1}
  ReadTasks = {3, 4}
  Blocks = {1}
  BlockOf <- OneBlock
  IoThreads = {1, 2}
  SelfJobs = 1
  Mode = "pool"
  Mutant = "SilentSelfIo"
INVARIANT IoPendingFires
INVARIANT TypeOK
INVARIANT NoLostWakeup
INVARIANT TicketCompletesWithItsIo
INVARIANT CallbackOnce
INVARIANT SingleFlight
INVARIANT NothingStuck
