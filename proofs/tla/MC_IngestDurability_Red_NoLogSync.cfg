\* The ingest's manifest record becomes durable while a commit before it is
\* only in the unsynced log. A power cut recovers the ingest and loses that
\* commit. GapFreePrefix fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Commits = {"c1", "c2", "c3"}
  Mutant = "NoLogSync"
INVARIANT GapFreePrefix
