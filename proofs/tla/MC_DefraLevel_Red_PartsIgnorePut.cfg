\* Green_Parts with a put, delete or range delete no longer counted as a change
\* to the named parts. A writer deletes the key under the part reader, which
\* commits. INV_PartsCurrent fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- PartsWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PartsIgnorePut"
INVARIANT INV_PartsCurrent
INVARIANT INV_PartsRelaxed
INVARIANT INV_ReasonsExact
