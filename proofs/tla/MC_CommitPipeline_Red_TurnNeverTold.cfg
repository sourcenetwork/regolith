\* RED. The bug: a finished commit claims the orders the frontier named and
\* tells none of them. Story, with no time outs: thread 3 parks far from its
\* turn; the frontier passes order 2 and names order 3; thread 2 finishes,
\* tells nobody, and returns. Thread 3 sleeps for good and its order is
\* never decided: NoLiveThreadBlocked breaks.
\* Check every behaviour of the model.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
\* What this run chooses: who takes part, what may go wrong, and which code is checked.
CONSTANTS
  \* Three committing threads: one more than a thread's own order and the
  \* next to decide, so one of them can be far from its turn.
  Committers = {1, 2, 3}
  \* Every committer is a plain write: no transaction checks, which this
  \* run is not about.
  Plain = {1, 2, 3}
  \* Every transaction begins at the moment it commits.
  EarlyBegin = {}
  \* No ordered unit.
  Units = {}
  \* Nobody shares a key: every commit lands, so each has a record.
  Writes <- Apart
  \* Which keys each transaction read and has checked: the ones it writes.
  Reads <- Apart
  \* Nobody waits for a sync: the round is not what this run is about.
  Immediate = {}
  \* More tickets than the threads ever pull (BoundNeverBinds checks it).
  MaxSlots = 6
  \* Nobody walks away: the owner is only slow, which the interleavings give.
  MaxStops = 0
  \* (No thread may stop.)
  Stoppers = {}
  \* Thread 1 pulls the first ticket: the threads are alike, so which one
  \* does is no matter, and fixing it keeps the run small.
  Head = 1
  \* The log never fails.
  MaxFails = 0
  \* The memtable never fills: no rotation in this run.
  Buffer = 9
  \* Every step of deciding and of publishing is taken on its own.
  Coarse = FALSE
  \* A record is written in one step: the write unit's own rows check its
  \* steps, and a thread parked far from its turn holds nothing they need.
  Copies = FALSE
  \* No time out: a thread asleep, on a record or far from its turn, waits
  \* only for somebody to wake it.
  Patience = FALSE
  \* A thread whose order is more than one past the next to decide parks
  \* far from its turn; each pass names the order one past it.
  Lead = 1
  \* The planted defect: see the top of this file.
  Mutant = "TurnNeverTold"
\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* An owner who thinks its order is in the ring is right.
INVARIANT OwnerSeesItsFate
\* One thread at a time on the log's device step.
INVARIANT OneRound
\* Orders are settled in ticket order.
INVARIANT DecidedIsPrefix
\* The sequences handed out have no gap.
INVARIANT NoHole
\* Only what may be finished is finished.
INVARIANT PublishedPrefix
\* What a sync vouched for is written.
INVARIANT DurableImpliesWritten
\* At Immediate, visible only once durable.
INVARIANT DurableBeforeVisible
\* Nobody is told "done" for a lost order, or "failed" for a kept one.
INVARIANT NoFalseAck
\* When nothing more can happen, every live thread has returned.
INVARIANT NoLiveThreadBlocked
\* The run's ticket bound never stops a live thread.
INVARIANT BoundNeverBinds
\* Some slot always completes...
PROPERTY LockFree
\* ...and every commit does.
PROPERTY EveryLiveCommitCompletes
