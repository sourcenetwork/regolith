\* AEAD records under a stamp that is not sealed with the key. Opened under
\* the wrong key, the stamp passes, every record's tag fails, no stamp can
\* be read so P is 0, and replay drops the whole log as a torn tail: every
\* acknowledged commit is lost. AckedSurvive fails.
