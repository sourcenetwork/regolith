\* A RwLock shared by three tasks that each read, write, take the
\* upgradable read and upgrade it, cancelling at will, Bound 1: every
\* safety invariant. Liveness: MC_SyncRwLock_Green_WriterLive and _ReaderLive.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Bound = 1
  Watched = {1}
  Asks <- AsksAll
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT UpgradeHoldsBack
INVARIANT NoUpgradeDeadlock
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
