\* A RwLock shared by three tasks, each reading or writing, cancelling at
\* will. Mutual exclusion, phase fairness both ways, no lost wakeup and
\* pass-on hold, and every waiter is eventually served.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Watched = {1}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT ReadersWaitOnePhase
INVARIANT WritersBoundedBypass
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
PROPERTY EveryWaiterServed
