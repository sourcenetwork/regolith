\* A plain RwLock with a writer queued behind readers. Task 2 reads from the
\* start. Task 1 asks to write and waits (and may give up). Task 3, a reader,
\* asks once task 1 has queued: it barges past the waiting writer if it can.
\* Every safety invariant holds.
\*
\* A short scenario, not a free run: each task asks once and the reader's
\* arrival is fixed after the writer's, as in the bound-2 twins of
\* tests/loom_sync.rs. Three tasks that all ask as often as they like do not
\* finish in the time a row may take.
\*
\* The runs checked: every run that starts in Init and takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Three tasks use the lock: 1, 2 and 3.
  Tasks = {1, 2, 3}
  \* The lock is a plain RwLock.
  Kind = "Plain"
  \* Every task is its own owner.
  Owner <- OwnerEach
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* A waiter is owed a handoff after one lost race.
  Bound = 1
  \* Task 1 writes; the others read.
  Role <- RoleWriterReaders
  \* Nobody upgrades.
  Upgrades = {}
  \* Tasks 1 and 3 wait when their request does not fit; task 2 only tries.
  Waits = {1, 3}
  \* Task 1 may have its waiting future dropped.
  Drops = {1}
  \* Every task asks for the lock once: a short scenario.
  Turns <- TurnsOnce
  \* Task 2 holds its guard when the run starts.
  Start = {2}
  \* Task 3 asks only after task 1 has queued or entered.
  Follows <- ThirdFollowsFirst
  \* No "is eventually served" promise is checked in this run.
  Watched = {}
  \* No planted bug: the code as built.
  Mutant = "none"
