\* Green_WriteFree with the write-free exemption applied to the pessimistic
\* promoter, which the plan rejects: it reads A before the writer and B after
\* it, validates nothing, and commits a skewed view.
\* INV_WriteFreeConsistent fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- WriteFreeWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "WriteFreePessimistic"
INVARIANT INV_WriteFreeConsistent
INVARIANT INV_WriteFreeCommits
INVARIANT INV_ReasonsExact
