\* RED. The bug: claiming an owed group's job is a check and then a write,
\* not one CAS, so a second thread's claim succeeds on a job already
\* claimed. Story: transactions 1 and 3 share a group left owed; both
\* members poll at once, both claim it, and both run its fsync. SingleSync
\* breaks.

