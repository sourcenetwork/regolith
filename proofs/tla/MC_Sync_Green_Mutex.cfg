CONSTANTS
  \* Three tasks use the lock: 1, 2 and 3.
  Tasks = {1, 2, 3}
  \* The lock is a semaphore; with one permit it is a Mutex.
  Kind = "Semaphore"
  \* One permit: at most one holder.
  Permits = 1
  \* Every task asks for one permit.
  Need <- NeedOne
  \* Every task is its own owner (unused unless the lock is reentrant).
  Owner <- OwnerEach
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* Guards stay with the task that took them.
  Owned = FALSE
  \* A waiter is owed a handoff after one lost race.
  Bound = 1
  \* Tasks 1 and 2 wait when the lock is taken; task 3 only tries.
  Waits = {1, 2}
  \* Task 1's waiting future may be dropped.
  Drops = {1}
  \* Every task asks for the lock once: a short scenario.
  Turns <- TurnsOnce
  \* Task 3 holds the lock when the run starts.
  Start = {3}
  \* Task 2 asks only after task 1 has queued or got the lock.
  Follows <- SecondFollowsFirst
  \* No "is eventually served" promise is checked in this run.
  Watched = {}
  \* The passes of a drain are not counted in this run (what each drain has earned is).
  PassMax = 0
  \* No planted bug: the code as built.
  Mutant = "none"
