\* A Mutex with two waiters queued at once. Task 3 holds the lock from the
\* start and lets go once; task 1 queues, then task 2 asks (it queues behind
\* task 1, or barges if the lock is free by then). Task 1 may give up waiting:
\* a nudge it carried unused must pass to task 2. Every safety invariant holds.
\*
\* A short scenario, not a free run: each task asks once and the order of the
\* two arrivals is fixed, as in the bound-2 twins of tests/loom_sync.rs. Three
\* tasks that all ask as often as they like do not finish in the time a row
\* may take (over four million states). What the scenario keeps: two live
\* waiters, the nudge of the front only, its pass-on at a withdrawal, a barge
\* past the front and the handoff that follows.
\*
\* The runs checked: every run that starts in Init and takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
