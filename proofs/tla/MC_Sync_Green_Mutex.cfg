\* A Mutex shared by three tasks that lock (barging), cancel a pending lock
\* and move an owned guard, with Bound 2, in every interleaving of their
\* atomic steps. Every safety invariant holds.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: the
\* liveness property left this run (112,029 states either way, but 35
\* seconds with the property and 14 without: TLC checks a temporal property
\* over the whole graph at the end). Still here: every safety invariant over
\* every interleaving of three tasks. "Every waiter is served" is now
\* MC_Sync_Green_MutexLive's, on two tasks. Lean (Regolith/Sync.lean) covers
\* every number of tasks for what that property rests on: bounded_bypass,
\* release_hands_off_at_bound, no_stranded_head and handed_woken. No Lean
\* theorem states the temporal property itself.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, in which a started
\* operation finishes, a woken task is polled and a holder eventually lets go.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Three tasks use the lock: 1, 2 and 3.
  Tasks = {1, 2, 3}
  \* The lock is a semaphore; with one permit it is a Mutex.
  Kind = "Semaphore"
  \* One permit: at most one holder.
  Permits = 1
  \* Every task asks for one permit.
  Need <- NeedOne
  \* Every task is its own owner (unused unless the lock is reentrant).
  Owner <- OwnerEach
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* A guard may be handed to another task, which then drops it (owned guards).
  Owned = TRUE
  \* A waiter is handed the lock after two lost races.
  Bound = 2
  \* The task the "every waiter is served" promise names. This run does not check that promise (see
  \* SHRUNK above); MC_Sync_Green_MutexLive does.
  Watched = {1}
  \* No planted bug: the design.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: the waiter count is exactly the registered and queued waiters.
INVARIANT WaitersCounted
\* Checked in every state: only the holder of the drain token is inside the drain.
INVARIANT DrainExclusive
\* Checked in every state: every permit is somewhere: free, pending, held, or in a drainer's hand.
INVARIANT PermitsConserved
\* Checked in every state: never more permits out than exist (a Mutex: at most one holder); a
\* reentrant lock's guards all belong to its one owner.
INVARIANT MutualExclusion
\* Checked in every state: a reentrant lock's depth is the number of guards out, and it has an owner
\* exactly while a guard is out.
INVARIANT ReentrancyDepth
\* Checked in every state: no waiter loses the race more than Bound times during one acquire.
INVARIANT BoundedBypass
\* Checked in every state: nobody takes the lock by the fast path while a handoff is owed.
INVARIANT HandoffExclusive
\* Checked in every state: a waiter handed the lock is woken, and no waiter sleeps while it could
\* take the lock.
INVARIANT NoLostWakeup
\* Checked in every state: an idle task holds nothing: a waiter dropped after a handoff passed the
\* lock on.
INVARIANT CancelPassesOn
