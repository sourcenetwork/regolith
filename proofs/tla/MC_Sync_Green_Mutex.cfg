\* A Mutex (one permit) shared by three tasks that lock, try_lock, cancel a
\* pending lock and move an owned guard to another task, in every
\* interleaving of their atomic steps. Every safety invariant holds, and
\* every waiter is eventually served.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = TRUE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT FifoHandoff
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
PROPERTY EveryWaiterServed
