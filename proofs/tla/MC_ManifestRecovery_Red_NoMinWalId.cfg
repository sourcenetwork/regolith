\* The flush records no min_wal_id and an unlink fails. Recovery replays the
\* flushed log into the memtable, above a newer table of the same key, and
\* a read returns the older version. ReadsNewest fails.
\* The run: two keys, at most three writes, at most seven batches.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  Mutant = "NoMinWalId"
INVARIANT ReadsNewest
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT AckedSurvive
INVARIANT RotSafe
