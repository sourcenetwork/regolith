\* The design, one writer per group, every writer shape at once: a plain
\* single append, two writers sharing once key o1 (three single-append
\* writers in all), a writer appending twice, a writer appending once key
\* o2 twice, and a commit that appends nothing. A reader reads at any
\* moment. Every invariant holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1"}
  SharedOnce = {"s1", "s2"}
  Doubles = {"d1"}
  RepeatOnce = {"r1"}
  Silent = {"n1"}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_AtMostOnce
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
