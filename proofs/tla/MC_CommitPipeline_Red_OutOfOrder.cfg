\* The defect: the horizon is a fetch_max. A thread whose later slot is
\* applied raises it while an earlier committed slot is not applied, so a
\* reader sees the later commit without the earlier one. ReadersSeePrefix
\* fails; the other invariants are checked too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Committers = {1, 2}
  Ingesters = {3}
  Writes <- Overlapping
  Immediate = {1}
  MaxSlots = 6
  MaxStops = 0
  Mutant = "OutOfOrder"
INVARIANT ReadersSeePrefix
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
