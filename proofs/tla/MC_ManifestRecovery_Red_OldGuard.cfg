\* The old guard: a damaged end is dropped, but the open refuses when the
\* kept batches name no table while a table file holds data. A cut while
\* the first flush's batch waits for its sync leaves exactly that, with every
\* write still in the log. RecoveryOpens fails.
\* The run: two keys, at most three writes, at most seven batches.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  Mutant = "OldGuard"
INVARIANT RecoveryOpens
INVARIANT TypeOK
INVARIANT AckedSurvive
INVARIANT ReadsNewest
