\* The fix: a rotation syncs the sealed file before the next file opens.
\* Against every power cut at every state, recovery succeeds with commits
\* 1..n for some n, and keeps every record a sync made durable.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxRecords = 6
  MaxFiles = 4
  Rotation = "SyncFirst"
INVARIANT TypeOK
INVARIANT RecoversPrefix
INVARIANT KeepsSynced
