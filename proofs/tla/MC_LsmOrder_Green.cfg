\* The closure picker: every L0 file older than a picked one whose key range
\* overlaps the picked set's is picked too. Every read, at every snapshot,
\* returns the newest version through every put, flush and range compaction.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2, 3}
  MaxSeq = 5
  MaxL0 = 3
  Picker = "Closure"
INVARIANT TypeOK
INVARIANT ReadNewest
