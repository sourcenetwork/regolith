\* The closure picker: every L0 file older than a picked one whose key range
\* overlaps the picked set's is picked too. Every read, at every snapshot,
\* returns the newest version through every put, flush and range
\* compaction, with L1 kept as key-ordered tables searched by binary search.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2, 3}
  MaxSeq = 5
  MaxL0 = 3
  Picker = "Closure"
  MaxImm = 0
  FlushOrder = "Oldest"
  Levels = 1
  Ingest = "Off"
  Legacy = "Off"
INVARIANT TypeOK
INVARIANT ReadNewest
INVARIANT LevelsSorted
INVARIANT BisectIsScan
