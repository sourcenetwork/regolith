\* The closure picker: every L0 file older than a picked one whose key range
\* overlaps the picked set's is picked too. Every read, at every snapshot,
\* returns the newest version through every put, flush and range
\* compaction, with L1 kept as key-ordered tables searched by binary search.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: four
\* writes where there were five (29,816 states and 31 seconds; now 4,630
\* states and about 10). Still here: three keys, up to three L0 files, and
\* every put, flush and range compaction over four versions. The picker's
\* defect shows within four: MC_LsmOrder_Red_Intersect still fails with
\* four writes (it keeps five). Gone: a fifth write. Lean covers
\* every number of keys, versions and files: read_newest,
\* compact_range_reads_newest, pickL0_closed and pickL0_covers in
\* Regolith/LsmOrder.lean.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2, 3}
  \* Four writes: see SHRUNK above.
  MaxSeq = 4
  MaxL0 = 3
  Picker = "Closure"
  MaxImm = 0
  FlushOrder = "Oldest"
  \* A flush installs its table and retires its memtable in one publication.
  FlushPublish = "Together"
  Levels = 1
  Ingest = "Off"
  Legacy = "Off"
INVARIANT TypeOK
INVARIANT ReadNewest
\* No view a reader can load holds a version in two sources (E31).
INVARIANT NoDoubleSource
INVARIANT LevelsSorted
INVARIANT BisectIsScan
