\* GREEN. The design with commit_nowait. Transactions 1 and 3 commit at
\* Immediate through commit_nowait, so a group holding either of them and
\* needing an fsync is only written by its leader and left owed; a member's
\* poll, a blocking member or the next writer to take the pipeline claims
\* it with one CAS and lands it. Every invariant holds, the fsync of a group
\* runs once, and every commit gets its answer.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit answered) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Three transactions and one plain write.
  Txns = {1, 2, 3, 4}
  \* Commit 4 is the plain write of key 1.
  Plain = {4}
  \* Two keys.
  Keys = {1, 2}
  \* Transaction 3 reads key 1; the rest read nothing.
  Reads <- ReadsW
  \* Transaction 3 writes key 2; the rest write key 1.
  Writes <- WritesW
  \* Transactions 1 and 3 wait for an fsync.
  Immediate = {1, 3}
  \* Groups of up to three members.
  MaxGroup = 3
  \* A group's log write or fsync may fail.
  Faults = TRUE
  \* Transactions 1 and 3 are made by commit_nowait.
  Nowait = {1, 3}
  \* The real code: no bug planted.
  Mutant = "none"
