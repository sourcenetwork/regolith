\* close aborts an open transaction without claiming its state word, and
\* runs its on_abort; its owner then commits it, and its on_commit runs
\* too. AtMostOnce fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owners = {1, 2}
  Committers = {1, 2}
  MaxAttempts = 2
  Durability = "Immediate"
  Mutant = "CloseNoClaim"
INVARIANT AtMostOnce
INVARIANT TypeOK
INVARIANT CallbacksBeforeHooks
INVARIANT NoLostUpdate
INVARIANT AttemptIsolation
INVARIANT CommitAfterDurable
INVARIANT PanicAborts
