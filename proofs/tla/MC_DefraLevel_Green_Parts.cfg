\* DefraLevel projected reads [3.4]. A part reader reads part 1 of the part key
\* with get_parts and decides on it; two part writers each make one blind
\* write: an identical put, a put that changes part 2, a delete, or an operand
\* touching part 1 or part 2. No projected reader commits on changed inputs,
\* and a reader that found the key is never refused when every newer write is
\* an operand touching only part 2.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: the rewriter
\* left this run (24,801 states and 23 seconds; now 2,167 states and about
\* 7). Still here: the reader against every pair of the five blind writes, in
\* every order. MC_DefraLevel_Green_Parts_Rewriter runs the rewriter beside
\* the reader and one writer. What no GREEN run holds any more is the
\* rewriter and two writers in one behaviour; the six Parts REDs still run
\* all four transactions. Lean covers every size: parts_serial and
\* parts_current in Regolith/Validation.lean, touches_law in
\* Regolith/MergeOperator.lean.
