\* Green_Heads with no commutative prefix declared (the block range stays
\* content-addressed): the head stretches are recorded as at RepeatableRead,
\* the identical head write inside them is validated as a read, and the
\* second application is refused again. INV_DuplicateMergesCommit fails.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, never stalling for ever
\* while a step is possible.
SPECIFICATION Spec
\* Spend the states on the head-set workload: the writer, the patcher, the counter transactions and
\* the migrators never begin.
CONSTRAINT HeadsWorkloadOnly
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Transaction 3 appends one block (the id is also the block's id).
  Appenders = {3}
  \* Block 0 is the head that exists before anything runs.
  Seed = 0
  \* Transaction 4 is the pruner, which sweeps superseded head keys.
  Pruner = 4
  \* Transaction 5 is the writer, which reads the definition and writes a document from it.
  Writer = 5
  \* Transaction 6 is the patcher, which replaces the definition.
  Patcher = 6
  \* Transactions 7 and 8 each apply the same remote block.
  Mergers = {7, 8}
  \* The remote block's id is 2.
  Remote = 2
  \* The remote block names the seed, block 0, as its parent.
  RemoteParents = {0}
  \* No transaction blind-merges an increment into the counter.
  Incrementers = {}
  \* No transaction reads the counter and then merges into it.
  ReadMergers = {}
  \* No transaction puts the counter and merges on top.
  Rebasers = {}
  \* No transaction deletes the counter.
  Resetters = {}
  \* No plain range delete runs over the counter's range.
  Clearers = {}
  \* No transaction migrates the definition.
  Migrators = {}
  \* None of the later workloads runs.
  Extras <- NoExtras
  \* The caller declares no key range commutative: every scan stretch is recorded as at
  \* RepeatableRead.
  CommutativeRanges = {}
  \* The caller declares the block range content-addressed (KeyClass::ContentAddressed): a key there
  \* is named after its bytes, so writing it twice stores the same thing.
  ContentAddressedRanges = {6}
  \* Every transaction runs at DefraLevel: RepeatableRead with the relaxations the caller declares.
  Level = "DefraLevel"
  \* No planted bug: the commit rule as the engine has it.
  Mutant = "none"
\* The promise the planted bug must break: no merger is refused over writes identical to its own.
INVARIANT INV_DuplicateMergesCommit
