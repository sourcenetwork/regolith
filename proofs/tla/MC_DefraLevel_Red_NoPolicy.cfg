\* DefraLevel without a classifier records the head stretches as
\* RepeatableRead does, and refuses the second application again.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {3}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {7, 8}
  Remote = 2
  RemoteParents = {0}
  Incrementers = {}
  Resetters = {}
  CommutativeRanges = {}
  Level = "DefraLevel"
INVARIANT INV_DuplicateMergesCommit
