\* RED. The bug: the wake of a parked job tells only the queue whose poll
\* parked it. Story: queue 2's poll finds the job claimed by queue 1 and
\* moves on; queue 1's poll parks the job, and its owner stops polling for
\* good; the worker puts the tool down and the note tells queue 1 alone.
\* Queue 2 is never told, and the job is never run. JobLands breaks.
\*
\* The runs checked: every run that starts in Init, takes steps of Next, and in which a thread
\* that can go on does go on (an owner that stops polling excepted).
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
