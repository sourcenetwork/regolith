\* bug) is checked.
CONSTANTS
  \* Two queues wait for the job.
  Pollers = {q1, q2}
  \* No blocking caller.
  Blockers = {}
  \* The thread at work with a tool when the run starts.
  Worker = w
  \* It holds the second tool.
  WorkerTool = "b"
  \* The owner of queue 1 may stop polling for good.
  CanStop = {q1}
  \* The real code, or the bug planted.
  Mutant = "WakeOnlyStepper"
\* Checked as well.
INVARIANT TypeOK
