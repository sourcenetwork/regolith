\* #1911's DetachedOrder: the second commit numbers pending rows in begin
\* order (#1897's short-ID order), not commit order. A writer that began
\* first and committed second gets the smaller position.
\* INV_CommitOrder fails. Left out because the design breaks them too:
\* INV_OneCommitPerWrite (Detached) and INV_NumberedAtCommit
\* (DetachedNumbering). Every other invariant is checked first and holds up
\* to that state (no once key here).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Detached"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_NoDisjointConflict
INVARIANT INV_Dense
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_CommitOrder
