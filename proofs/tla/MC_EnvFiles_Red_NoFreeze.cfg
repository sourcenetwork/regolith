\* RED. The bug: a copy swaps its buffer in without freezing the old one.
\* Story: writer 1 takes WRITER on buffer 1; writer 2 copies buffer 1's
\* (empty) published part plus its record into buffer 2 and swaps it in;
\* writer 1 then publishes on buffer 1, which nobody reads any more. Its
\* append finished, and the current buffer lacks it. CurrentHoldsFinished
\* breaks.

