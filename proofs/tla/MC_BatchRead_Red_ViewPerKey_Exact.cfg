\* The defect's consequence: a write after the batch began shadows a version
\* its snapshot needs, a flush drops that version, and a key resolved against
\* the flushed view answers absent or older. BatchExact fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two keys, 1 and 2.
  Keys = {1, 2}
  \* The batch reads key 1, key 2, then key 1 again (the list ReadOneTwoOne of the model): multi_get
  \* accepts a key twice.
  BatchKeys <- ReadOneTwoOne
  \* At most 5 writes happen in a run.
  MaxSeq = 5
  \* At most 3 flushes happen in a run.
  MaxFlush = 3
  \* The planted bug (E6): each key is resolved against whichever view is current when its turn
  \* comes.
  Mode = "ViewPerKey"
\* The promise the planted bug must break: every key resolved so far got the newest version its
\* snapshot may see.
INVARIANT BatchExact
