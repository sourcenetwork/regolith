\* The bug: a copy of a live snapshot claims a fresh entry in its own slot
\* instead of joining the original's, with no confirm (it cannot change its
\* sequence). The original is live at 0; a commit makes the horizon 1; a
\* compaction samples 1 and reads the copy's slot while it is still empty;
\* the copy claims there; the original is dropped; the compaction reads the
\* original's now-free entry. The copy, at 0, is neither listed nor at or
\* above the sample.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* Renamed handles, threads, slots and entries count as one state.
SYMMETRY Sym
\* A state with no next step is fine: the commits are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three snapshot handles.
  Handles = {h1, h2, h3}
  \* Two threads.
  Threads = {t1, t2}
  \* Two slots.
  Slots = {s1, s2}
  \* Two entries per slot.
  Entries = {e1, e2}
  \* "No entry" is a value of its own.
  NoPos = NoPos
  \* Commits up to sequence 1: one commit, enough for every bug below.
  MaxSeq = 1
  \* The fix: confirm after the announce.
  Confirm = "Recheck"
  \* The fix: sample, then scan.
  Order = "SampleThenScan"
  \* The fix: release the entry the handle recorded.
  ReleaseMode = "Recorded"
  \* The bug: a copy claims a fresh entry.
  CloneMode = "Fresh"
  \* The fix: claim with one compare-and-swap.
  ClaimMode = "Cas"
  \* The fix: recheck the sequence after a join.
  JoinMode = "Recheck"
\* Fails: a live copy is neither listed nor above the sample.
INVARIANT LiveCovered
