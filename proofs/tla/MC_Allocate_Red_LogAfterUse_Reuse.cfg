\* The damage LogAfterUse does: c1's commit using 1..2 is durable while its
\* allocation record is not; a power cut keeps the commit and loses the
\* allocation, the counter recovers at 0, and c2 is handed 1..2 again and
\* commits them. INV_UsesUnique fails. Left out because it breaks first,
\* as its own RED: INV_UseDurable. Every other invariant is checked first
\* and holds up to that state.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Clients = {"c1", "c2", "c3"}
  N = 2
  MayAbort = {}
  Durability = "Immediate"
  MaxCrashes = 1
  Mutant = "LogAfterUse"
INVARIANT TypeOK
INVARIANT INV_NeverConflicts
INVARIANT INV_Unique
INVARIANT INV_Monotonic
INVARIANT INV_UsesUnique
