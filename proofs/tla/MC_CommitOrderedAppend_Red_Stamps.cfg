\* Stamps (regolith #216, #218; plan D1): the position is the commit's
\* sequence number, #1911's Green. With a commit that appends nothing, that
\* commit still takes a sequence: once n1 publishes sequence 1, a snapshot
\* at 1 holds no row at position 1, a hole a reader checking density fails
\* on. INV_Dense fails. Every other invariant is checked first and holds up
\* to that state (no once key here).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {"n1"}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Stamp"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_Dense
