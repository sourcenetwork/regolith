\* DefraLevel with the block range content-addressed (E17, D7). A collector
\* deletes the shared block once nothing refers to it at its snapshot; two
\* linkers put it again (or merge its own bytes into it) and pin it; a holder
\* records whether it is present. A linker's put is never validated, and its
\* read of the block is dropped, so two creates of one block both commit. The
\* collector's delete is validated as an ordinary write, so it loses to a pin
\* committed after its snapshot; a holder's read that found the block is
\* validated for presence only, so it loses to a collection committed after its
\* snapshot; and the collector's read of each hold is a full read, so a holder
\* that committed first refuses the collection. No reference ever dangles.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- ContentAddressedWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {6}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoDanglingReference
INVARIANT INV_LinksCommit
INVARIANT INV_HoldsCurrent
INVARIANT INV_ReasonsExact
