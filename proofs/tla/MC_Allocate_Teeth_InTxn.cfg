\* Teeth for Red_InTxn: the same mutant and callers, every invariant but
\* INV_NeverConflicts, over the whole state space. All hold: validation
\* keeps the values unique, at the price of the conflict.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Clients = {"c1", "c2", "c3"}
  N = 2
  MayAbort = {}
  Durability = "Immediate"
  MaxCrashes = 1
  Mutant = "InTxn"
INVARIANT TypeOK
INVARIANT INV_Unique
INVARIANT INV_Monotonic
INVARIANT INV_UseDurable
INVARIANT INV_UsesUnique
