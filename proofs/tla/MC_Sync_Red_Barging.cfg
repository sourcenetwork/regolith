\* try_lock ignores the registered waiters. A release frees the lock, and
\* before the drain hands it to the waiting task, another task's try_lock
\* takes it: it holds the lock although it got in line after a task that is
\* still waiting. FifoHandoff fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "Barging"
INVARIANT FifoHandoff
INVARIANT TypeOK
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT CancelPassesOn
