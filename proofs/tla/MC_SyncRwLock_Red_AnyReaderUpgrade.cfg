\* Plain readers may upgrade, as before D50. Two readers ask to upgrade and
\* each waits for the other to drop its read. NoUpgradeDeadlock fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Bound = 1
  Watched = {1}
  Asks <- AsksAll
  Mutant = "AnyReaderUpgrade"
INVARIANT NoUpgradeDeadlock
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT UpgradeHoldsBack
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
