INVARIANT BoundedBypass
\* Checked in every state: nobody barges while a handoff is owed.
INVARIANT HandoffExclusive
\* Checked in every state: no plain reader enters while an upgrade waits.
INVARIANT UpgradeHoldsBack
\* Checked in every state: no task waits in the queue while its own owner holds a guard.
INVARIANT NoSelfDeadlock
\* Checked in every state: a marked sleeper is woken, and no waiter sleeps while it could enter.
INVARIANT NoLostWakeup
\* Checked in every state: an idle task holds nothing.
