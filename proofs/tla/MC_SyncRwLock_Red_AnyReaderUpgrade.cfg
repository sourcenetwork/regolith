\* The planted bug: any plain reader may upgrade (the upgrade that was
\* removed). Both readers ask; each waits for the other to leave, and neither
\* does. NoUpgradeDeadlock fails.
\*
\* The runs checked: every run that starts in Init and takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two tasks use the lock: 1 and 2.
  Tasks = {1, 2}
  \* The lock is a plain RwLock.
  Kind = "Plain"
  \* Every task is its own owner.
  Owner <- OwnerEach
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* A waiter is owed a handoff after one lost race.
  Bound = 1
  \* Every task reads.
  Role <- RoleReaders
  \* Tasks 1 and 2 may upgrade.
  Upgrades = {1, 2}
  \* No task waits: each only tries.
  Waits = {}
  \* No waiting future is dropped.
  Drops = {}
  \* Every task asks for the lock once: a short scenario.
  Turns <- TurnsOnce
  \* Tasks 1 and 2 hold their guards when the run starts.
  Start = {1, 2}
  \* The tasks may ask in any order.
  Follows <- FollowsNobody
  \* No "is eventually served" promise is checked in this run.
  Watched = {}
  \* The planted bug: a task that holds a plain read may ask to upgrade it.
  Mutant = "AnyReaderUpgrade"
\* The promise the planted bug must break: no reader an upgrade waits for is itself asleep on the
\* lock.
INVARIANT NoUpgradeDeadlock
