\* RED. The bug: a commit shares a plain writer's bound on its steps, and
\* gives up with the stop still on. Story: the stop is on and the gate free;
\* commit w1 takes the gate and runs a relieving step; the step makes
\* progress and leaves the stop on; w1 counts it and returns busy. Its
\* transaction cannot be committed again: nothing of it is written, and the
\* stop was being relieved. NoLostCommit breaks.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* Two pieces of progress may leave the stop on.
  MaxSteps = 2
  \* The planted bug.
  Mode = "CommitGivesUp"
  \* The engine never latches and no rotation flushes at the memtable cap.
  Failures = FALSE
  \* The relief never fails.
  ReliefFails = FALSE
  \* Writer w1 is a commit; w2 is a plain write.
  Commits = {w1}
\* The promise the planted bug must break: no commit is lost to the stall.
INVARIANT NoLostCommit
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
