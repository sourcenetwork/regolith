\* An operator whose partial_merge is not exact (a rounding sum, as with
\* floating point) has an operand-only stripe folded anyway. Two operands of
\* 1 applied one at a time to nothing round away to 0; their partial_merge
\* is 2. The head reads 2 after the compaction where it read 0 before.
\* HeadKept fails; the newest sequence is kept.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1}
  MaxSeq = 4
  MaxRuns = 2
  Readers = {r1, r2}
  PutValues = {1}
  Cap = 3
  Operator = "Inexact"
  FoldOperandOnly = "Always"
  Capture = "AfterInputs"
  Stripes = "PerSnapshot"
  Filter = "None"
INVARIANT HeadKept
INVARIANT TypeOK
INVARIANT SnapshotReadsKept
INVARIANT NewestKept
