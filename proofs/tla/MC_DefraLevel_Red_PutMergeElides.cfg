\* Green_Counters with the identical-write elision allowed on a key the batch
\* also merges into (Mutant PutMergeElides, the rule this spec had before):
\* the rebase puts 1, a concurrent increment has just left 1, the put is
\* elided, and the rebase erases that increment. INV_CounterExact fails.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, never stalling for ever
\* while a step is possible.
SPECIFICATION Spec
\* Spend the states on the counter workload: the appenders, the pruner, the writer, the patcher, the
\* mergers and the migrators never begin.
CONSTRAINT CounterWorkloadOnly
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Transaction 1 appends one block (the id is also the block's id).
  Appenders = {1}
  \* Block 0 is the head that exists before anything runs.
  Seed = 0
  \* Transaction 4 is the pruner, which sweeps superseded head keys.
  Pruner = 4
  \* Transaction 5 is the writer, which reads the definition and writes a document from it.
  Writer = 5
  \* Transaction 6 is the patcher, which replaces the definition.
  Patcher = 6
  \* No transaction applies a remote block.
  Mergers = {}
  \* The remote block's id is 9.
  Remote = 9
  \* The remote block names no parent (unused when no merger runs).
  RemoteParents = {}
  \* Transactions 7 and 8 each merge an increment into the counter without reading it.
  Incrementers = {7, 8}
  \* Transaction 11 reads the counter, then merges an increment into it.
  ReadMergers = {11}
  \* Transaction 12 puts the counter to 1 and merges an increment on top, in one commit.
  Rebasers = {12}
  \* Transaction 10 deletes the counter.
  Resetters = {10}
  \* Id 13 is a plain range delete over the counter's range (Db::delete_range), not a transaction.
  Clearers = {13}
  \* No transaction migrates the definition.
  Migrators = {}
  \* None of the later workloads runs.
  Extras <- NoExtras
  \* The caller declares the head range and the marker range commutative
  \* (KeyClass::CommutativePrefix): a scan stretch that stays inside one of them records nothing.
  CommutativeRanges = {1, 2}
  \* The caller declares no key range content-addressed.
  ContentAddressedRanges = {}
  \* Every transaction runs at DefraLevel: RepeatableRead with the relaxations the caller declares.
  Level = "DefraLevel"
  \* The planted bug: a put of the value the key already holds is skipped although the same batch
  \* merges on top of it.
  Mutant = "PutMergeElides"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* The promise the planted bug must break: the counter holds exactly what its contract says: no
\* increment lost, none counted twice, and a reset really resets.
INVARIANT INV_CounterExact
