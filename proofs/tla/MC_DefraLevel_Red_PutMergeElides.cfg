\* Green_Counters with the identical-write elision allowed on a key the batch
\* also merges into (Mutant PutMergeElides, the rule this spec had before):
\* the rebase puts 1, a concurrent increment has just left 1, the put is
\* elided, and the rebase erases that increment. INV_CounterExact fails.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {11}
  Rebasers = {12}
  Resetters = {10}
  Clearers = {13}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PutMergeElides"
INVARIANT TypeOK
INVARIANT INV_CounterExact
