\* A pending lock is dropped just after a handoff gave it the lock, and the
\* drop keeps it: the task goes idle owning the lock. CancelPassesOn fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  Bound = 1
  Watched = {1}
  Mutant = "CancelNoPassOn"
INVARIANT CancelPassesOn
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT NoLostWakeup
