\* A pending lock is dropped just after the drainer handed it the lock, and
\* the drop does not pass the lock on: the task goes idle still owning it,
\* and the task waiting behind it never gets it. CancelPassesOn fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "CancelNoPassOn"
INVARIANT CancelPassesOn
INVARIANT TypeOK
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT FifoHandoff
INVARIANT NoLostWakeup
