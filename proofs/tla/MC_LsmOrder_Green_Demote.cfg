\* A 0.1.x database whose ingest left a level with overlapping recorded
\* ranges (E14). The first open demotes every level from L1 down to the
\* deepest overlapping one to the end of L0, level by level, newest table
\* first (D13). From then on every read returns the newest version, every
\* level is sorted and non-overlapping, and binary search finds what a
\* linear scan finds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 4
  MaxL0 = 2
  Picker = "Closure"
  MaxImm = 0
  FlushOrder = "Oldest"
  \* A flush installs its table and retires its memtable in one publication.
  FlushPublish = "Together"
  Levels = 2
  Ingest = "Off"
  Legacy = "Demote"
INVARIANT TypeOK
INVARIANT ReadNewest
\* No view a reader can load holds a version in two sources (E31).
INVARIANT NoDoubleSource
INVARIANT LevelsSorted
INVARIANT BisectIsScan
