\* The open keeps the overlapping level. Binary search over its overlapping
\* recorded ranges lands on the widened table, which does not hold the key,
\* and the read misses the table that does. ReadNewest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 4
  MaxL0 = 2
  Picker = "Closure"
  MaxImm = 0
  FlushOrder = "Oldest"
  Levels = 2
  Ingest = "Off"
  Legacy = "Keep"
INVARIANT ReadNewest
INVARIANT TypeOK
