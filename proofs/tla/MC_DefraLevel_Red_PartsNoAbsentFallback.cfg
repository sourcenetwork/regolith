\* Green_Parts with a projected read that found nothing left projected. A
\* writer deletes the key, the part reader reads nothing, and an operand
\* touching only part 2 creates the key again: the reader commits on an absence
\* that is gone. INV_PartsCurrent fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- PartsWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PartsNoAbsentFallback"
INVARIANT INV_PartsCurrent
INVARIANT INV_PartsRelaxed
INVARIANT INV_ReasonsExact
