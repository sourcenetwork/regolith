\* The design under Eventual durability: as Green_Immediate, but commits do
\* not sync; a background sync may come at any moment. A power cut can drop
\* allocations and the commits that used them together, never a use
\* without its allocation, so the recovered counter is above every value a
\* surviving commit uses and nothing still in use is handed out again.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Clients = {"c1", "c2", "c3", "c4"}
  N = 2
  MayAbort = {"c2"}
  Durability = "Eventual"
  MaxCrashes = 2
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NeverConflicts
INVARIANT INV_Unique
INVARIANT INV_Monotonic
INVARIANT INV_UseDurable
INVARIANT INV_UsesUnique
