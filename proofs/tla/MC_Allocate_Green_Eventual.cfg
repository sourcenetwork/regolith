\* The design under Eventual durability: as Green_Immediate, but commits do
\* not sync; a background sync may come at any moment. A power cut can drop
\* allocations and the commits that used them together, never a use
\* without its allocation, so the recovered counter is above every value a
\* surviving commit uses and nothing still in use is handed out again.
\*
\* SHRUNK to finish in a few seconds on one TLC worker: three callers where
\* there were four (407,317 states, 54 to 72 seconds of CPU; now 11,746 and
\* under 5). Still here: two callers that commit, one that may abort and
\* leave a gap, every order of their allocations, commits and background
\* syncs, and two power cuts. Gone: a third committing caller, which adds
\* interleavings of the same three steps and no new kind of step;
\* MC_Allocate_Green_Immediate keeps four callers. Lean covers every number
\* of callers and records: reachable_inv, ranges_disjoint, uses_allocated
\* and alloc_fresh in Regolith/Allocate.lean.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three callers: see SHRUNK above.
  Clients = {"c1", "c2", "c3"}
  N = 2
  MayAbort = {"c2"}
  Durability = "Eventual"
  MaxCrashes = 2
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NeverConflicts
INVARIANT INV_Unique
INVARIANT INV_Monotonic
INVARIANT INV_UseDurable
INVARIANT INV_UsesUnique
