\* The fast path ignores the owed bit. Task 1, at the head with both permits
\* owed to it, waits for the second; task 2 barges and takes the one
\* already reserved. HandoffExclusive fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 2
  Need <- NeedFirstAll
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  Bound = 1
  Watched = {1}
  Mutant = "IgnoreOwed"
INVARIANT HandoffExclusive
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
