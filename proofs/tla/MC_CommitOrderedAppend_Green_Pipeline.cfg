\* The Phase 7 pipeline: a second group decides while the first is decided
\* but not yet published, reading the decided prefix (the view plus the
\* unpublished group). Groups of two, an abort and a WAL error that fails
\* both groups in flight. Every invariant holds.
\*
\* SHRUNK to finish in well under 20 seconds of CPU on one TLC worker: one
\* writer without a once key where there were two (55,124 states and 23
\* seconds; now 5,116 states and about 7). Still here: four writers, so two
\* groups of two in flight at once, with the plain writer that may abort,
\* the two that share a once key and the one that appends twice, and the WAL
\* error. Gone: a fifth writer, which made a third group possible behind the
\* two in flight; MC_CommitOrderedAppend_Green_Writers and _Groups run more
\* writers at depth 1. Lean covers every number of writers and appends: reachable_inv,
\* dense_from_one, unique_positions, at_most_once and commit_order in
\* Regolith/Append.lean.
