\* The Phase 7 pipeline: a second group decides while the first is decided
\* but not yet published, reading the decided prefix (the view plus the
\* unpublished group). Groups of two, an abort and a WAL error that fails
\* both groups in flight. Every invariant holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2"}
  SharedOnce = {"s1", "s2"}
  Doubles = {"d1"}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {"a1"}
  GroupSize = 2
  Depth = 2
  MaxWalErrors = 1
  Mode = "Append"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_AtMostOnce
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
