\* A ReentrantRwLock, Bound 1. Tasks 1 and 2 share Owner 1, task 3 is Owner
\* 2; each task nests up to two guards. Every safety invariant holds, and
\* no task waits while holding a guard. Liveness is
\* MC_SyncRwLock_Green_ReentrantLive's.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Owner <- OwnerPair
  MaxDepth = 2
  Bound = 1
  Watched = {1, 3}
  Asks <- AsksAll
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT UpgradeHoldsBack
INVARIANT NoUpgradeDeadlock
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
