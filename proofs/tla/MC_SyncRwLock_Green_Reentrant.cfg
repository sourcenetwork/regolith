\* A ReentrantRwLock. Tasks 1 and 2 share Owner 1, task 3 is Owner 2; each
\* task nests up to two guards, reading under its owner's read or write.
\* Every safety invariant holds, and no task ever waits while holding a
\* guard: a nested read never queues behind a waiting writer. Liveness is
\* MC_SyncRwLock_Green_ReentrantLive's.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Owner <- OwnerPair
  MaxDepth = 2
  Watched = {1, 3}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT ReadersWaitOnePhase
INVARIANT WritersBoundedBypass
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
