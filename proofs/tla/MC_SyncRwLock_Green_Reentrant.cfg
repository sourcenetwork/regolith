\* A ReentrantRwLock. Tasks 1 and 2 belong to one owner: task 1 writes and
\* task 2 reads under that write, so when the write is dropped first it
\* becomes the owner's read (the downgrade). Task 3, another owner, waits to
\* write meanwhile. Every safety invariant holds.
\*
\* A short scenario: each task asks once.
\*
\* The runs checked: every run that starts in Init and takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Three tasks use the lock: 1, 2 and 3.
  Tasks = {1, 2, 3}
  \* The lock is a ReentrantRwLock: an owner may lock it again while holding it.
  Kind = "Reentrant"
  \* Tasks 1 and 2 share one owner; task 3 is another owner.
  Owner <- OwnerPair
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* A waiter is owed a handoff after one lost race.
  Bound = 1
  \* Task 2 reads; the others write.
  Role <- RoleWriteReadWrite
  \* Nobody upgrades.
  Upgrades = {}
  \* Tasks 1 and 3 wait when their request does not fit; task 2 only tries.
  Waits = {1, 3}
  \* No waiting future is dropped.
  Drops = {}
  \* Every task asks for the lock once: a short scenario.
  Turns <- TurnsOnce
  \* Nobody holds the lock when the run starts.
  Start = {}
  \* The tasks may ask in any order.
  Follows <- FollowsNobody
  \* No "is eventually served" promise is checked in this run.
  Watched = {}
  \* No planted bug: the code as built.
  Mutant = "none"
