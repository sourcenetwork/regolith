\* RED. The bug: a queue unit that finds no free slot waits for one, as a
\* Blocking read may (the drain), instead of parking.
\* Story: thread 1 reads in the only slot; thread 2's unit wants table 2,
\* finds the slot busy, and sits at "claim" with no step of its own until
\* thread 1 leaves. The poll that ran it waits on thread 1. NeverWaits
\* breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* The reading threads.
  Threads = {1, 2}
  \* The tables they read.
  Files = {1, 2}
  \* How many slots: max_open_files.
  Cap = 1
  \* Which table each thread reads.
  Want <- WantTwo
  \* How many times each thread reads it.
  Reads = 2
  \* At most this many file openings in one run: one per read.
  MaxDesc = 4
  \* Thread 2's reads are queue units.
  NoWait = {2}
  \* The planted bug.
  Mutant = "Waits"
\* The invariant this bug must break.
INVARIANT NeverWaits
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT AtMostCap
