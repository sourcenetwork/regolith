\* The fix: readers announce, sample and confirm; the compaction samples the
\* horizon before it scans. Against every interleaving with writers and a
\* compaction that runs again and again, its minimum never exceeds a live
\* snapshot, every live snapshot is listed or at or above its sample, and a
\* live slot holds exactly its snapshot.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: two readers
\* where there were three (369,270 states and 15 to 21 seconds; now 22,816
\* states and about 6). Still here: two readers announcing, sampling and
\* confirming against each other, the writers raising the horizon three
\* times, and the compaction scanning again and again. Both defects still
\* show with two readers (Red_NoConfirm and Red_ScanThenSample fail with
\* two; they keep three). Gone: a third reader, which is interchangeable
\* with the other two. Lean covers every number of readers and every
\* interleaving of their accesses: scan_respects_live in
\* Regolith/SnapshotRegistry.lean.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two readers: see SHRUNK above.
  Readers = {r1, r2}
  MaxSeq = 3
  Confirm = "Recheck"
  Order = "SampleThenScan"
INVARIANT TypeOK
INVARIANT MinBelowLive
INVARIANT LiveCovered
INVARIANT LiveSlotExact
