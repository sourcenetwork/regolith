\* The fix, every part of it. Two handles on two threads over two slots of
\* one entry, threads sharing slots and swapping them, handles moving,
\* copies, commits, and a compaction that runs again and again: every
\* promise holds.
\*
\* SHRUNK twice to finish in a few seconds of CPU on one TLC worker. First
\* one entry per slot where there were two (1.26 million states, over 3
\* minutes, down to 118 thousand); then two handles where there were three
\* (32 seconds, now about 14 thousand states). Two handles on two threads
\* still share a slot and swap slots, move between threads, and one is a
\* copy that joins the other's counted entry, beside a commit and the
\* compaction's scans. Three handles at once are in
\* MC_SnapshotRegistry_Green_ThreeHandles, on one thread. What no run
\* shows any more is three handles on two threads, and one slot holding
\* two sequences at once: the Lean proof (scan_respects_live,
\* clone_respects_live, pins_exact) covers every number of handles,
\* threads, slots and entries.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* Renamed handles, threads, slots and entries count as one state.
SYMMETRY Sym
\* A state with no next step is fine: the commits are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two snapshot handles: see SHRUNK above.
  Handles = {h1, h2}
  \* Two threads.
  Threads = {t1, t2}
  \* Two slots.
  Slots = {s1, s2}
  \* One entry per slot: see SHRUNK above.
  Entries = {e1}
  \* "No entry" is a value of its own.
  NoPos = NoPos
  \* Commits up to sequence 1: one commit, enough for every bug below.
  MaxSeq = 1
  \* The fix: confirm after the announce.
  Confirm = "Recheck"
  \* The fix: sample, then scan.
  Order = "SampleThenScan"
  \* The fix: release the entry the handle recorded.
  ReleaseMode = "Recorded"
  \* The fix: a copy joins the original's entry.
  CloneMode = "Join"
  \* The fix: claim with one compare-and-swap.
  ClaimMode = "Cas"
  \* The fix: recheck the sequence after a join.
  JoinMode = "Recheck"
\* Every variable holds the kind of value it should.
INVARIANT TypeOK
\* The minimum is at most every live snapshot.
INVARIANT MinBelowLive
\* A live snapshot is listed or at or above the sample.
INVARIANT LiveCovered
\* A live snapshot's entry holds exactly its sequence.
INVARIANT LiveEntryExact
\* An entry's count is exactly the handles recorded there.
INVARIANT PinsExact
\* The list holds only sequences pins held during the scan.
INVARIANT ListFromPins
