\* The fix: readers announce, sample and confirm; the compaction samples the
\* horizon before it scans. Against every interleaving with writers and a
\* compaction that runs again and again, its minimum never exceeds a live
\* snapshot, every live snapshot is listed or at or above its sample, and a
\* live slot holds exactly its snapshot.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers = {r1, r2, r3}
  MaxSeq = 3
  Confirm = "Recheck"
  Order = "SampleThenScan"
INVARIANT TypeOK
INVARIANT MinBelowLive
INVARIANT LiveCovered
INVARIANT LiveSlotExact
