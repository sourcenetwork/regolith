\* The fix, every part of it. Three handles on two threads over two slots of
\* two entries, threads sharing slots and swapping them, handles moving,
\* copies, commits, and a compaction that runs again and again: every
\* promise holds.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* Renamed handles, threads, slots and entries count as one state.
SYMMETRY Sym
\* A state with no next step is fine: the commits are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three snapshot handles.
  Handles = {h1, h2, h3}
  \* Two threads.
  Threads = {t1, t2}
  \* Two slots.
  Slots = {s1, s2}
  \* Two entries per slot.
  Entries = {e1, e2}
  \* "No entry" is a value of its own.
  NoPos = NoPos
  \* Commits up to sequence 1: one commit, enough for every bug below.
  MaxSeq = 1
  \* The fix: confirm after the announce.
  Confirm = "Recheck"
  \* The fix: sample, then scan.
  Order = "SampleThenScan"
  \* The fix: release the entry the handle recorded.
  ReleaseMode = "Recorded"
  \* The fix: a copy joins the original's entry.
  CloneMode = "Join"
  \* The fix: claim with one compare-and-swap.
  ClaimMode = "Cas"
  \* The fix: recheck the sequence after a join.
  JoinMode = "Recheck"
\* Every variable holds the kind of value it should.
INVARIANT TypeOK
\* The minimum is at most every live snapshot.
INVARIANT MinBelowLive
\* A live snapshot is listed or at or above the sample.
INVARIANT LiveCovered
\* A live snapshot's entry holds exactly its sequence.
INVARIANT LiveEntryExact
\* An entry's count is exactly the handles recorded there.
INVARIANT PinsExact
\* The list holds only sequences pins held during the scan.
INVARIANT ListFromPins
