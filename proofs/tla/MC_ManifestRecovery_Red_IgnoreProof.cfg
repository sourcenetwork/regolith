\* The open drops every damaged end. Rot in the first flush's synced batch,
\* which a later flush's batch proves synced, is dropped though that flush's
\* log is gone. RotSafe fails.
\* The run: two keys, at most three writes, at most seven batches.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  MaxFrozen = 1
  Sealed = FALSE
  Mutant = "IgnoreProof"
INVARIANT RotSafe
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT AckedSurvive
INVARIANT ReadsNewest
