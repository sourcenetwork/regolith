\* Immediate durability: a record is published only once durable. Writers
\* commit, a sync may come at any moment, both readers read, and one power
\* cut keeps any gap-free prefix holding every durable record. Every
\* acknowledged commit and every position a reader saw survives, the log
\* stays dense and unique, and neither reader skips.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: one writer
\* without a once key where there were two (184,365 states and 22 seconds;
\* now 7,649 states and under 4). Still here: that writer beside the two
\* that share a once key, the sync at any moment, both readers and the power
\* cut, in every order. Gone: a second plain writer, which adds orders of
\* the same steps. Lean covers every number of writers and records:
\* snapshot_sees_prefix, dense_from_one, unique_positions and at_most_once
\* in Regolith/Append.lean, recovers_prefix in Regolith/WalRecovery.lean.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  \* One writer without a once key: see SHRUNK above.
  Singles = {"a1"}
  SharedOnce = {"s1", "s2"}
  Doubles = {}
  Durability = "Immediate"
  MaxCrashes = 1
INVARIANT TypeOK
INVARIANT INV_Dense
INVARIANT INV_UniqueCursors
INVARIANT INV_AtMostOnce
INVARIANT INV_NoSkip
INVARIANT INV_VisibleDurable
INVARIANT INV_AckStable
INVARIANT INV_ExternalStable
