\* Immediate durability: a record is published only once durable. Writers
\* commit, a sync may come at any moment, both readers read, and one power
\* cut keeps any gap-free prefix holding every durable record. Every
\* acknowledged commit and every position a reader saw survives, the log
\* stays dense and unique, and neither reader skips.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2"}
  SharedOnce = {"s1", "s2"}
  Doubles = {}
  Durability = "Immediate"
  MaxCrashes = 1
INVARIANT TypeOK
INVARIANT INV_Dense
INVARIANT INV_UniqueCursors
INVARIANT INV_AtMostOnce
INVARIANT INV_NoSkip
INVARIANT INV_VisibleDurable
INVARIANT INV_AckStable
INVARIANT INV_ExternalStable
