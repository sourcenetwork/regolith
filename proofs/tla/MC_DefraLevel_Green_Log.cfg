\* DefraLevel Log keys [3.2, 3.6]. Two appenders append; a log reader reads the
\* head, appends, and stores the head it read as its cursor. Positions are
\* assigned at commit from the head the view holds, so the log stays dense, no
\* append conflicts, the reader's log read is never validated, and the reader
\* never sees its own append.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- LogWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_LogNeverConflicts
INVARIANT INV_LogDense
INVARIANT INV_NoPhantomAppend
INVARIANT INV_ReasonsExact
