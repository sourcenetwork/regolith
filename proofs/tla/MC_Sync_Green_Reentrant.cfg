\* A ReentrantMutex. Tasks 1 and 2 share Owner 1 (tasks on one pinned
\* thread, say), task 3 is Owner 2; each task nests up to two guards. Every
\* safety invariant holds, the depth returns to 0 exactly when the last
\* guard drops, and if no owner keeps the lock forever every waiter is
\* served.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerPair
  MaxDepth = 2
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1, 3}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT FifoHandoff
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
PROPERTY ReentrantServed
