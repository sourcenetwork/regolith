\* A ReentrantMutex, Bound 1. Tasks 1 and 2 share Owner 1, task 3 is Owner
\* 2; each task nests up to two guards. Every safety invariant holds, and
\* the depth returns to 0 exactly when the last guard drops. Liveness is
\* MC_Sync_Green_ReentrantLive's.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerPair
  MaxDepth = 2
  Owned = FALSE
  Bound = 1
  Watched = {1, 3}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
