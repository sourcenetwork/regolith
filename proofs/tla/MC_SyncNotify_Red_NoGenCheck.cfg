\* A notified() future registers, notify_waiters runs before it pushes its
\* node, and the push does not compare generations. The broadcast could not
\* see the node, and the waiter, registered before it, waits on.
\* NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Notifiers = {3}
  Watched = {1}
  MaxBcast = 1
  Mutant = "NoGenCheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT FifoHandoff
INVARIANT CancelPassesOn
