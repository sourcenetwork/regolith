\* GREEN, inline compaction off (L32). No worker and inline compaction
\* turned off: writer w2, a plain write, is handed the wait when the stop
\* holds it and its caller compacts; writer w1, a commit, relieves the stop
\* itself, taking the gate when it is free and waiting on the stall's unit
\* when another thread's step holds it. One job, and a relief that may fail
\* and recover. No commit is lost (NoLostCommit), and nobody waits with
\* nobody on the way to land its unit (NoStrandedWait).
\*
\* SIZED like MC_StallRelief_Green_Commit, of which this is the same pair
\* with inline compaction off.
