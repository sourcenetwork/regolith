\* The bug: the leader trusts each transaction's early check and checks only
\* the members accepted earlier in its group, not the versions that landed
\* above the horizon the early check sampled. Transaction 1 checks itself at
\* horizon 0 and queues; transaction 2 commits key 1 in a group of its own;
\* transaction 1's group then accepts it over that write. SerialEquivalent
\* fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Plain = {4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  \* No commit here is made by commit_nowait: every leader syncs its own group.
  Nowait = {}
  Mutant = "TrustEarly"
INVARIANT SerialEquivalent
INVARIANT TypeOK
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT BoundedTurn
INVARIANT NoStuckTicket
