\* The drain never hands off: every release frees the lock and wakes the
\* head, and a barger takes it before the head is polled, again and again.
\* The head loses more than Bound times. BoundedBypass fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  Bound = 1
  Watched = {1}
  Mutant = "UnboundedBarging"
INVARIANT BoundedBypass
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT HandoffExclusive
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
