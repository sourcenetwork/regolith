\* Single-threaded wasm: the same tasks on one thread, whose event loop
\* calls poll_io only when no task can run. One thread completes
\* everything: every invariant, EveryTicketCompletes and AllTasksFinish
\* hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  CommitTasks = {1, 2}
  Callbacks = {1}
  ReadTasks = {3, 4}
  Blocks = {1}
  BlockOf <- OneBlock
  IoThreads = {}
  SelfJobs = 1
  Mode = "single"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT NoLostWakeup
INVARIANT TicketCompletesWithItsIo
INVARIANT CallbackOnce
INVARIANT SingleFlight
INVARIANT IoPendingFires
INVARIANT NothingStuck
PROPERTY EveryTicketCompletes
PROPERTY AllTasksFinish
