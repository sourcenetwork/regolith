\* GREEN. One thread does all of it: it reads, misses, polls its own queue
\* when it has nothing else to run, and finishes everything by itself (the
\* single-threaded wasm case).
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: the
\* liveness property left this run (45,109 states either way, but 21 seconds
\* with the property and about 8 without). Still here: every safety invariant
\* at the full size, one thread reading two blocks and starting a job, with
\* idling, waking and a close at any point. "Everything finishes" is now
\* MC_NonBlocking_Green_SingleLive's, on one thread with one block and the
\* job. Lean covers the safety for every number of threads and units:
\* claim_once, told_at_most_once, every_waiter_told, no_lost_idle_wakeup and
\* busy_never_woken in Regolith/IoQueue.lean; single_thread_finishes there
\* proves that one thread finishes everything. No Lean theorem states that
\* many threads do.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* One thread, with one queue: the single-threaded wasm case.
  Threads = {1}
  \* Two blocks it reads.
  Blocks = {1, 2}
  \* It reads both.
  Want <- WantSingle
  \* One job regolith starts on its call.
  Jobs = {3}
  \* The job is the one thread's.
  JobOf <- JobOfSingle
  \* Each block and the job need one unit.
  MaxUnits = 3
  \* No sync rounds in this setup.
  Rounds = {}
  \* So no round covers a commit.
  CommittersOf <- CommittersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK
\* Must hold in every state.
INVARIANT SingleRun
\* Must hold in every state.
INVARIANT ExactlyOnce
\* Must hold in every state.
INVARIANT EveryWaiterTold
\* Must hold in every state.
INVARIANT OwnQueue
\* Must hold in every state.
INVARIANT NoLostIdleWakeup
\* Must hold in every state.
INVARIANT BusyNeverWoken
\* Must hold in every state.
INVARIANT NoOrphanUnit
