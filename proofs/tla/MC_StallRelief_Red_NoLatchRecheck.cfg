\* RED. The bug: a contended writer registers without reading the latch's
\* flag again. Story: the stop is on; writer 1's relieving step takes the
\* gate; writer 2 finds it held, and is about to register. The engine
\* latches: its flag is stored and its landing done, with writer 2 not on
\* the unit yet. Writer 2 registers, sees the stop on and no progress
\* missed, and waits on a unit the latch has already been through.
\* NoWaitOnceLatched breaks.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* Two pieces of progress may leave the stop on.
  MaxSteps = 2
  \* The planted bug.
  Mode = "NoLatchRecheck"
  \* The engine may latch.
  Failures = TRUE
  \* The relief never fails: the run is the one this row had before a
  \* failing relief was modelled.
  ReliefFails = FALSE
  \* No writer is a transaction's commit: the run is the one this row had
  \* before commits were modelled.
  Commits = {}
  \* Inline compaction is on wherever stopped writers relieve: the run is the one
  \* this row had before inline compaction off was modelled.
  InlineOff = FALSE
\* The invariant this bug must break.
INVARIANT NoWaitOnceLatched
\* Checked as well.
INVARIANT TypeOK
