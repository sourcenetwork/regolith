\* Teeth for Red_Counter: the same design and writers, every invariant but
\* INV_NoDisjointConflict, over the whole state space. All hold, so the
\* counter in the transaction breaks exactly the no-conflict property:
\* positions stay unique, dense and in commit order.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Counter"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
