\* GREEN. Two threads publish one slot and two listeners register on it at
\* any moment, before or after it lands. The first publisher may stop for
\* good before it takes the sheet. Each listener is told exactly once,
\* after the commit is visible, by whichever publisher took the sheet or,
\* when it found the sheet closed, by its own caller.
\*
\* The runs checked: every run that starts in Init, takes steps of Next, and in which a thread
\* that can go on does go on (a publisher that stops excepted).
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: who takes part, and which code (the real one or a planted
\* bug) is checked.
CONSTANTS
  \* Two threads publish the slot.
  Publishers = {p1, p2}
  \* Two listeners wait for it to land.
  Listeners = {l1, l2}
  \* The first publisher may stop for good; the second never does.
  CanStop = {p1}
  \* It stops only before it takes the sheet.
  StopAnywhere = FALSE
  \* The slot is published.
  Outcome = "visible"
  \* The real code, or the bug planted.
  Mutant = "none"
