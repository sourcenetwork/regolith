\* GREEN, with a relief that fails (E36). Two writers and one job, as in
\* MC_StallRelief_Green, and on top: the work that relieves the stop may
\* fail at any moment (its failure stored first, the unit landed second) and
\* recover at any later one, as often as it likes. A write stopped while the
\* failure is recorded is told it, recording it lands the unit, and a writer
\* reads the record again once registered, while the stop still holds.
\* NoStrandedWait, NoWaitOnceLatched and NoWaitOnceFailing hold.
\*
\* SIZED to finish in a few seconds of CPU on one TLC worker: two writers,
\* and two pieces of progress that may leave the stop on where the row
\* without failures has three; the engine does not latch and no rotation
\* flushes at the cap in this row (MC_StallRelief_Green_Failures has those).
\* Two writers still hold every case the rule is for: a writer waiting when
\* the relief fails, a writer that registers between the failure's record
\* and its landing or after both, a relief that recovers before or after the
\* landing, and a second failure after a recovery. More writers, and a
\* relief that fails on an engine that also latches (448,824 states with
\* both, 13 seconds of CPU), are left to the Lean proof
\* (no_wait_once_failing), which covers every number of writers and proves
\* each rule over all the steps at once.
