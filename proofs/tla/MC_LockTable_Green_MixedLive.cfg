\* GREEN. Everything at once, as in MC_LockTable_Green_Mixed, in a run of
\* four lock calls where that one has five: transaction 1 sleeps for the
\* lock and may time out, transaction 2 commits with commit_nowait,
\* transaction 3 never waits and may give up, the bound is two lost races,
\* and two entry names tell a retired entry from a new one. Every invariant
\* holds and everybody is served.
\*
\* This is the half of the mixed run that checks whole runs. Four calls
\* (9 thousand states, 14 s) still let every transaction ask, one of them
\* twice, so a wait meets a sleeper, a commit_nowait and a give-up in every
\* order; the fifth call's extra lost race is in the five-call run, which
\* checks every invariant.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (the budget of lock calls is spent) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Three transactions, each on its own thread with its own inbox.
  Txns = {1, 2, 3}
  \* Two entry names: the old entry and a new one can be told apart.
  Entries = {1, 2}
  \* Transaction 1 sleeps for the lock; 2 and 3 use try_get_for_update.
  Blocking = {1}
  \* Transaction 2 commits with commit_nowait; 1 and 3 commit the plain way.
  Nowait = {2}
  \* Transaction 1's sleep may time out, and transaction 3 may give up.
  MayCancel = {1, 3}
  \* A waiter is owed after two lost races.
  Bound = 2
  \* Four lock calls in the whole run: see the note above.
  Takes = 4
  \* Every transaction's wait is watched.
  Watched = {1, 2, 3}
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state: every variable holds the kind of value it should.
INVARIANT TypeOK
\* Must hold in every state: at most one transaction holds the key.
INVARIANT MutualExclusion
\* Must hold in every state: an entry out of the table is used by nobody.
INVARIANT TableSound
\* Must hold in every state: a free lock with a line has told its front waiter.
INVARIANT NoStrandedFront
\* Must hold in every state: a waiter that was nudged or handed the lock was told.
INVARIANT WokenIsTold
\* Must hold in every state: no waiter loses more than Bound races.
INVARIANT BoundedBypass
\* Must hold in every state: a note lands in its own inbox and nowhere else.
INVARIANT OwnQueue
\* Must hold in every state: nobody takes the key under a commit not yet visible.
INVARIANT IsolationAtLanding
\* Must hold in every state: a lock does not outlive the landing of its commit.
INVARIANT HeldOnlyWhileNeeded
\* Everybody who asks for the lock stops asking, in every fair run.
PROPERTY Served
