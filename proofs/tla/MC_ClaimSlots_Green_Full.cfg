\* GREEN. A table of one slot and two owners: one is refused a slot (its
\* claim is not listed, and it ends it itself), `taken` passes the capacity,
\* and close looks at the one slot only. Every rule holds.

\* The behaviours of the model.
SPECIFICATION Spec
\* A state where nothing can move before everybody is done is an error.
CHECK_DEADLOCK TRUE
\* The setup this configuration checks.
CONSTANTS
  \* Two owners run transactions.
  Owners = {1, 2}
  \* What each owner does.
  Script <- OneEach
  \* How many chunks the table may hold.
  Chunks = 1
  \* Free slots on the stack at the start.
  PreFree = 0
  \* Whether close runs.
  Closes = TRUE
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK OneHolder FreeStackSound CellBelongsToHolder DroppedOnce LiveTakenByClose DrainInBounds AtRest
