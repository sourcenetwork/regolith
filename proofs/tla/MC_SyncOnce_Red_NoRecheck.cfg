\* A waiter finds an initializer running, the initializer publishes and
\* wakes an empty list, and the waiter then pushes its node and parks
\* without looking again. It sleeps beside a published value.
\* NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Mutant = "NoRecheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT PublishedOnce
INVARIANT ReadersAgree
