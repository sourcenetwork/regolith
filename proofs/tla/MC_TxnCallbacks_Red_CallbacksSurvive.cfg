\* A conflicted attempt's callbacks stay registered on the transaction the
\* re-run uses. Attempt 1 aborts with the Conflict and runs its on_abort;
\* attempt 2 commits and runs attempt 1's on_commit as well as its own.
\* AttemptIsolation fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owners = {1, 2}
  Committers = {1, 2}
  MaxAttempts = 2
  Durability = "Immediate"
  Mutant = "CallbacksSurvive"
INVARIANT AttemptIsolation
INVARIANT TypeOK
INVARIANT CallbacksBeforeHooks
INVARIANT NoLostUpdate
INVARIANT CommitAfterDurable
INVARIANT PanicAborts
