\* A notified() future is dropped just after a notification was handed to
\* it, and keeps it: the task goes idle holding a notification the next
\* waiter never gets. CancelPassesOn fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Notifiers = {3}
  Watched = {1}
  MaxBcast = 0
  Mutant = "CancelNoPassOn"
INVARIANT CancelPassesOn
INVARIANT TypeOK
INVARIANT FifoHandoff
INVARIANT NoLostWakeup
