\* The allocation record is logged after the commit that uses its values:
\* c1 is handed 1..2 from the in-memory counter, its commit using them is
\* written and synced (Immediate), and the allocation record has not
\* reached the WAL. INV_UseDurable fails. Left out because it is the
\* consequence, its own RED (LogAfterUse_Reuse): INV_UsesUnique. Every
\* other invariant is checked first and holds up to that state.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Clients = {"c1", "c2", "c3"}
  N = 2
  MayAbort = {}
  Durability = "Immediate"
  MaxCrashes = 1
  Mutant = "LogAfterUse"
INVARIANT TypeOK
INVARIANT INV_NeverConflicts
INVARIANT INV_Unique
INVARIANT INV_Monotonic
INVARIANT INV_UseDurable
