\* The head lives in a cache that the ordered step advances at assignment,
\* before publication. A group fails at the WAL after a1 took position 1;
\* the cache keeps 1, so the next group gives a2 position 2 and no row ever
\* holds 1. INV_Dense fails. Every other invariant is checked first and
\* holds up to that state (no once key here).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 1
  Mode = "Append"
  Mutant = "HeadCache"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_Dense
