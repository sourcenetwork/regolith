\* A Semaphore of two permits. Task 1 asks for both, tasks 2 and 3 for one,
\* so strict FIFO is tested: a small request behind the large one must not
\* pass it. Guards move between tasks (acquire_owned). Every safety
\* invariant holds, and every waiter is eventually served.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 2
  Need <- NeedFirstAll
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = TRUE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1, 2}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT FifoHandoff
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
PROPERTY EveryWaiterServed
