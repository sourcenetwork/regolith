\* A Semaphore of two permits, Bound 1. Task 1 asks for both, tasks 2 and 3
\* for one: a large request at the head reserves released permits once it
\* has lost Bound times. Owned guards move between tasks. Every safety
\* invariant holds.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: the
\* liveness property left this run (136,589 states either way, but 61
\* seconds with the property and 16 without). Still here: every safety
\* invariant over every interleaving of three tasks, with the large request
\* reserving permits. "Every waiter is served" is now
\* MC_Sync_Green_SemaphoreLive's, on two tasks. Lean (Regolith/Sync.lean)
\* proves the Mutex, one permit, for every number of tasks; there is no Lean
\* theorem for a Semaphore of several permits, nor for the temporal property.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 2
  Need <- NeedFirstAll
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = TRUE
  Bound = 1
  Watched = {1, 2}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
