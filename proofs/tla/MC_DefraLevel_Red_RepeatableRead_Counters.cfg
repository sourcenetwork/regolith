\* RepeatableRead refuses a blind increment on any newer operand.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  Resetters = {10}
  CommutativeRanges = {1, 2}
  Level = "RepeatableRead"
INVARIANT INV_IncrementsCommitUnlessReplaced
