\* Green_Counters at RepeatableRead, which refuses a blind increment on any
\* newer operand: of two concurrent increments one is refused, although
\* committing it would keep the counter exact.
\* INV_IncrementsCommitUnlessReplaced fails.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {11}
  Rebasers = {12}
  Resetters = {10}
  Clearers = {13}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "RepeatableRead"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_IncrementsCommitUnlessReplaced
