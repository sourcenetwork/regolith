\* The bug: the leader checks a member against the view alone and forgets
\* the members it accepted earlier in the group. Transactions 1 and 2 both
\* write key 1 from snapshot 0 and share a group; both commit, where
\* committing them one at a time aborts the second, so the first one's write
\* is lost. SerialEquivalent fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Plain = {4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  \* No commit here is made by commit_nowait: every leader syncs its own group.
  Nowait = {}
  Mutant = "ViewOnly"
INVARIANT SerialEquivalent
INVARIANT TypeOK
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT BoundedTurn
INVARIANT NoStuckTicket
