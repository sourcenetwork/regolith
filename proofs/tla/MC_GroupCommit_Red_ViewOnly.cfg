\* The defect: the leader validates a member against the view alone, not
\* against the members it accepted earlier in the group. Transactions 1 and
\* 2 both write key 1 from snapshot 0 and land in one group; both commit,
\* where committing them one at a time aborts the second. SerialEquivalent
\* fails; the other invariants are checked too and hold until then.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  Mutant = "ViewOnly"
INVARIANT SerialEquivalent
INVARIANT TypeOK
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT NoStuckTicket
