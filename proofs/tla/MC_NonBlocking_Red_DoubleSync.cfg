\* RED. The bug: claiming a unit also succeeds on a claimed one, so two
\* members of group 4 both claim its fsync job. Story: threads 1 and 2 poll
\* at once, both claim, and the group's fsync runs twice. SingleRun breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit done) is not an error.
CHECK_DEADLOCK FALSE
