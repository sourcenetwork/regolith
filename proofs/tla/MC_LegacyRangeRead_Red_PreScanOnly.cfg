\* The bug planted: instead of copying the range delete into the memtable, every
\* read first gathers the range deletes of all level-0 tables. That reads right
\* while the table with the delete is in level 0. Then a compaction takes that
\* table, the oldest, down a level and leaves the table with the put at
\* sequence 1 in level 0. The read gathers nothing from level 0 any more, walks
\* to the put first, and returns a key that was deleted at 2: a compaction
\* changed a read. ReadNewest fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the size, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* At most 4 sequences: the put, the range delete, and two puts after the open.
  MaxSeq = 4
  \* The overlapping level the open moves into level 0 (E14).
  Layout = "Moved"
  \* A bottom pass keeps every entry, so reads are checked at every snapshot.
  Retire = FALSE
  \* The planted bug, first half: the open copies nothing into the memtable.
  Hoist = FALSE
  \* The planted bug, second half: a read gathers level 0's range deletes ahead of its walk.
  PreScan = TRUE
  \* The log is written before the manifest records the move (the engine).
  RecordFirst = FALSE
\* The promise the planted bug must break: once the memtable is rebuilt, every read at every
\* snapshot returns what the sequences say.
INVARIANT ReadNewest
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
