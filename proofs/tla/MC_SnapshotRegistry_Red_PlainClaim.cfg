\* The bug: a claim treats the slot as its thread's alone and writes a free
\* entry in two steps. Threads 1 and 2 share a slot. Reader A on thread 1
\* reads 0 and sees entry 1 free; reader B on thread 2 claims entry 1 at 0
\* and goes live; a commit makes the horizon 1; A, confirming, re-reads 1
\* and announces 1 by writing entry 1, wiping B's 0. A compaction samples 1
\* and lists 1: its minimum, 1, is above B at 0.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* Renamed handles, threads, slots and entries count as one state.
SYMMETRY Sym
\* A state with no next step is fine: the commits are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three snapshot handles.
  Handles = {h1, h2, h3}
  \* Two threads.
  Threads = {t1, t2}
  \* Two slots.
  Slots = {s1, s2}
  \* Two entries per slot.
  Entries = {e1, e2}
  \* "No entry" is a value of its own.
  NoPos = NoPos
  \* Commits up to sequence 1: one commit, enough for every bug below.
  MaxSeq = 1
  \* The fix: confirm after the announce.
  Confirm = "Recheck"
  \* The fix: sample, then scan.
  Order = "SampleThenScan"
  \* The fix: release the entry the handle recorded.
  ReleaseMode = "Recorded"
  \* The fix: a copy joins the original's entry.
  CloneMode = "Join"
  \* The bug: see a free entry, write it later.
  ClaimMode = "Plain"
  \* The fix: recheck the sequence after a join.
  JoinMode = "Recheck"
\* Fails: the minimum is above a live snapshot.
INVARIANT MinBelowLive
