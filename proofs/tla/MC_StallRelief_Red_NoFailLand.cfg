\* RED. The bug: the relief's failure is recorded and lands nothing. Story:
\* the stop is on; writer 1's relieving step takes the gate; writer 2 finds
\* it held, registers and waits; the relief fails, its failure is recorded,
\* and the unit stays where it is. A write that arrives now is told the
\* failure, and writer 2, who was a moment earlier, waits on. With a
\* compaction worker, where no writer's step would come by and land the
\* unit, it waits for as long as the relief keeps failing.
\* NoWaitOnceFailing breaks.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* Two pieces of progress may leave the stop on.
  MaxSteps = 2
  \* The planted bug.
  Mode = "NoFailLand"
  \* The engine never latches and no rotation flushes at the memtable cap.
  Failures = FALSE
  \* The relief may fail and recover.
  ReliefFails = TRUE
\* The invariant this bug must break.
INVARIANT NoWaitOnceFailing
\* Checked as well.
INVARIANT TypeOK
