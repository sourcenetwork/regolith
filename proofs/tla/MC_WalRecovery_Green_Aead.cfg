\* Encryption at rest (4.12, D45): each record is an AEAD frame whose tag
\* replaces the checksum, and every crash state may also be opened under
\* the wrong key. A failed tag is an unusable record under the same rule,
\* the residual case included; a wrong key fails the sealed stamp and
\* refuses, so it never drops the log as a tail.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 5
  MaxFiles = 3
  MaxCrashes = 2
  Mode = "Immediate"
  Frame = "AEAD"
  Residual = TRUE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT NoGap
INVARIANT KeepsSynced
INVARIANT AckedSurvive
INVARIANT NoProvenLoss
INVARIANT LossIsReported
INVARIANT WrongKeyRefuses
