\* Encryption at rest (4.12, D45): each record is an AEAD frame whose tag
\* replaces the checksum, and every crash state may also be opened under
\* the wrong key. A failed tag is an unusable record under the same rule,
\* the residual case included; a wrong key fails the sealed stamp and
\* refuses, so it never drops the log as a tail.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: four
\* commits where there were five (12,460 states and 18 to 21 seconds; now
\* 3,693 states and about 9). Still here: three log files, so a rotation on
\* either side of a crash, two crashes, a failed tag in any record and the
\* wrong key at any open. Gone: a fifth commit;
\* MC_WalRecovery_Green_Immediate and _Eventual keep five. Lean covers every number of commits, files and crashes:
\* replay2_opens_of_honest, replay2_keeps_proven and recovers_prefix2 in
\* Regolith/WalRecovery.lean.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Four commits: see SHRUNK above.
  MaxCommits = 4
  MaxFiles = 3
  MaxCrashes = 2
  Mode = "Immediate"
  Frame = "AEAD"
  Residual = TRUE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT NoGap
INVARIANT KeepsSynced
INVARIANT AckedSurvive
INVARIANT NoProvenLoss
INVARIANT LossIsReported
INVARIANT WrongKeyRefuses
