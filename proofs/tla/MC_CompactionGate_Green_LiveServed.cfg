\* The design under fair scheduling, with one worker and one caller that
\* takes the gate alone again and again, and jobs handed to the worker as
\* well. Every thread that waits for the gate gets in, the worker's pass
\* and the caller alike, and the worker's pass always gets another turn.
\*
\* Small on purpose (212 states): "every waiter gets in" costs most of the
\* time of a liveness check here. MC_CompactionGate_Green_Live keeps two
\* callers for the worker's turn.
\* The system as CompactionGate.tla describes it, with fair scheduling.
SPECIFICATION Spec
\* The values this check fixes.
CONSTANTS
  \* The compaction workers.
  Workers = {"w"}
  \* One caller that waits for the gate on its own thread.
  Blockers = {"b1"}
  \* The callers whose job parks on their I/O queue.
  Owners = {}
  \* The losses after which a waiter is owed the gate.
  Bound = 1
  \* The most jobs waiting for the workers at once.
  MaxJobs = 1
  \* The planted defect, or "none".
  Mutant = "none"
\* Every variable holds the kind of value it should.
INVARIANT TypeOK
\* A job is inside with no other job and no pass.
INVARIANT MutualExclusion
\* No waiter is passed over more than Bound times.
INVARIANT BoundedBypass
\* Nobody walks in past a waiter that is owed the gate.
INVARIANT OwedShutsBarging
\* No worker runs two jobs without a pass between them.
INVARIANT WorkerTakesTurns
\* A waiter that could move has its wake-up.
INVARIANT NoLostWake
\* A thread is inside exactly when it believes it is, or was just handed the gate.
INVARIANT InsideMatches
\* In the end: the worker's pass gets its turn again and again.
PROPERTY WorkerAlwaysPasses
\* In the end: every thread that waits for the gate gets in.
PROPERTY EveryWaiterServed
