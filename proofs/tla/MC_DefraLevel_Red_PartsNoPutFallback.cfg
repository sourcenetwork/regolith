\* Green_Parts with the read of a key the transaction later puts left projected.
\* The rewriter reads part 1, an operand touching part 2 commits, and the
\* rewriter's put, standing behind its read, overwrites that operand: a lost
\* update. INV_PartsCurrent fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- PartsWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PartsNoPutFallback"
INVARIANT INV_PartsCurrent
INVARIANT INV_PartsRelaxed
INVARIANT INV_ReasonsExact
