\* Green_OwnWrites with a read that skips the transaction's own merges: a put
\* followed by a merge reads back the put, and commits one more.
\* INV_ReadYourOwnWrites fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- OwnWritesWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "OwnMergesInvisible"
INVARIANT INV_ReadYourOwnWrites
INVARIANT INV_ReasonsExact
