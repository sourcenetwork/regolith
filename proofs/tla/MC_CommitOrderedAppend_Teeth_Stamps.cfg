\* Teeth for Red_Stamps: the same design and writers, every invariant but
\* INV_Dense, over the whole state space. All hold: stamps are unique and
\* in commit order, as #1911 found; only density fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {"n1"}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Stamp"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
