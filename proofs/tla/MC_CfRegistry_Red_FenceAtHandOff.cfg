\* RED. The bug: the ticket the hand-off holds is checked when the hand-off
\* takes it, and not again when its group runs. Story: the family is
\* created (sequence 1); writer 1 checks "live" and queues; the hand-off
\* takes writer 1's ticket and checks it, live; the drop runs its group of
\* one, tombstone at 2, and retires the family; a drain runs the held
\* ticket's group and writer 1 lands at 3, over the tombstone.
\* NoWriteAfterDrop breaks.

\* The behaviours of the model.
