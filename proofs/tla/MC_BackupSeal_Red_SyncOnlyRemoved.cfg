\* The bug planted: a delete or a purge syncs meta/ only when this call
\* removed a metadata file, as the code did before. A call run again after
\* its sync failed finds the file already gone, skips the sync, and sweeps.
\* How it breaks the promise: backup 1 holds a table no other backup lists.
\* Deleting it removes its metadata, then the sync of meta/ fails, and the
\* call returns the error. The delete is run again: the file is gone, so
\* nothing is removed and nothing is synced, and the sweep removes the table
\* and syncs shared/. The power goes: the removal of backup 1's metadata was
\* never synced and comes back undone, so backup 1 is listed again, and the
\* table it lists is gone. ListedRestores fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* No attacker: the bug needs none.
CONSTRAINT NoAttack
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two backups, the fewest the model takes.
  MaxBackups = 2
  \* No restore: the bug is in the delete.
  MaxRestores = 0
  \* One entry per batch of the walk of meta/.
  Batch = 1
  \* One pool file per batch of the sweep.
  Sweep = 1
  \* One table slot: backup 1's table is all the story needs.
  Slots = 1
  \* The defect above.
  Mutant = "SyncOnlyRemoved"
\* The promise this bug breaks.
INVARIANT ListedRestores
\* Every variable keeps its type.
INVARIANT TypeOK
