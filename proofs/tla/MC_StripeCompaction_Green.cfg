\* The fix: inputs fixed before the live list is read, stripes per live
\* snapshot, an exact operator, no filter. Every live snapshot and the head
\* read every key the same through every write, flush and compaction, and
\* every key's newest sequence is kept.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: three
\* writes where there were four (355,738 states and 32 seconds; now 40,536
\* states and about 9). Still here: two readers holding snapshots at two
\* different sequences with a write after both, so a key's versions fall
\* into three stripes, every put, merge and delete in each place, two runs,
\* and every flush and compaction between. Gone: a fourth write, which puts
\* two versions in one stripe beside the other two stripes;
\* MC_StripeCompaction_Green_Inexact keeps four writes with the operator
\* that never folds. Lean covers every number of versions and snapshots:
\* reduce_reads, window_reads_kept and reduce_keeps_newest in
\* Regolith/Stripes.lean.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1}
  \* Three writes: see SHRUNK above.
  MaxSeq = 3
  MaxRuns = 2
  Readers = {r1, r2}
  PutValues = {1}
  Cap = 3
  Operator = "Exact"
  FoldOperandOnly = "IfExact"
  Capture = "AfterInputs"
  Stripes = "PerSnapshot"
  Filter = "None"
INVARIANT TypeOK
INVARIANT SnapshotReadsKept
INVARIANT HeadKept
INVARIANT NewestKept
