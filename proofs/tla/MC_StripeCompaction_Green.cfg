\* The fix: inputs fixed before the live list is read, stripes per live
\* snapshot, an exact operator, no filter. Every live snapshot and the head
\* read every key the same through every write, flush and compaction, and
\* every key's newest sequence is kept.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* The readers are interchangeable, so TLC checks one of every set of states that differ only by
\* swapping them.
SYMMETRY ReaderSymmetry
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* One key, numbered 1: the reduction treats each key on its own, so one is enough.
  Keys = {1}
  \* At most 4 writes happen in a run.
  MaxSeq = 4
  \* At most 2 sorted files exist at once.
  MaxRuns = 2
  \* Two readers that may each take a snapshot: r1 and r2.
  Readers = {r1, r2}
  \* A put always stores 1.
  PutValues = {1}
  \* Merge results are capped at 3.
  Cap = 3
  \* The merge operator's partial_merge is exact: a plain sum.
  Operator = "Exact"
  \* A stripe holding only operands is folded only when the operator is exact (the engine's rule).
  FoldOperandOnly = "IfExact"
  \* The compaction reads the list of live snapshots after it chose its inputs (the engine's order).
  Capture = "AfterInputs"
  \* Versions are reduced per snapshot stripe (the engine's rule).
  Stripes = "PerSnapshot"
  \* No compaction filter.
  Filter = "None"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: every live snapshot reads every key the same at every step after it was
\* taken.
INVARIANT SnapshotReadsKept
\* Checked in every state: a read with no snapshot returns what the writes made it, through every
\* flush and compaction.
INVARIANT HeadKept
\* Checked in every state: every key's newest version keeps its sequence number.
INVARIANT NewestKept
