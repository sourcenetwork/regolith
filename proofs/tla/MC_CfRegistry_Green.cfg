\* GREEN. A plain writer, a transaction and an ingest write to family 1
\* while it is created and dropped, through every group-commit path: a
\* writer leading its own group, tickets queued on the ring and run by
\* another leader or by a drain, the ticket the hand-off holds across a
\* drop, and the ingest's install. A reader watches. Every rule holds.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* Keep runs short enough for TLC (see Bounded).
CONSTRAINT Bounded
\* The setup this configuration checks.
CONSTANTS
  \* One family id.
  Families = {1}
  \* The writers.
  Writers = {1, 2, 3}
  \* The family each writer writes to.
  WriteTo <- WriteToThree
  \* How each writer writes.
  Kind <- KindsMixed
  \* One reader.
  Readers = {1}
  \* It watches family 1.
  Watch <- WatchOne
  \* It looks three times.
  Looks = 3
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK
\* Must hold in every state.
INVARIANT NoWriteAfterDrop
\* Must hold in every state.
INVARIANT NoWriteBeforeBirth
\* Must hold in every state.
INVARIANT LifeInOrder
