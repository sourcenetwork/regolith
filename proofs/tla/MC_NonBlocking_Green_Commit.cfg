\* GREEN. Threads 1 and 2 each commit a member of group 4 with
\* commit_nowait. The first commit writes the group and leaves its fsync as
\* one unit; each member's note sits on its own queue; the first member to
\* poll claims and runs the fsync, or any thread taking the pipeline lands
\* it; the database may close at any point. Every invariant holds and every
\* commit's ticket is delivered at its own poll.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block reads in this setup.
  Blocks = {}
  \* So nobody reads.
  Want <- WantNone
  \* No jobs in this setup.
  Jobs = {}
  \* So no job has a thread.
  JobOf <- JobOfNone
  \* The group's fsync needs one unit.
  MaxUnits = 1
  \* One commit group.
  Groups = {4}
  \* Both threads have a member in it.
  MembersOf <- MembersBoth
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* The real code: no bug planted.
  Mutant = "none"
