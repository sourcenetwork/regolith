\* GREEN. Threads 1 and 2 each commit with commit_nowait, and sync round 4
\* covers both commits. The round is one unit; each commit's note for it
\* sits on its own queue; the first of the two queues to poll claims the
\* round and runs the fsync, or a thread that needs the log durable inside
\* a blocking call does; the database may close at any point. Every
\* invariant holds and every commit's ticket is delivered at its own poll.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block reads in this setup.
  Blocks = {}
  \* So nobody reads.
  Want <- WantNone
  \* No jobs in this setup.
  Jobs = {}
  \* So no job has a thread.
  JobOf <- JobOfNone
  \* The round needs one unit.
  MaxUnits = 1
  \* One sync round.
  Rounds = {4}
  \* It covers a commit of each thread.
  CommittersOf <- CommittersBoth
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* The real code: no bug planted.
  Mutant = "none"
