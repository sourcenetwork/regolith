\* Liveness of Notify, on a run small enough to check a temporal property
\* in a few seconds: task 3 calls notify_one and notify_waiters (twice), and
\* task 1 waits on notified(), cancelling at will. A waiter handed a
\* notification completes (NotifiedCompletes), and every safety invariant
\* holds here too.
\*
\* Example of what it rules out: the notifier hands its notification to the
\* waiter's node and wakes it too early, before the node says "handed"; the
\* waiter looks, sees nothing, parks again, and nobody wakes it a second
\* time. The queue hands first and wakes after.
\*
\* This run is the liveness half of MC_SyncNotify_Green, which keeps two
\* waiters and the safety invariants (1,301 states here against 104,022
\* there). What one waiter does not show is a notification passed from a
\* dropped waiter to the one behind it; the safety run shows it is passed on
\* (CancelPassesOn, FifoHandoff), and Lean's handed_holds and
\* no_lost_handoff (Regolith/SyncFifo.lean) hold for every number of waiters.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every task is idle is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Task 1 waits and task 3 notifies.
  Tasks = {1, 3}
  \* The task that calls notify_one and notify_waiters.
  Notifiers = {3}
  \* Liveness is checked for the waiter.
  Watched = {1}
  \* At most two broadcasts in one behaviour.
  MaxBcast = 2
  \* The design, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* The waiters count is exactly the tasks registered or queued.
INVARIANT WaitersCounted
\* One task at a time holds the drain token.
INVARIANT DrainExclusive
\* No waiter is served ahead of one that entered before it and still waits.
INVARIANT FifoHandoff
\* A waiter is woken only once it holds its notification, and none waits
\* beside a stored permit.
INVARIANT NoLostWakeup
\* A dropped waiter passes its notification on.
INVARIANT CancelPassesOn
\* The promise of this run: a waiter handed a notification completes.
PROPERTY NotifiedCompletes
