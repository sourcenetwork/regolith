\* The bug planted: the commit erases every version of the entries it truncates, instead of adding a delete
\* version on top of them.
\* How it breaks the promise: a reader that pinned its snapshot before the truncate reads an entry that is gone,
\* so INV_ReaderStable fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writers, w1 and w2.
  Writers = {"w1", "w2"}
  \* One reader, r1.
  Readers = {"r1"}
  \* The log can reach position 4: the two it starts with and two appends.
  MaxPos = 4
  \* A transaction appends at most once.
  MaxApp = 1
  \* Two commits after the first: one for each writer.
  MaxSeq = 3
  \* The defect above.
  Mutant = "ErasesOnTruncate"
\* Checked in every state: what a reader read is exactly the log as of its snapshot.
INVARIANT INV_ReaderStable
