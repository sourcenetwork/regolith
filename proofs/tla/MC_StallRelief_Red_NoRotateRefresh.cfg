\* RED. The bug: a rotation whose seal fails counts no progress. Story:
\* writer 1's write is let in with no stop and has to rotate at the memtable
\* cap: its flush takes the gate, and the stop comes on. Writer 2 finds the
\* gate held, registers and waits. Writer 1's flush ends with the stop
\* still on, its seal fails, and it returns the error with nothing counted
\* and nothing landed. Writer 2 waits, and nobody is left. NoStrandedWait
\* breaks.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* Two pieces of progress may leave the stop on.
  MaxSteps = 2
  \* The planted bug.
  Mode = "NoRotateRefresh"
  \* A rotation may flush at the cap and fail.
  Failures = TRUE
  \* The relief never fails: the run is the one this row had before a
  \* failing relief was modelled.
  ReliefFails = FALSE
  \* No writer is a transaction's commit: the run is the one this row had
  \* before commits were modelled.
  Commits = {}
  \* Inline compaction is on wherever stopped writers relieve: the run is the one
  \* this row had before inline compaction off was modelled.
  InlineOff = FALSE
\* The invariant this bug must break.
INVARIANT NoStrandedWait
\* Checked as well.
INVARIANT TypeOK
