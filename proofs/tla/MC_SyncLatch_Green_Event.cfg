\* An Event (a Latch of count 1): any of three tasks sets it, any waits,
\* cancelling at will. No wait completes before the set, no waiter misses
\* the set, and every waiter of a set Event passes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Latch"
  Count = 1
  Rounds = 0
  Mutant = "none"
INVARIANT TypeOK
INVARIANT GateHolds
INVARIANT NoLostWakeup
PROPERTY ReleasedWaitersPass
