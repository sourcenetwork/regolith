\* Allocation inside the caller's transaction: the counter is read in its
\* snapshot and written in its write set, then validated. c1 and c2 both
\* read 0; c1 commits counter 2; c2's read is stale and it aborts on the
\* conflict. INV_NeverConflicts fails. Every other invariant is checked
\* first and holds up to that state; Teeth_InTxn checks them over the whole
\* state space.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Clients = {"c1", "c2", "c3"}
  N = 2
  MayAbort = {}
  Durability = "Immediate"
  MaxCrashes = 1
  Mutant = "InTxn"
INVARIANT TypeOK
INVARIANT INV_Unique
INVARIANT INV_Monotonic
INVARIANT INV_UseDurable
INVARIANT INV_UsesUnique
INVARIANT INV_NeverConflicts
