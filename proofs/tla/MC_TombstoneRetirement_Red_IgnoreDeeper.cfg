\* A pass retires a tombstone while a deeper run still holds a put it
\* covers. A snapshot taken after the tombstone reads that put back.
\* SnapshotReadsKept fails.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 4
  MaxRuns = 3
  Readers = {r1, r2}
  Retire = "IgnoreDeeper"
INVARIANT SnapshotReadsKept
