\* The bug: the flag is set before the slot is written. A reader reads the
\* slot in between and finds no tombstone: ReadWhole breaks. The other
\* invariants are checked too.
\* Check every behaviour of the model.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two commits, each with one range tombstone.
  Commits = 2
  \* The threads that apply them: any of them may apply any commit.
  Appliers = {a1, a2}
  \* The reader.
  Readers = {r1}
  \* The bug: the flag is set before the slot is written.
  Mode = "ReadyFirst"
\* The one that must break. A reader never reads a slot before its tombstone is in it.
INVARIANT ReadWhole
\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* No two appends share a slot.
INVARIANT OneSlotEach
\* A reader sees every tombstone its snapshot includes.
INVARIANT PublishedSeen
