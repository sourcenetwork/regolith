\* DefraLevel, E11. Two transactions each merge into a key of a commutative
\* prefix and then scan the prefix, which yields the key through their own
\* operand. The scan reads the base without recording it and its stretch stays
\* inside the prefix, so each merge stays blind: both commit, and the key counts
\* both.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- TallyWorkload
  CommutativeRanges = {13}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_TallyMergesCommit
INVARIANT INV_TallyExact
INVARIANT INV_ReasonsExact
