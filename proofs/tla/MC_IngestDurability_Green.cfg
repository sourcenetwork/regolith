\* The fix: the ingest syncs the log before its manifest record. Three
\* commits race it and the log syncs at any moment; a power cut in any state
\* recovers a gap-free prefix of commit order.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Commits = {"c1", "c2", "c3"}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT GapFreePrefix
