\* Liveness of the ReentrantRwLock, one task of each owner, nesting two write
\* guards: task 1 waits, task 3 only tries, as often as they like, Bound 1. If
\* no owner keeps the lock for ever, the waiter is served.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, in which a started
\* operation finishes, a woken task is polled and a holder eventually lets go.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two tasks use the lock: 1 and 3.
  Tasks = {1, 3}
  \* The lock is a ReentrantRwLock: an owner may lock it again while holding it.
  Kind = "Reentrant"
  \* Task 1 is one owner and task 3 is another (tasks 1 and 2 would share one).
  Owner <- OwnerPair
  \* A task nests up to two guards.
  MaxDepth = 2
  \* A waiter is owed a handoff after one lost race.
  Bound = 1
  \* Task 2 reads; the others write.
  Role <- RoleWriteReadWrite
  \* Nobody upgrades.
  Upgrades = {}
  \* Task 1 waits when its request does not fit; task 3 only tries.
  Waits = {1}
  \* No waiting future is dropped.
  Drops = {}
  \* Every task asks for the lock as often as it likes.
  Turns <- TurnsAny
  \* Nobody holds the lock when the run starts.
  Start = {}
  \* The tasks may ask in any order.
  Follows <- FollowsNobody
  \* Task 1 is the task whose "is eventually served" promises are checked.
  Watched = {1}
  \* No planted bug: the code as built.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: a future that spins on its node is inside its poll, so its node has no
\* waker a release could claim.
INVARIANT SpinningUnarmed
\* Checked in every state: only the holder of the drain role is inside the drain.
INVARIANT DrainExclusive
\* Checked in every state: every node that waits or withdrew is linked exactly once.
INVARIANT NodesLinked
\* Checked in every state: the lock word counts exactly the guards out, the entries pending and what a
\* pass holds.
INVARIANT WordMatchesGuards
\* Checked in every state: every guard a task holds at rest is counted in the lock word.
INVARIANT GuardsCounted
\* Checked in every state: a write guard excludes every guard of another owner, and at most one
\* upgradable guard is out.
INVARIANT MutualExclusion
\* Checked in every state: the reentrant lock's counts are exactly the guards out.
INVARIANT ReentrancyDepth
\* Checked in every state: no waiter is passed over more than Bound times, and at Bound the HANDOFF
\* bit is up.
INVARIANT BoundedBypass
\* Checked in every state: nobody barges while a handoff is owed.
INVARIANT HandoffExclusive
\* Checked in every state: no plain reader enters while an upgrade waits.
INVARIANT UpgradeHoldsBack
\* Checked in every state: no reader an upgrade waits for is itself asleep on the lock.
INVARIANT NoUpgradeDeadlock
\* Checked in every state: no task waits in the queue while its own owner holds a guard.
INVARIANT NoSelfDeadlock
\* Checked in every state: a marked sleeper is woken, and no waiter sleeps while it could enter.
INVARIANT NoLostWakeup
\* Checked in every state: an idle task holds nothing.
INVARIANT CancelPassesOn
\* Checked in every state: a drain runs one pass, and one more for each waiter operation, or release
\* with a node queued, that lands while it runs; none for a release over an empty queue.
INVARIANT DrainBounded
\* Checked over whole runs: if no owner keeps the lock for ever, every watched waiter eventually
\* stops waiting.
PROPERTY ServedIfOwnersLetGo
\* Checked over whole runs: once no more waiter operations land on a drain, every drain ends.
PROPERTY DrainsEndWhenWaitersSettle
