\* Liveness of the ReentrantRwLock, one guard per task, one task of each
\* owner: if no owner holds the lock forever, every waiter is served.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: two tasks,
\* one of each owner, where there were three (4,635 states and 46 seconds,
\* nearly all of it the temporal check; now 226 states and about 5). Still
\* here: a reader or writer of one owner waiting on the other owner's read
\* or write, served once that owner lets go. Gone from the liveness check:
\* the second task of Owner 1, whose re-entry beside a waiting Owner 2 keeps
\* every safety invariant in MC_SyncRwLock_Green_Reentrant (three tasks,
\* nesting two guards). No Lean theorem covers the reentrant owner rules or
\* this liveness property (SyncRwLock.tla says which laws Lean proves).
\* The runs checked: every run that starts in Init and takes steps of Next, in which wakes are
\* delivered, woken tasks are polled and a holder eventually lets go.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Task 1 is Owner 1 and task 3 is Owner 2: see SHRUNK above.
  Tasks = {1, 3}
  \* The lock is a ReentrantRwLock: an owner may take it again while holding it.
  Kind = "Reentrant"
  \* Task 1 belongs to one owner and task 3 to another (task 2, which shares task 1's owner, is not
  \* in this run).
  Owner <- OwnerPair
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* A waiter is handed the lock after one lost race.
  Bound = 1
  \* The "is eventually served" promises are checked for tasks 1 and 3, one per role.
  Watched = {1, 3}
  \* Every task may make every kind of request the lock offers.
  Asks <- AsksAll
  \* No planted bug: the design.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: while an owner holds write, no other owner reads and nobody holds the
\* upgradable guard.
INVARIANT MutualExclusion
\* Checked in every state: at most one task holds the upgradable guard, and the lock names it.
INVARIANT UpgradableExclusive
\* Checked in every state: the lock's read and write depths are exactly the guards out.
INVARIANT ReentrancyDepth
\* Checked in every state: no waiter, reader or writer, loses the race more than Bound times during
\* one request.
INVARIANT BoundedBypass
\* Checked in every state: nobody enters by the fast path while a handoff is owed.
INVARIANT HandoffExclusive
\* Checked in every state: no plain reader enters while an upgrade waits.
INVARIANT UpgradeHoldsBack
\* Checked in every state: every reader an upgrader waits for is free to drop its guard.
INVARIANT NoUpgradeDeadlock
\* Checked in every state: a task waiting in the queue holds no guard of the lock.
INVARIANT NoSelfDeadlock
\* Checked in every state: a waiter handed the lock is woken, and no waiter or upgrader sleeps while
\* it could proceed.
INVARIANT NoLostWakeup
\* Checked in every state: an idle task holds no guard: a waiter dropped after a handoff passed the
\* lock on.
INVARIANT CancelPassesOn
\* Checked over whole runs: if no owner keeps the lock for ever, every watched waiter eventually
\* stops waiting.
PROPERTY ReentrantServed
