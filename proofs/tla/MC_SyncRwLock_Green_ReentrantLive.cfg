\* Liveness of the ReentrantRwLock, one guard per task (re-entry across the
\* two tasks of Owner 1): if no owner holds the lock forever, every waiter
\* is served.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Owner <- OwnerPair
  MaxDepth = 1
  Bound = 1
  Watched = {1, 3}
  Asks <- AsksAll
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT UpgradeHoldsBack
INVARIANT NoUpgradeDeadlock
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
PROPERTY ReentrantServed
