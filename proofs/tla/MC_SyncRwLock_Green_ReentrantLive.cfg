\* Liveness of the ReentrantRwLock. Tasks 1 and 2 share Owner 1, task 3 is
\* Owner 2, one guard per task, so re-entry happens across the two tasks of
\* Owner 1 (a reader under its owner's write or read). If no owner keeps
\* the lock forever, every waiter is served. Nesting inside one task, which
\* the lock cannot tell from re-entry by another task of the same owner, is
\* checked for safety in MC_SyncRwLock_Green_Reentrant; checking liveness
\* with it as well costs minutes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Owner <- OwnerPair
  MaxDepth = 1
  Watched = {1, 3}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT NoLostWakeup
PROPERTY ReentrantServed
