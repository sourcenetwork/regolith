\* The defect: each key loads the view current at its turn. A flush between
\* two keys puts them on different views. BatchConsistent fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  BatchKeys <- ReadOneTwoOne
  MaxSeq = 5
  MaxFlush = 3
  Mode = "ViewPerKey"
INVARIANT BatchConsistent
