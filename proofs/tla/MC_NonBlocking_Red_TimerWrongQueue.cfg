\* RED. The bug: a timed wait's note goes to the OTHER thread's queue.
\* Story: thread 1 asks for timed wait 6, the note lands in thread 2's
\* inbox, and thread 2's poll would record the wait and complete it, on
\* thread 2's thread. TimerOnOwnQueue breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (everything done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block in this setup.
  Blocks = {}
  \* So no thread reads one.
  Want <- WantNone
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* No unit is ever made here; the bound only needs a value.
  MaxUnits = 1
  \* No sync rounds in this setup.
  Rounds = {}
  \* So no round covers a commit.
  CommittersOf <- CommittersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* One timed wait.
  Timers = {6}
  \* It is thread 1's.
  TimerOf <- TimerOfOne
  \* Both threads keep their queues.
  Droppers = {}
  \* The planted bug.
  Mutant = "WrongQueue"
\* The invariant this bug must break.
INVARIANT TimerOnOwnQueue
