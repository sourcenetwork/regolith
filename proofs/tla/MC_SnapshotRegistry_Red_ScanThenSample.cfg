\* The bug on the compaction's side: it reads the entries first and samples
\* the horizon after. A reader registers at 0 after the scan passed its
\* entry; a commit makes the horizon 1; the compaction samples 1. Its
\* minimum, 1, is above the live snapshot at 0.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* Renamed handles, threads, slots and entries count as one state.
SYMMETRY Sym
\* A state with no next step is fine: the commits are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three snapshot handles.
  Handles = {h1, h2, h3}
  \* Two threads.
  Threads = {t1, t2}
  \* Two slots.
  Slots = {s1, s2}
  \* Two entries per slot.
  Entries = {e1, e2}
  \* "No entry" is a value of its own.
  NoPos = NoPos
  \* Commits up to sequence 1: one commit, enough for every bug below.
  MaxSeq = 1
  \* The fix: confirm after the announce.
  Confirm = "Recheck"
  \* The bug: scan, then sample.
  Order = "ScanThenSample"
  \* The fix: release the entry the handle recorded.
  ReleaseMode = "Recorded"
  \* The fix: a copy joins the original's entry.
  CloneMode = "Join"
  \* The fix: claim with one compare-and-swap.
  ClaimMode = "Cas"
  \* The fix: recheck the sequence after a join.
  JoinMode = "Recheck"
\* Fails: the minimum is above a live snapshot.
INVARIANT MinBelowLive
