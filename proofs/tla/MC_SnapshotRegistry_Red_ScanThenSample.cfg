\* The defect on the compaction's side: it scans the slots first and samples
\* the horizon after. A reader registers at 0 after the scan passed its
\* slot; the horizon rises; the compaction samples 1 and uses it. The
\* minimum is above the live snapshot. MinBelowLive fails.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers = {r1, r2, r3}
  MaxSeq = 3
  Confirm = "Recheck"
  Order = "ScanThenSample"
INVARIANT MinBelowLive
INVARIANT TypeOK
INVARIANT LiveSlotExact
