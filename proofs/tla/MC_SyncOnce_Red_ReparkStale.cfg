\* The initializer is dropped and its reset wakes the waiter list; a new
\* initializer starts before the woken waiter is polled. The waiter sees
\* "init", re-stores its waker, and parks with no node listed: the new
\* initializer's reset or publish has nobody of it to wake. NoLostWakeup
\* fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Mutant = "ReparkStale"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT PublishedOnce
INVARIANT ReadersAgree
