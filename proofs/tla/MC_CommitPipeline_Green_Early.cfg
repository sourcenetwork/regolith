\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* An owner who thinks its order is in the ring is right.
INVARIANT OwnerSeesItsFate
\* One thread at a time on the log's device step.
INVARIANT OneRound
\* Orders are settled in ticket order.
INVARIANT DecidedIsPrefix
\* The sequences handed out have no gap.
INVARIANT NoHole
\* Sequence order is ticket order.
INVARIANT SeqInRingOrder
\* An order is in the memtable before the next is decided.
INVARIANT AppliedBeforePassed
\* The memtable holds no order that was thrown out.
INVARIANT MemtableOnlyLive
\* The log holds no record of an order that was thrown out.
INVARIANT RecordsAreLive
\* Only what may be finished is finished.
INVARIANT PublishedPrefix
\* A finished order is visible to its owner.
INVARIANT PublishedIsVisible
\* No reader sees a later order without every earlier one.
INVARIANT ReadersSeePrefix
\* What a sync vouched for is written.
INVARIANT DurableImpliesWritten
\* No sync vouches for a sequence that was handed back.
INVARIANT DurableWithinDecided
\* At Immediate, visible only once durable.
INVARIANT DurableBeforeVisible
\* Two commits of one key never both land from one snapshot.
INVARIANT NoLostUpdate
\* No transaction is turned away for nothing.
INVARIANT AbortsHaveCause
\* A rotation leaves no record to write in a sealed log.
INVARIANT InFlightInCurrentLog
\* Nobody is told "done" for a lost order, or "failed" for a kept one.
INVARIANT NoFalseAck
