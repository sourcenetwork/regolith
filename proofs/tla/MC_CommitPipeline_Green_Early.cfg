\* The check in two parts (validation off the ordered step): two transactions
\* with overlapping keys that begin as a step of their own, so that the
\* other's commit can land between a transaction's beginning, its early check
\* and its turn in the ring. The early check, on the committer's own thread,
\* covers what is visible when it asks to commit and aborts it at once on a
\* conflict; the decide stage looks only above that horizon. Together they
\* decide as one check: NoLostUpdate and AbortsHaveCause hold, with every
\* other invariant and both liveness properties, and either thread may walk
\* away for good anywhere in its commit.
\* Check every behaviour of the model, the live threads kept running.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* The committing threads.
  Committers = {1, 2}
