\* The bug planted: restore checks that the provider has each table's key,
\* not that the bytes it gives under that key are the ones that sealed the
\* table, as restore did before.
\* How it breaks the promise: a table written under key 1, a rotation to
\* key 2, then backup 1, its metadata sealed under key 2 and its table still
\* under key 1. It is restored with a provider that has the right bytes for
\* key 2 and other bytes under key 1: the metadata opens, key 1 is there,
\* the table is copied and the MANIFEST written. The table does not open
\* under the bytes the provider gives for key 1, so the restored database
\* does not open. RestoredOpens fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* No delete or purge: the bug is in the restore.
CONSTRAINT NoCollection
\* No attacker: the bug needs none.
CONSTRAINT NoAttack
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two backups, the fewest the model takes.
  MaxBackups = 2
  \* One restore: the one that goes wrong.
  MaxRestores = 1
  \* One entry per batch of the walk of meta/.
  Batch = 1
  \* One pool file per batch of the sweep.
  Sweep = 1
  \* One table slot: the one table under key 1 is all the story needs.
  Slots = 1
  \* The defect above.
  Mutant = "FooterUnchecked"
\* The promise this bug breaks.
INVARIANT RestoredOpens
\* Every variable keeps its type.
INVARIANT TypeOK
