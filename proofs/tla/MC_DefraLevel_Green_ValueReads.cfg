\* DefraLevel value-validated reads [3.5]. A reader reads the version key and
\* decides on its value; two writers rewrite it with the same bytes or toggle it
\* between 1 and 2, so a value can also come back. No reader commits over a
\* different value, and none is refused while the key holds the value it read.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- ValueWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_ValueReadsCurrent
INVARIANT INV_IdenticalRewritesCommit
INVARIANT INV_ReasonsExact
