\* Format 2 under Immediate durability. Against every crash state at every
\* step, through rotations, a clean close and two crashes with recovery,
\* recovery opens, yields a gap-free prefix, keeps every acknowledged and
\* every synced commit, and never discards a record proven synced.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* At most 4 commits are appended in a run, across crashes. Shrunk from 5 when flushes and the
  \* close's seal in place joined the model, to keep the row under 20 s of one worker: 4 commits
  \* still reach two rotations, a flush, a seal in place behind an earlier log, and two crashes.
  MaxCommits = 4
  \* At most 3 log files exist: the earlier ones plus the newest.
  MaxFiles = 3
  \* Two crashes, each with a recovery, may happen.
  MaxCrashes = 2
  \* A commit is acknowledged once a sync covers it (DurabilityMode::Immediate).
  Mode = "Immediate"
  \* A record is usable when its checksum matches: no encryption.
  Frame = "Checksum"
  \* A crash damages nothing a sync had covered: an honest device.
  Residual = FALSE
  \* No planted bug: replay as the engine has it.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: after any crash an honest device can produce, reopened with the right
\* key, the database opens.
INVARIANT RecoveryOpens
\* Checked in every state: whatever recovery yields is commits 1 up to some n, with no hole.
INVARIANT NoGap
\* Checked in every state: every commit a completed sync covered is recovered after any crash an
\* honest device can produce.
INVARIANT KeepsSynced
\* Checked in every state: under Immediate, every acknowledged commit survives any crash an honest
\* device can produce.
INVARIANT AckedSurvive
\* Checked in every state: replay never discards a record that a surviving stamp proves synced.
INVARIANT NoProvenLoss
\* Checked in every state: a recovery that opens without some synced commit has reported a discarded
\* tail.
INVARIANT LossIsReported
\* Checked in every state: a reopen under the wrong key refuses; it never opens with the log
\* dropped.
INVARIANT WrongKeyRefuses
