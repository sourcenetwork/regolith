\* A pass retires a tombstone at the bottom while a snapshot below it keeps a
\* covered put alive in an older stripe. A snapshot taken after the
\* tombstone reads that put back. SnapshotReadsKept fails.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 4
  MaxRuns = 3
  Readers = {r1, r2}
  Retire = "IgnoreSnapshots"
INVARIANT SnapshotReadsKept
