\* An upgrade behind a reader, with a writer queued. Task 1 holds the
\* upgradable read from the start and asks to upgrade; task 2 reads from the
\* start; task 3 waits to write. The upgrade holds new readers back, is told
\* when the reader has left, and takes the write itself; the writer gets the
\* lock after it. Every safety invariant holds.
\*
\* A short scenario: the upgrader and the reader start inside and each task
\* asks once.
\*
\* The runs checked: every run that starts in Init and takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
