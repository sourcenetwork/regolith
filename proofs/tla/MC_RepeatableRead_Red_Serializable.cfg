\* Serializable: every key the head scan yielded is validated. The pruner
\* reclaims one of them under an open append and the append is refused,
\* although the head set it derived did not change. INV_AppendsCommit fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1, 2}
  Seed = 0
  Pruner = 3
  Writer = 4
  Patcher = 5
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "Serializable"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_AppendsCommit
