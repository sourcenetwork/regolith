\* Recovery drops a torn tail but does not truncate it before the next log
\* is created. The damaged bytes now sit in an earlier log, and the next
\* crash's replay refuses them as damage: a database that never opens again.
\* RecoveryOpens fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 5
  MaxFiles = 3
  MaxCrashes = 2
  Mode = "Eventual"
  Frame = "Checksum"
  Residual = FALSE
  Mutant = "NoTruncate"
INVARIANT RecoveryOpens
INVARIANT TypeOK
INVARIANT NoGap
INVARIANT KeepsSynced
INVARIANT NoProvenLoss
INVARIANT LossIsReported
