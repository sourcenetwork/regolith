\* Teeth for Red_LogAfterUse and Red_LogAfterUse_Reuse: the same mutant
\* and callers, every invariant but INV_UseDurable and INV_UsesUnique, over
\* the whole state space. All hold: the allocation records themselves stay
\* unique and growing, and nothing conflicts; the damage is a use outliving
\* its allocation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Clients = {"c1", "c2", "c3"}
  N = 2
  MayAbort = {}
  Durability = "Immediate"
  MaxCrashes = 1
  Mutant = "LogAfterUse"
INVARIANT TypeOK
INVARIANT INV_NeverConflicts
INVARIANT INV_Unique
INVARIANT INV_Monotonic
