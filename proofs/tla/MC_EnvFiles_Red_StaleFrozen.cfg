\* RED. The bug: a copy skips its freeze because the buffer is frozen now,
\* though it was not when the copy built. Story: writer 2 builds from
\* buffer 1 at length 0; writer 1 publishes its record in place (length
\* 1); writer 3 builds at length 1 and freezes; writer 2 sees "frozen",
\* skips, and swaps in its copy of length 0 plus its record. Writer 1's
\* finished append is gone. CurrentHoldsFinished breaks.

