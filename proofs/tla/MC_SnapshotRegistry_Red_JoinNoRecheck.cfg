\* The bug: a join keeps its count without reading the entry's sequence
\* again. Reader A looks at an entry that holds 0, its own sequence; the
\* entry's last pin is dropped and another reader claims it at 1; A adds
\* its count and goes on as if it held 0. A is live at 0 on an entry that
\* says 1.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* Renamed handles, threads, slots and entries count as one state.
SYMMETRY Sym
\* A state with no next step is fine: the commits are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three snapshot handles.
  Handles = {h1, h2, h3}
  \* Two threads.
  Threads = {t1, t2}
  \* Two slots.
  Slots = {s1, s2}
  \* Two entries per slot.
  Entries = {e1, e2}
  \* "No entry" is a value of its own.
  NoPos = NoPos
  \* Commits up to sequence 1: one commit, enough for every bug below.
  MaxSeq = 1
  \* The fix: confirm after the announce.
  Confirm = "Recheck"
  \* The fix: sample, then scan.
  Order = "SampleThenScan"
  \* The fix: release the entry the handle recorded.
  ReleaseMode = "Recorded"
  \* The fix: a copy joins the original's entry.
  CloneMode = "Join"
  \* The fix: claim with one compare-and-swap.
  ClaimMode = "Cas"
  \* The bug: no recheck after a join.
  JoinMode = "NoRecheck"
\* Fails: a live snapshot's entry holds another sequence.
INVARIANT LiveEntryExact
