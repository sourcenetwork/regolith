\* Frozen memtables flushed off the commit path (E9), by any thread, each
\* flush taking the oldest frozen memtable inside the `flushing`
\* exclusion, so they install in L0 in memtable order. Every read returns
\* the newest version through every freeze, install and range compaction.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 5
  MaxL0 = 3
  Picker = "Closure"
  MaxImm = 2
  FlushOrder = "Oldest"
  Levels = 1
  Ingest = "Off"
  Legacy = "Off"
INVARIANT TypeOK
INVARIANT ReadNewest
INVARIANT LevelsSorted
INVARIANT BisectIsScan
