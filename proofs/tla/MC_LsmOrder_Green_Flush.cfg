\* Frozen memtables flushed off the commit path (E9), by any thread, each
\* flush taking the oldest frozen memtable inside the `flushing`
\* exclusion, so they install in L0 in memtable order, the table published
\* and the memtable retired in one publication. Every read returns the
\* newest version through every freeze, install and range compaction, and
\* no view holds a version in two sources.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 5
  MaxL0 = 3
  Picker = "Closure"
  MaxImm = 2
  FlushOrder = "Oldest"
  \* A flush installs its table and retires its memtable in one publication.
  FlushPublish = "Together"
  Levels = 1
  Ingest = "Off"
  Legacy = "Off"
INVARIANT TypeOK
INVARIANT ReadNewest
\* No view a reader can load holds a version in two sources (E31).
INVARIANT NoDoubleSource
INVARIANT LevelsSorted
INVARIANT BisectIsScan
