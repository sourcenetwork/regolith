\* The bug: an add reads the shard and writes back one more, in two steps.
\* Threads 1 and 2 share shard 1: both read 0, both write 1. Two adds were
\* made and the shard says 1, so once everyone is done the sum is short.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* A state with no next step is fine: the adds are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three threads.
  Threads = {t1, t2, t3}
  \* Two shards, so at least two threads share one.
  NShards = 2
  \* Two adds per thread.
  MaxAdds = 2
  \* The bug: an add is a load, then a store.
  AddMode = "LoadStore"
  \* The code: a read sums every shard.
  ReadMode = "AllShards"
\* Fails: a shared shard lost an add.
INVARIANT QuiescentExact
