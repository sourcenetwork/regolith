\* The bug planted: a sealed log's stamp is written in place and left for
\* the log's first record sync to make durable, instead of staged, synced
\* and renamed into place before the log exists.
\* How it breaks the promise: the database creates its first log (TLC finds
\* it in the very first state), or a rotation creates the next one, and the
\* power goes before anything in it is synced. The stamp comes back half
\* written.
\* Reopened with the right key, the stamp's tag fails, and a torn sealed
\* stamp cannot be told from one under a wrong key, so the open refuses a
\* crash the device's flush honoured. RecoveryOpens fails.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* At most three commits, enough to sync one log and rotate.
  MaxCommits = 3
  \* An earlier log and the newest one.
  MaxFiles = 3
  \* One crash with recovery is enough to show the refusal.
  MaxCrashes = 1
  \* Immediate durability: what a sync covered was acknowledged.
  Mode = "Immediate"
  \* Sealed records and sealed stamps.
  Frame = "AEAD"
  \* No rot: the crash honours every flush.
  Residual = FALSE
  \* The defect above.
  Mutant = "StampUnsynced"
\* The promise this bug breaks.
INVARIANT RecoveryOpens
\* Every variable keeps its type.
INVARIANT TypeOK
