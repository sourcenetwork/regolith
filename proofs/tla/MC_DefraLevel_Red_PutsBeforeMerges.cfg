\* Green_OwnWrites with the commit applying every put before every merge, as the
\* 0.1.x engine does: a merge followed by a put commits the put and the operand,
\* not the put the transaction read back. INV_ReadYourOwnWrites fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- OwnWritesWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PutsBeforeMerges"
INVARIANT INV_ReadYourOwnWrites
INVARIANT INV_ReasonsExact
