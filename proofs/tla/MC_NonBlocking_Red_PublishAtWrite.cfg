\* RED. The bug: a round's commits become visible as soon as they are
\* written, before any queue's poll runs the fsync. Story: thread 1 commits,
\* waiting on round 4; readers see the commit while its fsync is still a
\* job on the queues. VisibleAfterSync breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit done) is not an error.
CHECK_DEADLOCK FALSE
