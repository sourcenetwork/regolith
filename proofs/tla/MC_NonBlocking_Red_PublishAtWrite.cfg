\* RED. The bug: the group becomes visible as soon as its leader writes it,
\* before any member's poll runs its fsync. Story: thread 1 commits into
\* group 4; readers see the commit while its fsync is still a job on the
\* queues. VisibleAfterSync breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block reads in this setup.
  Blocks = {}
  \* So nobody reads.
  Want <- WantNone
  \* No jobs in this setup.
  Jobs = {}
  \* So no job has a thread.
  JobOf <- JobOfNone
  \* The group's fsync needs one unit.
  MaxUnits = 1
  \* One commit group.
  Groups = {4}
  \* Both threads have a member in it.
  MembersOf <- MembersBoth
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* The planted bug.
  Mutant = "PublishAtWrite"
\* The invariant this bug must break.
INVARIANT VisibleAfterSync
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT SingleRun
\* Checked as well.
INVARIANT ExactlyOnce
