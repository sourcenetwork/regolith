\* The bug planted: the manifest records the move before the log holding the
\* copied range delete is written. The power is cut between the two. The next
\* open finds a manifest that already lists the tables in level 0, so it has no
\* move to make and copies nothing, and the log it replays never got the copy.
\* The read walks to the put at sequence 1 first and returns a key that was
\* deleted at 2. ReadNewest fails.
