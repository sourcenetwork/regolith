\* Green_Migrations with the definition declared content-addressed. The
\* class is sound only where the key determines the bytes, and the definition
\* changes under one key: a read of it that found it is now validated for
\* presence only, a migration's covered read of it is dropped because the
\* migration puts it, and a definition put is never checked against a newer
\* one (E17). The patcher replaces the
\* definition under an open writer or migration, which commits over it.
\* INV_NoStaleDefinition fails.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, never stalling for ever
\* while a step is possible.
SPECIFICATION Spec
\* Spend the states on the definition workload: only the writer, the patcher and the migrators ever
\* begin.
CONSTRAINT DefinitionWorkloadOnly
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Transaction 1 appends one block (the id is also the block's id).
  Appenders = {1}
  \* Block 0 is the head that exists before anything runs.
  Seed = 0
  \* Transaction 4 is the pruner, which sweeps superseded head keys.
  Pruner = 4
  \* Transaction 5 is the writer, which reads the definition and writes a document from it.
  Writer = 5
  \* Transaction 6 is the patcher, which replaces the definition.
  Patcher = 6
  \* No transaction applies a remote block.
  Mergers = {}
  \* The remote block's id is 9.
  Remote = 9
  \* The remote block names no parent (unused when no merger runs).
  RemoteParents = {}
  \* No transaction blind-merges an increment into the counter.
  Incrementers = {}
  \* No transaction reads the counter and then merges into it.
  ReadMergers = {}
  \* No transaction puts the counter and merges on top.
  Rebasers = {}
  \* No transaction deletes the counter.
  Resetters = {}
  \* No plain range delete runs over the counter's range.
  Clearers = {}
  \* Transactions 7 and 8 each scan from the heads through the definition and rewrite the
  \* definition.
  Migrators = {7, 8}
  \* None of the later workloads runs.
  Extras <- NoExtras
  \* The caller declares the head range and the marker range commutative
  \* (KeyClass::CommutativePrefix): a scan stretch that stays inside one of them records nothing.
  CommutativeRanges = {1, 2}
  \* The caller declares the definition range content-addressed (KeyClass::ContentAddressed): a key
  \* there is named after its bytes, so writing it twice stores the same thing. This is the misuse
  \* the configuration plants: the definition's bytes change under one key.
  ContentAddressedRanges = {3}
  \* Every transaction runs at DefraLevel: RepeatableRead with the relaxations the caller declares.
  Level = "DefraLevel"
  \* No planted bug: the commit rule as the engine has it.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* The promise the planted bug must break: no write built from the definition commits after that
\* definition was replaced.
INVARIANT INV_NoStaleDefinition
