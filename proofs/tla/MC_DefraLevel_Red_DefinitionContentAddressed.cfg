\* Green_Migrations with the definition declared content-addressed. The
\* class is sound only where the key determines the bytes, and the definition
\* changes under one key: a read of it now records nothing, and a definition
\* write is never checked against a newer one. The patcher replaces the
\* definition under an open writer or migration, which commits over it.
\* INV_NoStaleDefinition fails.
SPECIFICATION Spec
CONSTRAINT DefinitionWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {7, 8}
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {3}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoStaleDefinition
