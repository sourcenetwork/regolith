\* The flush unlinks its log before its table's batch is synced. A crash
\* tears the batch: no batch names the table and the log is gone, so the
\* flushed writes are lost. AckedSurvive fails.
\* The run: two keys, at most three writes, at most seven batches.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  MaxFrozen = 1
  Sealed = FALSE
  Mutant = "UnlinkBeforeSync"
INVARIANT AckedSurvive
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT ReadsNewest
INVARIANT RotSafe
