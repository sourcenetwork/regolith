\* The Detached design against the property that replaces #1911's
\* unchecked liveness: a transaction's commit returns while its append is
\* still an unnumbered pending row. INV_NumberedAtCommit fails. Left out
\* because the design breaks them too: INV_OneCommitPerWrite (Detached) and
\* INV_CommitOrder (DetachedOrder). Every other invariant is checked first
\* and holds up to that state (no once key here).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Detached"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_NoDisjointConflict
INVARIANT INV_Dense
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_NumberedAtCommit
