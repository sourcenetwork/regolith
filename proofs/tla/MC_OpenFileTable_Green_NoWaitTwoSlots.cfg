\* GREEN. Two slots, three threads, once each: thread 1 is a Blocking read
\* of table 1; threads 2 and 3 are queue units reading tables 1 and 2. Both
\* slots can be busy at once, so a unit's park marks two slots and either
\* leave wakes it; two units can be on the parked list together, and one
\* unit's look that claims a slot wakes the other. Every rule holds. (The
\* liveness check runs on the one-slot GREEN; here it would cost far more
\* than the safety rules this configuration adds.)

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* The reading threads.
  Threads = {1, 2, 3}
  \* The tables they read.
  Files = {1, 2}
  \* How many slots: max_open_files.
  Cap = 2
  \* Which table each thread reads.
  Want <- WantThree
  \* How many times each thread reads it.
  Reads = 1
  \* At most this many file openings in one run: one per read.
  MaxDesc = 3
  \* Threads 2 and 3 read as queue units.
  NoWait = {2, 3}
  \* The real code: no bug planted.
  Mutant = "none"
