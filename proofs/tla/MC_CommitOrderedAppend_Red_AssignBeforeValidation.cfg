\* Positions are assigned before the member is validated. a1 takes
\* position 1, then fails validation on another key and aborts; a2, behind
\* it in the same group, takes position 2, and no row ever holds 1.
\* INV_Dense fails. Every other invariant is checked first and holds up to
\* that state (no once key here).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {"a1"}
  GroupSize = 2
  Depth = 1
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "AssignBeforeValidation"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_Dense
