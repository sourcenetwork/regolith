\* RED. The bug: a contended writer registers its wait without reading the
\* count again. Story: the stop is on; writer 1's relieving step holds the
\* gate; writer 2 reads the count and finds the gate held; writer 1's step
\* ends, its count lands the unit with nobody on it, and writer 1 gives up;
\* writer 2 registers and waits. NoStrandedWait breaks.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* Two pieces of progress may leave the stop on.
  MaxSteps = 2
  \* The planted bug.
  Mode = "NoRecheck"
\* The invariant this bug must break.
INVARIANT NoStrandedWait
\* Checked as well.
INVARIANT TypeOK
