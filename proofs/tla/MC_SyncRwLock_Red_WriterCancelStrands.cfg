\* A waiting writer is dropped and nothing re-examines the reader queued
\* behind it: the reader waits although no writer holds or waits.
\* NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Watched = {1}
  Mutant = "WriterCancelStrands"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT NoSelfDeadlock
INVARIANT CancelPassesOn
