\* GREEN. The design, with no worker and one writer. Two writes fill a
\* memtable; a pass compacts L0 at two files. Write after write, for ever:
\* each write runs one step when one is owed and none otherwise, L0 never
\* passes two files, and no sealed memtable is left waiting.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
