\* Green_Parts with an operand that touches part 1 no longer counted as a change
\* to it. The part reader commits over it. INV_PartsCurrent fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- PartsWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PartsIgnoreTouch"
INVARIANT INV_PartsCurrent
INVARIANT INV_PartsRelaxed
INVARIANT INV_ReasonsExact
