\* The engine with three backups, so deleting one leaves two other metadata
\* files for the walk of meta/ to hand out, one per batch: the collection
\* reads one, crosses a batch boundary, and reads the other, in either order
\* the directory picks. The steps a delete can meet run beside it: tables
\* written and resealed, keys rotated, power cuts at every step, and one
\* attacker edit of a listing or one swap. Restores, which the collection
\* does not touch and MC_BackupSeal_Green checks with deletes, are left out
\* so the third backup stays in reach.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three backups in one behaviour: two left when one is deleted.
  MaxBackups = 3
  \* No restore: see above.
  MaxRestores = 0
  \* One entry per batch of the walk of meta/: a boundary after every entry.
  Batch = 1
  \* The engine, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* No metadata file and no restored MANIFEST is plain text.
INVARIANT SealedMetadata
\* A provider with every key the backup needs is never refused.
INVARIANT RightKeysRestore
\* A finished restore holds exactly what the backup held.
INVARIANT FaithfulRestore
\* A refused restore wrote nothing.
INVARIANT RefusalWritesNothing
\* Every table an untampered backup lists is in the pool.
INVARIANT ListedRestores
\* A delete holds only what is left of the deleted listing.
INVARIANT CollectionBounded
