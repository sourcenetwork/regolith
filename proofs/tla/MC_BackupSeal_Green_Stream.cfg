\* one, crosses a batch boundary, and reads the other (in id order; the
\* Lean proof covers every order). Power cuts at every step run beside it.
\* Restores, which the collection does
\* not touch and MC_BackupSeal_Green checks with deletes, are left out so
\* the third backup stays in reach.
\*
\* SHRUNK twice to finish in a few seconds of CPU on one TLC worker: one
\* table slot where there were two (11.3 million states, 9 minutes, down to
\* 220 thousand), then no attacker in this run (26 seconds, now about 25
\* thousand states): the attacker meets a sweep in MC_BackupSeal_Green_Sweep.
\* The walk of meta/ this run is about still hands out two listings across
\* a batch boundary, with every power cut beside it; the three backups
\* share the one table or hold it under two
\* keys. Two tables in the pool are MC_BackupSeal_Green_Sweep's, and the
\* Lean proof (collect_stream_eq, stream_keeps_listed) covers every number
