\* The defect: a helper voids a slot without looking at what the cell holds,
\* so it throws away a ticket whose order its owner already wrote down. The
\* owner goes on believing its order is in the ring. OwnerSeesItsFate fails;
\* the other invariants are checked too.
\* Check every behaviour of the model, the live threads kept running.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
\* What this run chooses: who takes part, what may go wrong, and which code is checked.
CONSTANTS
  \* The committing threads.
  Committers = {1, 2}
  \* Every committer is a transaction.
  Plain = {}
  \* Every transaction begins at the moment it commits.
  EarlyBegin = {}
  \* No ordered unit.
  Units = {}
  \* Which keys each thread writes: thread 1 key 1, thread 2 keys 1 and 2, thread 3 key 2.
  Writes <- Overlapping
  \* Which keys each transaction read and has checked: the ones it writes.
  Reads <- Overlapping
  \* The committers that wait for their record to be durable.
  Immediate = {1}
  \* More tickets than the threads ever pull (BoundNeverBinds checks it).
  MaxSlots = 3
  \* Nobody walks away.
  MaxStops = 0
  \* So no thread is named as one that may.
  Stoppers = {}
  \* Whoever gets there first pulls the first ticket.
  Head = 0
  \* The log never fails.
  MaxFails = 0
  \* The memtable never fills: no rotation in this run.
  Buffer = 9
  \* Every step of deciding and of publishing is taken on its own.
  Coarse = FALSE
  \* The defect this run plants.
  Mutant = "VoidNotCas"
\* The one that must break. An owner who thinks its order is in the ring is right.
INVARIANT OwnerSeesItsFate
\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* One thread at a time on the log's device step.
INVARIANT OneRound
\* Orders are settled in ticket order.
INVARIANT DecidedIsPrefix
\* The sequences handed out have no gap.
INVARIANT NoHole
\* Sequence order is ticket order.
INVARIANT SeqInRingOrder
\* An order is in the memtable before the next is decided.
INVARIANT AppliedBeforePassed
\* The memtable holds no order that was thrown out.
INVARIANT MemtableOnlyLive
\* The log holds no record of an order that was thrown out.
INVARIANT RecordsAreLive
\* Only what may be finished is finished.
INVARIANT PublishedPrefix
\* A finished order is visible to its owner.
INVARIANT PublishedIsVisible
\* No reader sees a later order without every earlier one.
INVARIANT ReadersSeePrefix
\* What a sync vouched for is written.
INVARIANT DurableImpliesWritten
\* No sync vouches for a sequence that was handed back.
INVARIANT DurableWithinDecided
\* At Immediate, visible only once durable.
INVARIANT DurableBeforeVisible
\* Two commits of one key never both land from one snapshot.
INVARIANT NoLostUpdate
\* No transaction is turned away for nothing.
INVARIANT AbortsHaveCause
\* A rotation leaves no record to write in a sealed log.
INVARIANT InFlightInCurrentLog
\* Nobody is told "done" for a lost order, or "failed" for a kept one.
INVARIANT NoFalseAck
\* A thread works out verdicts only for orders up to its own (E21).
INVARIANT WorksUpToItsOwn
\* A thread's note of the tip is for an order with no verdict.
INVARIANT NotesAreForUndecided
\* When nothing more can happen, every live thread has returned.
INVARIANT NoLiveThreadBlocked
\* The run's ticket bound never stops a live thread.
INVARIANT BoundNeverBinds
