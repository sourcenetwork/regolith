\* A once key is looked up in the view only, not through the earlier
\* members of the group or the earlier appends of the same transaction.
\* The writer appending o2 twice gets two rows for it, as do the two
\* writers sharing o1 when they meet in one group. INV_AtMostOnce fails.
\* Every other invariant is checked first and holds up to that state.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {}
  SharedOnce = {"s1", "s2"}
  Doubles = {}
  RepeatOnce = {"r1"}
  Silent = {}
  MayAbort = {}
  GroupSize = 2
  Depth = 1
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "OnceFromView"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_AtMostOnce
