\* Green_Log with the log reader seeing its own append at the position after
\* its snapshot's head. An appender commits first and takes that position, so
\* the reader saw an entry the log never held there.
\* INV_NoPhantomAppend fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- LogWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "OwnAppendVisible"
INVARIANT INV_NoPhantomAppend
INVARIANT INV_LogNeverConflicts
INVARIANT INV_LogDense
INVARIANT INV_ReasonsExact
