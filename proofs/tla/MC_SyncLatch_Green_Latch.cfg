\* A Latch of count 2: three tasks count down and wait in any order. No
\* wait completes before the count reaches 0, no waiter misses it, and
\* every waiter then passes.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, in which a started
\* operation finishes and a woken task is polled.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Three tasks use the gate: 1, 2 and 3.
  Tasks = {1, 2, 3}
  \* The gate is a Latch (with a count of 1 it is an Event).
  Kind = "Latch"
  \* The count is 2: a Latch needs two count-downs to open; a Barrier lets groups of two through.
  Count = 2
  \* Unused: a Latch has no rounds.
  Rounds = 0
  \* No planted bug: the design.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: no task gets through before its gate is really open.
INVARIANT GateHolds
\* Checked in every state: a waiter asleep beside an open gate was woken, or is about to be.
INVARIANT NoLostWakeup
\* Checked over whole runs: every waiter whose gate opened eventually stops sleeping.
PROPERTY ReleasedWaitersPass
