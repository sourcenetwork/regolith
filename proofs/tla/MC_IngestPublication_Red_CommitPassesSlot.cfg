\* The engine today: a commit that drew a later sequence publishes it with
\* fetch_max while the ingest's table is still being written. A snapshot in
\* that window reads ingested key 2 as absent, then as present once the
\* table lands. RepeatableSnapshot fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Commits = {"c1", "c2", "c3"}
  CommitKey = 1
  IngestKeys = {1, 2}
  Readers = {"r1", "r2"}
  Mutant = "CommitPassesSlot"
INVARIANT RepeatableSnapshot
