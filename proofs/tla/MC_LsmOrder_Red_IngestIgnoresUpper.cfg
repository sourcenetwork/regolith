\* Ingest places the file at the deepest level whose own tables it does not
\* overlap, without checking L0 and the levels above. An older version of
\* its key in L1 is read before the ingested file in L2. ReadNewest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2, 3}
  MaxSeq = 4
  MaxL0 = 2
  Picker = "Closure"
  MaxImm = 0
  FlushOrder = "Oldest"
  Levels = 2
  Ingest = "IgnoreUpper"
  Legacy = "Off"
INVARIANT ReadNewest
INVARIANT TypeOK
INVARIANT LevelsSorted
INVARIANT BisectIsScan
