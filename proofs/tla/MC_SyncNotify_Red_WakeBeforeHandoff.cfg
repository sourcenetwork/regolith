\* The drainer wakes the head before handing it the permit. The woken
\* future finds nothing, registers its waker again, and the handoff then
\* lands with no wake after it. NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Notifiers = {3}
  Watched = {1}
  MaxBcast = 0
  Mutant = "WakeBeforeHandoff"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT FifoHandoff
INVARIANT CancelPassesOn
