\* RED (E31). The bug: a flush publishes the view holding its table, then
\* retires its memtable in a second publication. Story, two steps: a put
\* writes key 1 at sequence 1; the flush publishes its table. The view now
\* holds the frozen memtable {<<1, 1>>} and the L0 file {<<1, 1>>} at once,
\* so a read that gathers key 1's merge operands from every source applies
\* that one twice. NoDoubleSource breaks.
\* The behaviours to check: Init, then any steps of Next.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two keys are enough: the bug needs one version.
  Keys = {1, 2}
  \* At most five writes.
  MaxSeq = 5
  \* At most three L0 files.
  MaxL0 = 3
  \* compact_range picks a closed set: the real code, not a bug.
  Picker = "Closure"
  \* The bug planted: the table first, the memtable's retirement after.
  FlushPublish = "Split"
\* The invariant this bug must break.
INVARIANT NoDoubleSource
\* Checked as well: every variable holds what it should.
INVARIANT TypeOK
\* Checked as well: a point read still returns the newest version, because
\* the two copies of a version agree. The bug shows only where operands
\* are gathered.
INVARIANT ReadNewest
