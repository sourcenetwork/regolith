\* RED (E31). The bug: a flush publishes the view holding its table, then
\* retires its memtable in a second publication. Story, three steps: a put
\* writes key 1 at sequence 1; a rotation freezes that memtable; the flush
\* publishes its table. The view now holds the frozen memtable {<<1, 1>>}
\* and the L0 file {<<1, 1>>} at once, so a read that gathers key 1's merge
\* operands from every source applies that one twice. NoDoubleSource breaks.
\* The behaviours to check: Init, then any steps of Next.
