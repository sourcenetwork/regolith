\* Task 1 only reads; tasks 2 and 3 only write, and may take turns without
\* end. The reader is served.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Bound = 1
  Watched = {1}
  Asks <- AsksReaderVsWriters
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT BoundedBypass
INVARIANT NoUpgradeDeadlock
INVARIANT NoLostWakeup
PROPERTY EveryWaiterServed
