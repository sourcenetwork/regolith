\* GREEN, with a commit. Writer w1 is a transaction's commit, which cannot be
\* made again; writer w2 is a plain write; one job, as in
\* MC_StallRelief_Green; and the relief of the stop may fail and recover.
\* The model records how the commit's call ends. Where the stall would
\* leave a writer waiting, the commit waits inside its call and writes once
\* the unit lands; it never gives up while its own steps make progress.
\* However its call ends, its write went in or it was told the relief's
\* failure (NoLostCommit), and it is never left waiting with nobody on the
\* way to land its unit (NoStrandedWait).
\*
\* SIZED like MC_StallRelief_Green_ReliefFails, whose run this is with one
\* of its two writers a commit. An engine that latches and a rotation whose
\* seal fails are in MC_StallRelief_Green_Commit_Failures.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* Two pieces of progress may leave the stop on.
  MaxSteps = 2
  \* The real code.
  Mode = "Green"
  \* The engine never latches and no rotation flushes at the memtable cap.
  Failures = FALSE
  \* The relief may fail and recover.
  ReliefFails = TRUE
  \* Writer w1 is a commit; w2 is a plain write.
  Commits = {w1}
  \* Inline compaction is on wherever stopped writers relieve: the run is the one
  \* this row had before inline compaction off was modelled.
  InlineOff = FALSE
