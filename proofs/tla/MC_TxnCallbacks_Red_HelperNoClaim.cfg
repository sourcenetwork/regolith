\* Completers take a decided outcome without claiming it. Two committers
\* (one helping the other) both complete the same commit and its on_commit
\* runs twice. AtMostOnce fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owners = {1, 2}
  Committers = {1, 2}
  MaxAttempts = 2
  Durability = "Immediate"
  Mutant = "HelperNoClaim"
INVARIANT AtMostOnce
INVARIANT TypeOK
INVARIANT CallbacksBeforeHooks
INVARIANT NoLostUpdate
INVARIANT AttemptIsolation
INVARIANT CommitAfterDurable
INVARIANT PanicAborts
