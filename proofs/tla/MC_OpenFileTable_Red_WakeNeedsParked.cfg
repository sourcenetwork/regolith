\* RED. The bug: a wake tells only the queues whose unit is already parked,
\* as if the waker unparked the unit itself and skipped one still running.
\* Story: thread 1 reads in the only slot; thread 2's unit joins the list
\* and marks the slot. Before thread 2 parks, thread 1 leaves and wakes the
\* list: thread 2's unit is not parked yet, so it is skipped, and taken off
\* the list. Thread 2 then parks with no message coming. RetryNeverLost
\* breaks. The real wake leaves a message in the inbox whatever the unit
\* is doing, and the poll reads it after the park.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
