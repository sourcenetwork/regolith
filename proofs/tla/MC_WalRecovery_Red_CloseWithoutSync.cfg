\* A clean close appends CLOSE without first syncing the records before
\* it. A crash keeps CLOSE, so P is the end of the file, but loses an
\* unsynced record before it: replay refuses a crash it should survive.
\* RecoveryOpens fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 5
  MaxFiles = 3
  MaxCrashes = 2
  Mode = "Eventual"
  Frame = "Checksum"
  Residual = FALSE
  Mutant = "CloseWithoutSync"
INVARIANT RecoveryOpens
INVARIANT TypeOK
INVARIANT NoGap
INVARIANT KeepsSynced
INVARIANT NoProvenLoss
INVARIANT LossIsReported
