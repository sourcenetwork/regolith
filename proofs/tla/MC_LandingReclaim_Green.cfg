\* The maps hold weak handles: a let-go block is freed while its owner idles.
\* Safety only: the spec has no fairness.
SPECIFICATION Spec
\* A finished run stutters; that is not a deadlock.
CHECK_DEADLOCK FALSE
\* No map keeps a strong handle.
CONSTANT Mutant = "none"
\* Every state is well typed.
INVARIANT TypeOK
\* A reader never holds a freed block.
INVARIANT PinnedBlockAlive
\* A let-go block is freed whatever kovan reclaims.
INVARIANT INV_ReleasedBlockFreed
