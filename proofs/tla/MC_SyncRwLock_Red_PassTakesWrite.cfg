\* Defect E33, planted: the code as it was. The pass reads the UPGRADING bit
\* to decide whether the upgrade in its slot was dropped, and takes the write
\* for that node when no reader is inside. Task 1's upgrade is dropped; task 2
\* leaves; task 3 takes the upgradable read. Either the pass spends task 3's
\* upgradable read for task 1's withdrawn node, or task 1's late release
\* lowers the bit task 3 raised: task 3 holds the upgradable read and the
\* lock word says nobody does, so a writer could enter beside it.
\* GuardsCounted fails.
