\* THE BUG: the gate this one replaced. A pass may enter only when no job is
\* inside AND no job waits; jobs enter whenever the gate is empty; nobody is
\* ever owed anything.
\* THE STORY: caller b1 is inside. The worker asks for a pass and queues.
\* Caller b2 asks and queues too. b1 leaves and everybody is woken: the worker
\* looks, sees b2 waiting, and is held back (loss 1). b2 enters. b1 asks again
\* and queues. b2 leaves: the worker looks, sees b1 waiting (loss 2). And so
\* on for as long as b1 and b2 keep coming: loss 3 is one more than Bound.
\* BoundedBypass fails: the worker's pass is starved.
\* NoLostWake and OwedShutsBarging are not listed: they speak of the front of
\* a queue and of an owed waiter, and the old gate had neither.
\* The system as CompactionGate.tla describes it, with fair scheduling.
SPECIFICATION Spec
\* The values this check fixes.
CONSTANTS
  \* The compaction workers.
  Workers = {"w"}
  \* The callers that wait for the gate on their own thread.
  Blockers = {"b1", "b2"}
  \* The callers whose job parks on their I/O queue.
  Owners = {}
  \* The losses after which a waiter is owed the gate.
  Bound = 2
  \* The most jobs waiting for the workers at once.
  MaxJobs = 1
  \* The planted defect, or "none".
  Mutant = "OldGate"
\* The promise this defect breaks, checked first: no waiter is passed over more than Bound times.
INVARIANT BoundedBypass
\* Every variable holds the kind of value it should.
INVARIANT TypeOK
\* A job is inside with no other job and no pass.
INVARIANT MutualExclusion
\* No worker runs two jobs without a pass between them.
INVARIANT WorkerTakesTurns
\* A thread is inside exactly when it believes it is, or was just handed the gate.
INVARIANT InsideMatches
