\* A woken waiter that loses the race goes to the back of the queue with a
\* fresh bypass count, so the handoff that its losses should earn never
\* comes: it loses more than Bound times. BoundedBypass fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  Bound = 1
  Watched = {1}
  Mutant = "LoseQueuePosition"
INVARIANT BoundedBypass
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT HandoffExclusive
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
