\* The witness that MC_ClaimSlots_Green reaches close winning a claim: the
\* same run with "close never aborts a transaction before its owner claims
\* the commit" added. It breaks: close swaps the claim out and aborts it,
\* and the owner's commit then fails with Closed. Every rule still holds.

\* The behaviours of the model.
SPECIFICATION Spec
\* A state where nothing can move before everybody is done is an error.
CHECK_DEADLOCK TRUE
\* The setup this configuration checks.
CONSTANTS
  \* Two owners run transactions.
  Owners = {1, 2}
  \* What each owner does.
  Script <- OneEach
  \* How many chunks the table may hold.
  Chunks = 2
  \* Free slots on the stack at the start.
  PreFree = 0
  \* Whether close runs.
  Closes = TRUE
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK OneHolder FreeStackSound CellBelongsToHolder DroppedOnce LiveTakenByClose DrainInBounds AtRest
\* The witness: "close never aborts a transaction before its commit". It must break.
INVARIANT NeverCloseFirst
