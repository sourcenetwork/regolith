\* A group member reads the head from the view only, not the view plus the
\* earlier members of its group. Two members of one group of two both take
\* the head plus one. INV_UniqueCursors fails. Every other invariant is
\* checked first and holds up to that state; the once keys are still looked
\* up through earlier members, so two writers sharing o1 still get one row.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2"}
  SharedOnce = {"s1", "s2"}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 2
  Depth = 1
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "ViewOnlyHead"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_AtMostOnce
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_UniqueCursors
