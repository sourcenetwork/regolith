\* Two levels below L0, level compaction, and external ingest placed at the
\* deepest level that nothing read before it overlaps. Every read returns
\* the newest version, every level stays sorted and non-overlapping, and
\* binary search finds what a linear scan finds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2, 3}
  MaxSeq = 4
  MaxL0 = 2
  Picker = "Closure"
  MaxImm = 0
  FlushOrder = "Oldest"
  Levels = 2
  Ingest = "Placed"
  Legacy = "Off"
INVARIANT TypeOK
INVARIANT ReadNewest
INVARIANT LevelsSorted
INVARIANT BisectIsScan
