\* The fix: the batch resolves every key against the view it captured.
\* Writes and flushes interleave with the batch at every point; every key
\* resolves against one view and answers as of the batch's start.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two keys, 1 and 2.
  Keys = {1, 2}
  \* The batch reads key 1, key 2, then key 1 again (the list ReadOneTwoOne of the model): multi_get
  \* accepts a key twice.
  BatchKeys <- ReadOneTwoOne
  \* At most 5 writes happen in a run.
  MaxSeq = 5
  \* At most 3 flushes happen in a run.
  MaxFlush = 3
  \* Every key of the batch is resolved against the view loaded at the start (the engine's rule).
  Mode = "OneView"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: every key of the batch was resolved against the same view.
INVARIANT BatchConsistent
\* Checked in every state: every key resolved so far got the newest version its snapshot may see.
INVARIANT BatchExact
