\* SHRUNK to finish in a few seconds of CPU on one TLC worker: one read per
\* thread where there were two (1,287,486 states, 79 seconds; now about 3
\* thousand). One read each still has two threads join one open file or
\* open it twice while the third opens its own, with every eviction the
\* two slots then need. A thread's second read, which meets the slots its
\* first left, is in MC_OpenFileTable_Green (one slot, two reads each,
\* where every open evicts), and the Lean
\* proof (open_le_cap, never_closes_in_use, reads_own_file) covers every
\* number of threads, slots and reads.

