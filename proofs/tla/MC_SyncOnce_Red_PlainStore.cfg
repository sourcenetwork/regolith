\* Publication is a plain store, not a CAS: a second publisher overwrites
\* the value a first one published and others already returned.
\* PublishedOnce fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Mutant = "PlainStore"
INVARIANT PublishedOnce
INVARIANT TypeOK
INVARIANT NoLostWakeup
