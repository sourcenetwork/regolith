\* An Event waiter finds it unset, the Event is set and its (empty) waiter
\* list released, and the waiter then pushes its node and parks without
\* looking again. It sleeps on a set Event. NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Latch"
  Count = 1
  Rounds = 0
  Mutant = "NoRecheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT GateHolds
