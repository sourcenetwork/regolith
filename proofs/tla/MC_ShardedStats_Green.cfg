\* The code. Three threads on two shards, two adds each, and a reader that
\* reads again and again while they add: every promise holds.
\* Check every behaviour of the spec.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A state with no next step is fine: the adds are bounded.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Three threads.
  Threads = {t1, t2, t3}
  \* Two shards, so at least two threads share one.
  NShards = 2
  \* Two adds per thread.
  MaxAdds = 2
  \* The code: an add is one fetch_add.
  AddMode = "Atomic"
  \* The code: a read sums every shard.
  ReadMode = "AllShards"
\* Every variable holds the kind of value it should.
INVARIANT TypeOK
\* Once every add is done, the shards sum to the adds.
INVARIANT QuiescentExact
\* A read reports between the totals at its start and end.
INVARIANT ReadBetween
\* A read never reports less than the read before.
INVARIANT NeverBackwards
