\* Teeth for Red_PublishedView: the same mutant and writers, every
\* invariant but INV_UniqueCursors and INV_NoSkip, over the whole state
\* space. All hold: the duplicate is the damage (and a reader that passed
\* the first copy misses the second, which is the INV_NoSkip it leaves out).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 2
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "PublishedView"
INVARIANT TypeOK
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
