\* Replay refuses every unusable record, a torn tail above P included. An
\* ordinary crash leaves an unsynced record unusable, and the database
\* never opens. RecoveryOpens fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* At most 5 commits are appended in a run, across crashes.
  MaxCommits = 5
  \* At most 3 log files exist: the earlier ones plus the newest.
  MaxFiles = 3
  \* Two crashes, each with a recovery, may happen.
  MaxCrashes = 2
  \* A commit is acknowledged as soon as it is appended, before any sync (DurabilityMode::Eventual).
  Mode = "Eventual"
  \* A record is usable when its checksum matches: no encryption.
  Frame = "Checksum"
  \* A crash damages nothing a sync had covered: an honest device.
  Residual = FALSE
  \* The planted bug: replay refuses on any unusable record, an ordinary torn tail included.
  Mutant = "RefuseAboveP"
\* The promise the planted bug must break: after any crash an honest device can produce, reopened
\* with the right key, the database opens.
INVARIANT RecoveryOpens
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: whatever recovery yields is commits 1 up to some n, with no hole.
INVARIANT NoGap
\* Checked in every state: every commit a completed sync covered is recovered after any crash an
\* honest device can produce.
INVARIANT KeepsSynced
\* Checked in every state: replay never discards a record that a surviving stamp proves synced.
INVARIANT NoProvenLoss
