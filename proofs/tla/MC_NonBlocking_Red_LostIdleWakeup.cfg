\* RED. The bug: going idle looks at the inbox and sets the IDLE bit in two
\* steps. Story: thread 1 looks (empty), thread 2 finishes block 1 and
\* pushes the "done" note (no IDLE bit yet, so no wake), thread 1 then sets
\* IDLE and sleeps on an unread note forever. NoLostIdleWakeup breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* Two blocks reads can miss.
  Blocks = {1, 2}
  \* Thread 1 reads blocks 1 and 2; thread 2 reads block 1.
  Want <- WantPool
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* Block 1 can be made twice (once per thread), block 2 once.
  MaxUnits = 3
  \* No commit groups in this setup.
  Groups = {}
  \* So no group has members.
  MembersOf <- MembersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* The planted bug.
  Mutant = "LostIdleWakeup"
\* The invariant this bug must break.
INVARIANT NoLostIdleWakeup
