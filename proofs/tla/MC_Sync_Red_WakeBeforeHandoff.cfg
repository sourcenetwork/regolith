\* The drainer wakes the head before handing it the lock. The woken future
\* is polled, finds nothing handed to it, and registers its waker again;
\* then the handoff lands with no wake after it. The waiter owns the lock
\* and sleeps. NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "WakeBeforeHandoff"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT FifoHandoff
INVARIANT CancelPassesOn
