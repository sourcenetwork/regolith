\* The same bug as MC_LogTruncate_Red_NoHeadGuard, seen through its effect on an append.
\* How it breaks the promise: a writer appends position 3 and commits; a truncate that began earlier asked to
\* delete position 3, finds the new entry and is refused, so INV_NoConflict fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writers, w1 and w2.
  Writers = {"w1", "w2"}
  \* One reader, r1.
  Readers = {"r1"}
  \* The log can reach position 4: the two it starts with and two appends.
  MaxPos = 4
  \* A transaction appends at most once.
  MaxApp = 1
  \* Two commits after the first: one for each writer.
  MaxSeq = 3
  \* The defect above.
  Mutant = "NoHeadGuard"
\* Checked in every state: no append and no truncate ever fails a commit.
INVARIANT INV_NoConflict
