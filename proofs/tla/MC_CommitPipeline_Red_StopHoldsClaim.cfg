\* Not a defect of the design but its stated limit, shown as a RED so it is
\* not forgotten: a thread that holds the round, or that claimed an ordered
\* unit, is taken to be at work on the device and the GREEN runs never stop
\* it there. This run does. The thread walks away holding the round, and the
\* commit that waits for the sync waits for ever. NoLiveThreadBlocked fails;
\* the other invariants are checked too.
\* Check every behaviour of the model, the live threads kept running.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
