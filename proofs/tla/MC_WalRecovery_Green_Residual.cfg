\* The residual case (4.2 item 5, D6): a crash may also damage the last
\* synced group. Recovery refuses when a later record proves that group
\* synced, and otherwise drops it as a tail and reports the discard: a loss
\* of synced data is never silent, the result is still a gap-free prefix,
\* and no record proven synced is discarded.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: four
\* commits where there were five (12,460 states and 18 seconds; now 3,693
\* states and about 9). Still here: three log files, two crashes, and damage
\* to the last synced group with and without a later record that proves it
\* synced. Gone: a fifth commit; MC_WalRecovery_Green_Immediate and
\* _Eventual keep five. Lean covers every number of commits, files and crashes:
\* replay2_opens_of_honest, replay2_keeps_proven and recovers_prefix2 in
\* Regolith/WalRecovery.lean.
