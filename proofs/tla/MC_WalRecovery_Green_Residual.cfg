\* The residual case (4.2 item 5, D6): a crash may also damage the last
\* synced group. Recovery refuses when a later record proves that group
\* synced, and otherwise drops it as a tail and reports the discard: a loss
\* of synced data is never silent, the result is still a gap-free prefix,
\* and no record proven synced is discarded.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 5
  MaxFiles = 3
  MaxCrashes = 2
  Mode = "Immediate"
  Frame = "Checksum"
  Residual = TRUE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT NoGap
INVARIANT KeepsSynced
INVARIANT AckedSurvive
INVARIANT NoProvenLoss
INVARIANT LossIsReported
INVARIANT WrongKeyRefuses
