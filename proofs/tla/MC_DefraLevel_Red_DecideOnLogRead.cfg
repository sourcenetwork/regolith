\* A caller misuse, not a mutant: a decider reads the log head, which is never
\* validated, and records how many entries the log holds. An appender commits
\* under it, and the decision is stale [3.1, exempt reads].
\* INV_LogDecisionsCurrent fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- LogDecisionWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT INV_LogDecisionsCurrent
INVARIANT INV_LogNeverConflicts
INVARIANT INV_LogDense
INVARIANT INV_ReasonsExact
