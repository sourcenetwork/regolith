\* RED. The bug: a stopped writer registers its wait and never looks at the
\* stall again. Story: thread 1 sees stall 5; the stall clears, and its
\* clearer finds no unit to land; thread 1 then installs a fresh unit and
\* leaves it, and nobody ever lands it. StallLandsWhenClear breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every write done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block reads in this setup.
  Blocks = {}
  \* So nobody reads.
  Want <- WantNone
  \* No jobs in this setup.
  Jobs = {}
  \* So no job has a thread.
  JobOf <- JobOfNone
  \* A unit per install, and each writer may install one.
  MaxUnits = 3
  \* No commit groups in this setup.
  Groups = {}
  \* So no group has members.
  MembersOf <- MembersNone
  \* One write stall.
  Stalls = {5}
  \* It stops both threads' writes.
  StoppedBy <- StoppedBoth
  \* The planted bug.
  Mutant = "NoRecheck"
\* The invariant this bug must break.
INVARIANT StallLandsWhenClear
