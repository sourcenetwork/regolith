\* Green_Heads at RepeatableRead, which ignores the classifier: the second
\* application of the same block is refused, its identical head write lying
\* inside the stretch its head scan walked and its read of the block key
\* validated. INV_DuplicateMergesCommit fails.
SPECIFICATION Spec
CONSTRAINT HeadsWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {3}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {7, 8}
  Remote = 2
  RemoteParents = {0}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {6}
  Level = "RepeatableRead"
  Mutant = "none"
INVARIANT INV_DuplicateMergesCommit
