\* RepeatableRead refuses the second application of the same block: its
\* identical head write lies inside the stretch its head scan walked.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {3}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {7, 8}
  Remote = 2
  RemoteParents = {0}
  Incrementers = {}
  Resetters = {}
  CommutativeRanges = {1, 2}
  Level = "RepeatableRead"
INVARIANT INV_DuplicateMergesCommit
