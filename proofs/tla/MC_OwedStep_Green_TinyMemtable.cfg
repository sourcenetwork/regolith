\* GREEN. The design with the smallest memtable there is: every write seals,
\* so every write's one step is a flush and no write ever has a step left
\* for a compaction. L0 climbs to the stop trigger, four files; the next
\* write is stopped, relieves the stop with a compaction, and goes on. L0
\* never passes four files, and each write still runs exactly one owed step.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
