\* Two readers at once: one commit, two threads that may both apply it, and
\* two readers that start at any moment. Every invariant holds.
\* Check every behaviour of the model.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
\* What this run chooses: how many commits and threads, and which code is checked.
CONSTANTS
  \* One commit, with one range tombstone.
  Commits = 1
  \* The threads that apply them: any of them may apply any commit.
  Appliers = {a1, a2}
  \* The readers.
  Readers = {r1, r2}
  \* The real code.
  Mode = "Green"
\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* No two appends share a slot.
INVARIANT OneSlotEach
