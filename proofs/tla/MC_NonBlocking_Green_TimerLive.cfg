\* GREEN. Liveness of timed waits: thread 1 asks its queue for timed wait 6,
\* thread 2 for timed wait 7, and thread 2 may drop its queue at any point.
\* Either thread may go idle. Every timed wait finishes in every fair run
\* (AllDone), and every invariant holds here too.
\*
\* Nobody pushes anything to a queue for a timed wait, so nothing wakes an
\* idle owner when one comes due. What carries the run is the owner itself:
\* it does not go idle while a wait it holds is due, and it idles no longer
\* than its last poll said it might (TimerWake).
\*
\* Example of what it rules out: thread 1's poll takes wait 6 in, finds it
\* not yet due, and thread 1 goes idle. The wait comes due, nobody is woken,
\* and thread 1 sleeps for ever. MC_NonBlocking_Red_IdlePastDue is that
\* owner.
\*
\* This run is the liveness half of MC_NonBlocking_Green_Timer, which adds
\* a read beside the waits and checks the invariants at that size. Lean
\* proves that an owner that polls again within what its poll reported
\* completes the wait, for any clock: poll_after_wake_in_completes in
\* Regolith/IoQueue.lean.

\* The behaviours of the model: Init, then steps of Next, each thread fair.
SPECIFICATION Spec
\* A run that ends (everything done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block in this setup.
  Blocks = {}
  \* So no thread reads one.
  Want <- WantNone
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* No unit is ever made here; the bound only needs a value.
  MaxUnits = 1
  \* No sync rounds in this setup.
  Rounds = {}
  \* So no round covers a commit.
  CommittersOf <- CommittersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* Two timed waits.
  Timers = {6, 7}
  \* Wait 6 is thread 1's and wait 7 is thread 2's.
  TimerOf <- TimerOfEach
  \* Thread 2 may drop its queue.
  Droppers = {2}
  \* The real code: no bug planted.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* No thread sleeps unwoken with a note in its inbox.
INVARIANT NoLostIdleWakeup
\* Only an idle thread is ever woken.
INVARIANT BusyNeverWoken
\* A wait is made ready only at its own thread's poll.
INVARIANT DeliveredOnOwnPoll
\* A timed wait sits only on the queue of the thread that asked for it.
INVARIANT TimerOnOwnQueue
\* A timed wait is ready only once it is due, or its queue is gone.
INVARIANT TimerNotEarly
\* A dropped queue leaves no timed wait pending.
INVARIANT DroppedHoldsNothing
\* The promise of this run: every timed wait finishes, in every fair run.
PROPERTY AllDone
