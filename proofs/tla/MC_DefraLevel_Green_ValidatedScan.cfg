\* DefraLevel validated scans [3.15]. A checker scans the grant range with
\* scan_validated and decides on the grants it found; a revoker deletes the
\* grant and a granter adds another (a phantom). Any newer write inside the
\* range refuses the checker, so no decision commits over a changed range.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- ScanWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_ScanDecisionsCurrent
INVARIANT INV_ReasonsExact
