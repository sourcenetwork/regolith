\* The bug: a release forgets that its handle moved. Handle B registers at 0
\* on thread 2 in slot 2, entry 1. A commit makes the horizon 1. Handle A
\* registers at 1 on thread 1 in slot 1, entry 1. A moves to thread 2 and is
\* dropped there, and the release takes a count off slot 2, entry 1: B's
\* entry goes free while B is live. A compaction samples 1 and lists only
\* A's stale 1. B, at 0, is neither listed nor at or above the sample.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* Renamed handles, threads, slots and entries count as one state.
SYMMETRY Sym
\* A state with no next step is fine: the commits are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three snapshot handles.
  Handles = {h1, h2, h3}
  \* Two threads.
  Threads = {t1, t2}
  \* Two slots.
  Slots = {s1, s2}
  \* Two entries per slot.
  Entries = {e1, e2}
  \* "No entry" is a value of its own.
  NoPos = NoPos
  \* Commits up to sequence 1: one commit, enough for every bug below.
  MaxSeq = 1
  \* The fix: confirm after the announce.
  Confirm = "Recheck"
  \* The fix: sample, then scan.
  Order = "SampleThenScan"
  \* The bug: release in the dropping thread's slot.
  ReleaseMode = "Here"
  \* The fix: a copy joins the original's entry.
  CloneMode = "Join"
  \* The fix: claim with one compare-and-swap.
  ClaimMode = "Cas"
  \* The fix: recheck the sequence after a join.
  JoinMode = "Recheck"
\* Fails: a live snapshot is neither listed nor above the sample.
INVARIANT LiveCovered
