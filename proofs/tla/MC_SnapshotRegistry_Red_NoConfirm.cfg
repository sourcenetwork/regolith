\* The defect: a reader goes live at the horizon it announced without
\* sampling again. It read 0; the horizon rose to 1; a compaction sampled 1
\* and scanned the still-empty slot; the reader then published 0. The
\* compaction's minimum, 1, is above the live snapshot. MinBelowLive fails.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers = {r1, r2, r3}
  MaxSeq = 3
  Confirm = "None"
  Order = "SampleThenScan"
INVARIANT MinBelowLive
INVARIANT TypeOK
INVARIANT LiveSlotExact
