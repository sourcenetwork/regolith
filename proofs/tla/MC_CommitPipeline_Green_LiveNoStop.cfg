\* Liveness for all three threads: two committers and one ingest with
\* overlapping keys, one committer at Immediate, and nobody stops. Some slot
\* always completes (LockFree) and every commit completes
\* (EveryLiveCommitCompletes), in every interleaving of the three. Every
\* invariant holds too.
\* Check every behaviour of the spec, the live threads kept running.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* The committing threads.
  Committers = {1, 2}
  \* The ingesting threads.
  Ingesters = {3}
  \* Which keys each thread writes: they overlap.
  Writes <- Overlapping
  \* The committers that wait for their record to be durable.
  Immediate = {1}
  \* More slots than the threads ever reserve (BoundNeverBinds checks it).
  MaxSlots = 6
  \* Nobody stops: the stop is in the two smaller liveness runs.
  MaxStops = 0
  \* The design, no defect.
  Mutant = "none"
\* Every invariant of the model.
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
\* Some slot always completes while a live thread has work.
PROPERTY LockFree
\* Every commit of a thread that did not stop completes.
PROPERTY EveryLiveCommitCompletes
