\* The second half of defect E32, planted: a release that finds the drain role
\* taken raises DIRTY. Task 1 has been served and its node is gone; task 2
\* drops its guard, takes the drain role, and its pass finds nobody queued.
\* Before it can give the role up, task 1 takes the lock and lets it go:
\* QUEUED is still up, so that release asks for a pass, DIRTY goes up, and
\* task 2 passes again, over an empty queue, and again for the next release:
\* passes no waiter earned. DrainBounded fails.
\*
\* The runs checked: every run that starts in Init and takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two tasks use the lock: 1 and 2.
  Tasks = {1, 2}
  \* The lock is a semaphore; with one permit it is a Mutex.
  Kind = "Semaphore"
  \* One permit: at most one holder.
  Permits = 1
  \* Every task asks for one permit.
  Need <- NeedOne
  \* Every task is its own owner (unused unless the lock is reentrant).
  Owner <- OwnerEach
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* Guards stay with the task that took them.
  Owned = FALSE
  \* A waiter is owed a handoff after one lost race.
  Bound = 1
  \* Task 1 waits when the lock is taken; task 2 only tries.
  Waits = {1}
  \* No waiting future is dropped.
  Drops = {}
  \* Every task asks for the lock as often as it likes.
  Turns <- TurnsAny
  \* Nobody holds the lock when the run starts.
  Start = {}
  \* The tasks may ask in any order.
  Follows <- FollowsNobody
  \* No "is eventually served" promise is checked in this run.
  Watched = {}
  \* The passes of a drain are not counted in this run (what each drain has earned is).
  PassMax = 0
  \* The planted bug: a release that finds the drain role taken raises DIRTY, not only
  \* WAKE_FRONT.
  Mutant = "ReleaseDirties"
\* The promise the planted bug must break: a drain runs one pass, and one more for each waiter
\* operation or release with somebody to tell that lands while it runs; none for a release over an
\* empty queue.
