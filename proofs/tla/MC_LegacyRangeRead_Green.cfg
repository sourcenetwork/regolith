\* The engine as built (E14). A 0.1.x database holds a key put at sequence 1
\* and a range delete over it at sequence 2, in a table the open's move
\* leaves behind the put. The open copies the range delete into the memtable
\* it recovers, writes that memtable to the log, and only then records the
\* move in the manifest. Through every power cut, put, flush and compaction,
\* every read at every snapshot returns what the sequences say.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the size, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* At most 4 sequences: the put, the range delete, and two puts after the open.
  MaxSeq = 4
  \* The open copies the moved tables' range deletes into the memtable (the engine).
  Hoist = TRUE
  \* A read gathers no range delete ahead of its walk (the engine).
  PreScan = FALSE
  \* The log is written before the manifest records the move (the engine).
  RecordFirst = FALSE
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: once the memtable is rebuilt, every read at every snapshot returns
\* what the sequences say.
