\* A reentrant read by a task whose owner already reads is treated as a
\* fresh read, so it queues behind a waiting writer. The task waits while
\* holding the read the writer waits for. NoSelfDeadlock fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Owner <- OwnerPair
  MaxDepth = 2
  Watched = {1}
  Mutant = "OwnerUnaware"
INVARIANT NoSelfDeadlock
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT CancelPassesOn
