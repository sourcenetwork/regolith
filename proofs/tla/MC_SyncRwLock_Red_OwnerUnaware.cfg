\* A reentrant read by a task whose owner already reads is treated as a
\* fresh read; with a handoff owed to a waiting writer it queues, holding
\* the read the writer waits for. NoSelfDeadlock fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Owner <- OwnerPair
  MaxDepth = 2
  Bound = 1
  Watched = {1}
  Asks <- AsksAll
  Mutant = "OwnerUnaware"
INVARIANT NoSelfDeadlock
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT UpgradeHoldsBack
INVARIANT NoUpgradeDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
