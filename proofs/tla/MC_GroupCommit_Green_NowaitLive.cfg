\* GREEN. Liveness and the failed group with commit_nowait, on a run small
\* enough to check a temporal property in a few seconds: transactions 1 and
\* 3 commit at Immediate through commit_nowait, the plain write 4 blocks,
\* and a group may fail. A group left owed is claimed and landed by
\* somebody, so every commit gets its answer in the end
\* (AllTicketsComplete), and every safety invariant holds.
\*
\* Example of what it rules out: the leader writes the group of 1 and 3,
\* leaves it owed and returns; neither member's poll claims it and no later
\* writer lands it, so both wait for ever. Second example: the claimer's
\* fsync fails and only the claimer hears of it.
\*
\* This run is the liveness and failure half of MC_GroupCommit_Green_Nowait,
\* which keeps four commits and the safety invariants without a failing
\* group (4,564 states here against 80,933 there). It does go through owed
\* groups: checked against NothingOwed this setup breaks it, and the bug
\* DoubleClaim breaks SingleSync at this size. What three commits do not
\* show: a commit queued behind a full owed group of three.
\* Lean covers the owed group for every number of members: group_sync_once
\* and group_visible_after_sync in Regolith/IoQueue.lean; group_eq_serial in
\* Regolith/GroupCommit.lean covers the verdicts for every group size. No
\* Lean theorem states the failed group or the liveness claim.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every commit is done is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three commits: transactions 1 and 3, and the plain write 4.
  Txns = {1, 3, 4}
  \* Commit 4 is a plain write: no snapshot, no validation, it always lands.
  Plain = {4}
  \* The two keys they read and write.
  Keys = {1, 2}
  \* What each commit reads (ReadsW in GroupCommit.tla).
  Reads <- ReadsW
  \* What each commit writes (WritesW in GroupCommit.tla).
  Writes <- WritesW
  \* Transactions 1 and 3 wait for their record to be durable.
  Immediate = {1, 3}
  \* A group takes up to three members.
  MaxGroup = 3
  \* A group's write or sync may fail.
  Faults = TRUE
  \* Transactions 1 and 3 are made by commit_nowait.
  Nowait = {1, 3}
  \* The design, no defect.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* The commits that succeeded are the ones a one-at-a-time order would accept.
INVARIANT SerialEquivalent
\* Sequences are handed out in the order the commits were decided.
INVARIANT SeqFollowsDecisionOrder
\* The memtable holds exactly the writes of the commits that landed.
INVARIANT StoreHoldsCommits
\* A reader sees a group all or nothing: what is visible is in the memtable.
INVARIANT VisibleIsApplied
\* A commit that waits for an fsync is not visible before that fsync.
INVARIANT DurableBeforeVisible
\* Every caller is answered at most once, and a done commit exactly once.
INVARIANT TicketsCompleteOnce
\* A "committed" answer is true: the commit is visible, and durable if it asked.
INVARIANT TicketMeansVisible
\* A leader leads one group, then hands off.
INVARIANT BoundedTurn
\* When no step is possible, every commit has its answer.
INVARIANT NoStuckTicket
\* An owed group's fsync runs once, however many members poll for it.
INVARIANT SingleSync
\* While a group is owed, the pipeline writes no other group.
INVARIANT OwedBlocksNextGroup
\* The promise of this run: in the end every commit is done.
PROPERTY AllTicketsComplete
