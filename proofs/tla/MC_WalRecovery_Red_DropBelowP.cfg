\* Replay drops the tail even when the first unusable record lies below P.
\* The last synced group is damaged and a later record, written after that
\* sync completed, survives with a stamp proving the group synced; the
\* replay drops the acknowledged group anyway. NoProvenLoss fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 5
  MaxFiles = 3
  MaxCrashes = 2
  Mode = "Immediate"
  Frame = "Checksum"
  Residual = TRUE
  Mutant = "DropBelowP"
INVARIANT NoProvenLoss
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT NoGap
INVARIANT KeepsSynced
INVARIANT AckedSurvive
INVARIANT LossIsReported
