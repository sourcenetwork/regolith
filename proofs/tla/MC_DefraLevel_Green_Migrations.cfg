\* DefraLevel with the head and marker ranges declared commutative, on the
\* definition alone. Two migrations each scan from the head range through the
\* definition in one stream; the stretch leaves the head prefix, so the policy
\* keeps it and the definition write inside it is validated as a read. With the
\* writer's point read and the patcher, no write derived from the definition
\* commits over a definition replaced after it was read
\* (INV_NoStaleDefinition). This is where the writer and the patcher run at
\* DefraLevel; Green_Heads keeps them idle.
SPECIFICATION Spec
CONSTRAINT DefinitionWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {7, 8}
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoStaleDefinition
