\* The Phase 7 pipeline with assignment reading the published view: a1's
\* group is decided at position 1 but not yet published when a2's group
\* decides, so a2 also takes position 1. INV_UniqueCursors fails. Left out
\* because a duplicate published in a later group also lands below a
\* reader that passed the first: INV_NoSkip. Every other invariant is
\* checked first and holds up to that state (no once key here).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 2
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "PublishedView"
INVARIANT TypeOK
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_UniqueCursors
