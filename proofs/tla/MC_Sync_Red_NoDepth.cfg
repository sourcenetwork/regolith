\* A ReentrantMutex that frees the lock on any guard drop, ignoring the
\* depth: the lock is free while a guard is still out. ReentrancyDepth
\* fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerPair
  MaxDepth = 2
  Owned = FALSE
  Bound = 1
  Watched = {1}
  Mutant = "NoDepth"
INVARIANT ReentrancyDepth
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
