\* A ReentrantMutex that frees the lock on any guard drop, ignoring the
\* depth. Task 1 nests a second guard (or task 2 of the same owner enters)
\* and one guard drops: the lock is free while a guard is still out.
\* ReentrancyDepth fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Reentrant"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerPair
  MaxDepth = 2
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "NoDepth"
INVARIANT ReentrancyDepth
INVARIANT TypeOK
INVARIANT FifoHandoff
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
