\* The counter at DefraLevel, two blind increments and a reset, with a conflict
\* reason that names the key's newest write instead of the write that decided.
\* An increment loses to the reset, and another increment lands on top of the
\* reset before it commits: the reason names that operand, which cannot refuse a
\* blind merge. INV_ReasonsExact fails.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {10}
  Clearers = {}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "ReasonNewestWrite"
INVARIANT INV_ReasonsExact
INVARIANT INV_CounterExact
INVARIANT INV_IncrementsCommitUnlessReplaced
