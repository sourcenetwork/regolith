\* The bug: the hand evicts and frees whatever it lands on, pinned or not.
\* A reader holding the block is left with freed memory: NoFreedPin breaks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks = {b1, b2, b3}
  Readers = {r1, r2}
  Queues = {q1}
  Size <- UnitSizes
  Cap = 2
  Mode = "IgnorePins"
INVARIANT NoFreedPin
