\* GREEN. Timed waits beside a read. Thread 1 misses block 1 and asks its
\* queue for timed wait 6 (a retry backing off); thread 2 asks for timed
\* wait 7 and may drop its queue at any point. Every invariant holds: a
\* timed wait sits on its own thread's queue, is made ready only by that
\* thread's poll and only once the clock reached its due time, and a dropped
\* queue leaves none pending.
\*
\* Example of what it rules out: thread 1's poll takes the note for wait 6
\* in and completes it at once, before its due time, so the retry runs again
\* with no backoff at all. Or: thread 2 drops its queue while wait 7 is
\* still a note in its inbox, and the task waiting on it is never told.
\*
\* That every timed wait finishes is MC_NonBlocking_Green_TimerLive's. Lean
\* proves the rules for every number of waits and steps:
\* timed_wait_completed_once, timed_wait_completed_by_owner,
\* timed_wait_not_before_due and dropped_queue_holds_no_wait in
\* Regolith/IoQueue.lean.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (everything done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* One block.
  Blocks = {1}
  \* Thread 1 reads it; thread 2 reads nothing.
  Want <- WantOne
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* The block needs one unit.
  MaxUnits = 1
  \* No sync rounds in this setup.
  Rounds = {}
  \* So no round covers a commit.
  CommittersOf <- CommittersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* Two timed waits.
  Timers = {6, 7}
  \* Wait 6 is thread 1's and wait 7 is thread 2's.
  TimerOf <- TimerOfEach
  \* Thread 2, which waits on nothing else, may drop its queue.
  Droppers = {2}
  \* The real code: no bug planted.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* A unit's disk read runs at most once.
INVARIANT SingleRun
\* A queue gets at most one note per unit, and only if it registered.
INVARIANT ExactlyOnce
\* Every queue that registered on a finished unit gets its note.
INVARIANT EveryWaiterTold
\* A read's request sits only on its own thread's queue.
INVARIANT OwnQueue
\* No thread sleeps unwoken with a note in its inbox.
INVARIANT NoLostIdleWakeup
\* Only an idle thread is ever woken.
INVARIANT BusyNeverWoken
\* Every free unit is held by some queue, so some poll runs it.
INVARIANT NoOrphanUnit
\* A wait is made ready only at its own thread's poll.
INVARIANT DeliveredOnOwnPoll
\* A timed wait sits only on the queue of the thread that asked for it.
INVARIANT TimerOnOwnQueue
\* A timed wait is ready only once it is due, or its queue is gone.
INVARIANT TimerNotEarly
\* A dropped queue leaves no timed wait pending.
INVARIANT DroppedHoldsNothing
