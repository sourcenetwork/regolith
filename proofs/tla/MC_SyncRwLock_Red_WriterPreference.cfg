\* A write release hands the lock to the next writer even while readers
\* wait. A reader queued behind a writer sees a second write phase begin
\* before it is admitted. ReadersWaitOnePhase fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Watched = {1}
  Mutant = "WriterPreference"
INVARIANT ReadersWaitOnePhase
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT NoSelfDeadlock
INVARIANT CancelPassesOn
