\* The bug: a position is taken with a load and a store instead of one add,
\* so two appends take the same one: OneSlotEach breaks. The other invariants
\* are checked too. What that costs is in MC_TombstoneLog_Red_LoadStore_Lost.
\* Check every behaviour of the model.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two commits, each with one range tombstone.
  Commits = 2
  \* The threads that apply them: any of them may apply any commit.
  Appliers = {a1, a2}
  \* The reader.
  Readers = {r1}
  \* The bug: a position is taken with a load and a store, not one add.
  Mode = "LoadStore"
\* The one that must break. No two appends share a slot.
INVARIANT OneSlotEach
\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* A reader never reads a slot before its tombstone is in it.
INVARIANT ReadWhole
\* A reader sees every tombstone its snapshot includes.
INVARIANT PublishedSeen
