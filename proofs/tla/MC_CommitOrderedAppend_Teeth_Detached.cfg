\* Teeth for Red_Detached, Red_DetachedOrder and Red_DetachedNumbering: the
\* same design and writers, every invariant but the three they are about
\* (INV_OneCommitPerWrite, INV_CommitOrder, INV_NumberedAtCommit), over
\* the whole state space. All hold: the second commit numbers densely and
\* uniquely, and no reader skips.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Detached"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_NoDisjointConflict
INVARIANT INV_Dense
INVARIANT INV_OwnAppendsInvisible
