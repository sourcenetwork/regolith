\* RED. The bug: an owner that wakes on its own forgets to clear its IDLE
\* bit. Story: thread 1 goes idle, runs again for other work, and a later
\* "done" note sees the stale bit and wakes a busy thread. BusyNeverWoken
\* breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* Two blocks reads can miss.
  Blocks = {1, 2}
  \* Thread 1 reads blocks 1 and 2; thread 2 reads block 1.
  Want <- WantPool
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* Block 1 can be made twice (once per thread), block 2 once.
  MaxUnits = 3
  \* No commit groups in this setup.
  Groups = {}
  \* So no group has members.
  MembersOf <- MembersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* The planted bug.
  Mutant = "BusyWoken"
\* The invariant this bug must break.
INVARIANT BusyNeverWoken
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT SingleRun
\* Checked as well.
INVARIANT ExactlyOnce
\* Checked as well.
INVARIANT EveryWaiterTold
\* Checked as well.
INVARIANT OwnQueue
\* Checked as well.
INVARIANT NoLostIdleWakeup
\* Checked as well.
INVARIANT NoOrphanUnit
