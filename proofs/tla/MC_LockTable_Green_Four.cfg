\* GREEN. Four transactions and one key, so the line holds three waiters at
\* once: the front is nudged, the ones behind it wait their turn, and a
\* handoff goes to the front only.
\*
\* SHRUNK to finish in under 20 seconds of CPU on one TLC worker: this run
\* checks every invariant and no longer checks that everybody is served
\* (56 s with that check; now 8 s, the same 33 thousand states). The check
\* over whole runs is what cost the time, and four transactions that each
\* ask once is already the smallest run with three waiters in line, so
\* there is no smaller one to move it to. What is no longer shown is that
\* a line of three is always served to its end; a line of two is, in every
\* three-transaction GREEN run, and the rules that make it so (the front
\* is told, a handoff goes to the front, nobody loses more than Bound
\* races) are still checked here with three in line.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (the budget of lock calls is spent) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Four transactions, each on its own thread with its own inbox.
  Txns = {1, 2, 3, 4}
  \* One entry name: a retired entry's name is used again.
  Entries = {1}
  \* Nobody sleeps for the lock: all use try_get_for_update.
  Blocking = {}
  \* Nobody uses commit_nowait: every release follows a visible commit.
  Nowait = {}
  \* Nobody gives a wait up.
  MayCancel = {}
  \* A waiter is owed after one lost race.
  Bound = 1
  \* Four lock calls in the whole run: each transaction asks once.
  Takes = 4
  \* Nobody's wait is watched: this run checks no whole-run property.
  Watched = {}
  \* Nobody calls again before it is told.
  Early = {}
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state: every variable holds the kind of value it should.
INVARIANT TypeOK
\* Must hold in every state: at most one transaction holds the key.
INVARIANT MutualExclusion
\* Must hold in every state: an entry out of the table is used by nobody.
INVARIANT TableSound
\* Must hold in every state: a free lock with a line has told its front waiter.
INVARIANT NoStrandedFront
\* Must hold in every state: a waiter that was nudged or handed the lock was told.
INVARIANT WokenIsTold
\* Must hold in every state: no waiter loses more than Bound races.
INVARIANT BoundedBypass
\* Must hold in every state: a note lands in its own inbox and nowhere else.
INVARIANT OwnQueue
\* Must hold in every state: nobody takes the key under a commit not yet visible.
INVARIANT IsolationAtLanding
\* Must hold in every state: a lock does not outlive the landing of its commit.
INVARIANT HeldOnlyWhileNeeded
