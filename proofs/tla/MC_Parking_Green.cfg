\* GREEN. Two queues and one blocking caller need a job whose second tool a
\* worker holds. A poll that cannot get a tool parks the job: it leaves a
\* note, looks again, gives back the round, frees the job and wakes whoever
\* waited for it. Either queue's owner may stop polling for good. No poll
\* ever waits, a parked job holds nothing, and the job lands, once.
\*
\* The runs checked: every run that starts in Init, takes steps of Next, and in which a thread
\* that can go on does go on (an owner that stops polling excepted).
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: who takes part, and which code (the real one or a planted
\* bug) is checked.
CONSTANTS
  \* Two queues wait for the job.
  Pollers = {q1, q2}
  \* One blocking caller needs it done.
  Blockers = {b1}
  \* The thread at work with a tool when the run starts.
  Worker = w
  \* It holds the second tool.
  WorkerTool = "b"
  \* Either owner may stop polling for good (at most one does).
  CanStop = {q1, q2}
  \* The real code, or the bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK
\* Must hold in every state.
INVARIANT NoPollWaits
\* Must hold in every state.
INVARIANT ParkedHoldsNothing
\* Must hold in every state.
INVARIANT OneClaim
\* Must hold in every state.
INVARIANT RunsOnce
\* Must hold of every run: the job lands.
PROPERTY JobLands
