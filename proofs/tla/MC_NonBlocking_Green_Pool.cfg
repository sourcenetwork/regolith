\* Pool mode: two commit tasks (one with an on_complete callback), two
\* CacheOnly reads of one block, one self-started unit, and two I/O
\* threads that wait on io_pending and call poll_io. Every invariant,
\* EveryTicketCompletes and AllTasksFinish hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  CommitTasks = {1, 2}
  Callbacks = {1}
  ReadTasks = {3, 4}
  Blocks = {1}
  BlockOf <- OneBlock
  IoThreads = {1, 2}
  SelfJobs = 1
  Mode = "pool"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT NoLostWakeup
INVARIANT TicketCompletesWithItsIo
INVARIANT CallbackOnce
INVARIANT SingleFlight
INVARIANT IoPendingFires
INVARIANT NothingStuck
PROPERTY EveryTicketCompletes
PROPERTY AllTasksFinish
