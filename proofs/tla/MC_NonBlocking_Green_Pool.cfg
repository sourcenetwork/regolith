\* GREEN. Two threads miss one shared block, and thread 1 a second block
\* of its own; any thread may go idle or wake, and the database may close
\* at any point. Every invariant holds and everything finishes.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* Two blocks reads can miss.
  Blocks = {1, 2}
  \* Thread 1 reads blocks 1 and 2; thread 2 reads block 1.
  Want <- WantPool
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* Block 1 can be made twice (once per thread), block 2 once.
  MaxUnits = 3
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK
\* Must hold in every state.
INVARIANT SingleRun
\* Must hold in every state.
INVARIANT ExactlyOnce
\* Must hold in every state.
INVARIANT EveryWaiterTold
\* Must hold in every state.
INVARIANT OwnQueue
\* Must hold in every state.
INVARIANT NoLostIdleWakeup
\* Must hold in every state.
INVARIANT BusyNeverWoken
\* Must hold in every state.
INVARIANT NoOrphanUnit
\* Every read and job finishes, in every fair run.
PROPERTY AllDone
