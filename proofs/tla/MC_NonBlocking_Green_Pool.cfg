\* Pool mode: two commit tasks (one with an on_complete callback), two
\* CacheOnly reads of one block, one self-started unit, and two I/O
\* threads that wait on io_pending and call poll_io. Every invariant holds.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: the two
\* liveness properties left this run (86,521 states either way, but 38
\* seconds with them and 11 without). Still here: every safety invariant
\* over both commit tasks, both reads, the self-started unit and both I/O
\* threads, NothingStuck among them: once nothing more can happen, no task
\* is left waiting. EveryTicketCompletes and AllTasksFinish are now
\* MC_NonBlocking_Green_PoolLive's, with one commit task, and
\* MC_NonBlocking_Green_Single's on one thread. This model has no Lean
\* counterpart (NonBlocking.tla says why): TLC is the whole check.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  CommitTasks = {1, 2}
  Callbacks = {1}
  ReadTasks = {3, 4}
  Blocks = {1}
  BlockOf <- OneBlock
  IoThreads = {1, 2}
  SelfJobs = 1
  Mode = "pool"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT NoLostWakeup
INVARIANT TicketCompletesWithItsIo
INVARIANT CallbackOnce
INVARIANT SingleFlight
INVARIANT IoPendingFires
INVARIANT NothingStuck
