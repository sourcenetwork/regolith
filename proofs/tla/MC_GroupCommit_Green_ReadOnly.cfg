\* A transaction that only reads (5, reading key 2, at Immediate) shares
\* groups with writers: it is validated in group order like any member,
\* takes no sequence and no log record, and forces no fsync. Every invariant
\* holds, and every commit gets its answer.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 5}
  Plain = {}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 5}
  MaxGroup = 3
  Faults = TRUE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT SerialEquivalent
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT BoundedTurn
INVARIANT NoStuckTicket
PROPERTY AllTicketsComplete
