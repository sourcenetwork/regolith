\* RED. The bug: the thread that runs round 4 makes every waiting commit's
\* ticket ready itself. Story: thread 2 polls, claims the round and syncs, and
\* readies thread 1's ticket on thread 2, running 1's callbacks there while
\* 1 is busy. DeliveredOnOwnPoll breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block reads in this setup.
  Blocks = {}
  \* So nobody reads.
  Want <- WantNone
  \* No jobs in this setup.
  Jobs = {}
  \* So no job has a thread.
  JobOf <- JobOfNone
  \* The round needs one unit.
  MaxUnits = 1
  \* One sync round.
  Rounds = {4}
  \* It covers a commit of each thread.
  CommittersOf <- CommittersBoth
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* No timed waits in this setup.
  Timers = {}
  \* So no thread asks for one.
  TimerOf <- TimerOfNone
  \* No thread drops its queue.
  Droppers = {}
  \* The planted bug.
  Mutant = "DeliverOnLander"
\* The invariant this bug must break.
INVARIANT DeliveredOnOwnPoll
