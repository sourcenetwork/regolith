\* RED. The bug: the thread that lands group 4 makes every member's ticket
\* ready itself. Story: thread 2 polls, claims and syncs the group, and
\* readies thread 1's ticket on thread 2, running 1's callbacks there while
\* 1 is busy. DeliveredOnOwnPoll breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every commit done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* No block reads in this setup.
  Blocks = {}
  \* So nobody reads.
  Want <- WantNone
  \* No jobs in this setup.
  Jobs = {}
  \* So no job has a thread.
  JobOf <- JobOfNone
  \* The group's fsync needs one unit.
  MaxUnits = 1
  \* One commit group.
  Groups = {4}
  \* Both threads have a member in it.
  MembersOf <- MembersBoth
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* The planted bug.
  Mutant = "DeliverOnLander"
\* The invariant this bug must break.
INVARIANT DeliveredOnOwnPoll
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT SingleRun
\* Checked as well.
INVARIANT ExactlyOnce
\* Checked as well.
INVARIANT VisibleAfterSync
