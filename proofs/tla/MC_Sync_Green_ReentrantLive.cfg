\* Liveness of the ReentrantMutex, Bound 1, one guard per task (re-entry
\* across the two tasks of Owner 1): if no owner keeps the lock forever,
\* every waiter is served. Nesting is MC_Sync_Green_Reentrant's.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: two tasks,
\* one of each owner, where there were three (90,612 states and 47 seconds;
\* now 915 states and under 5). Still here: a waiter of one owner facing a
\* barging task of the other, served once that owner lets go. Gone from the
\* liveness check: the second task of Owner 1, whose re-entry beside a
\* waiting Owner 2 keeps every safety invariant in MC_Sync_Green_Reentrant
\* (three tasks, nesting two guards). Lean (Regolith/Sync.lean) proves the
\* Mutex's bounded bypass and handoff for every number of tasks; there is no
\* Lean theorem for the ReentrantMutex's liveness.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Task 1 is Owner 1 and task 3 is Owner 2: see SHRUNK above.
  Tasks = {1, 3}
  Kind = "Reentrant"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerPair
  MaxDepth = 1
  Owned = FALSE
  Bound = 1
  Watched = {1, 3}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
PROPERTY ReentrantServed
