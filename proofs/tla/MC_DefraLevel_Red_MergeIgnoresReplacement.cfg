\* Green_Counters without the range delete, with a blind merge that conflicts
\* with nothing (Mutant MergeIgnoresReplacement): an increment that began
\* before a reset commits after it, so the reset does not reset.
\* INV_CounterExact fails.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {11}
  Rebasers = {12}
  Resetters = {10}
  Clearers = {}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "MergeIgnoresReplacement"
INVARIANT TypeOK
INVARIANT INV_CounterExact
