\* Liveness of the Semaphore, on a run small enough to check a temporal
\* property in a few seconds: two permits, Bound 1, task 1 asks for both and
\* task 2 for one, owned guards move between the tasks. Every parked waiter
\* is served (EveryWaiterServed), and every safety invariant holds here too.
\*
\* Example of what it rules out: task 1 waits for both permits while task 2
\* takes and returns one permit for ever, so two are never free together and
\* task 1 starves. After one lost race the released permits are reserved
\* for task 1 until it has both.
\*
\* This run is the liveness half of MC_Sync_Green_Semaphore, which keeps
\* three tasks and the safety invariants (982 states here against 136,589
\* there). What two tasks do not show is two small requests behind the large
\* one; the safety run shows the reservation holds against both
\* (BoundedBypass, HandoffExclusive). There is no Lean theorem for a
\* Semaphore of several permits.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every task is idle is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two tasks: the large request and one small one.
  Tasks = {1, 2}
  \* A counting semaphore.
  Kind = "Semaphore"
  \* Two permits.
  Permits = 2
  \* Task 1 asks for both permits, task 2 for one.
  Need <- NeedFirstAll
  \* Every task is its own owner (owners matter to the ReentrantMutex only).
  Owner <- OwnerEach
  \* No nesting: that is the ReentrantMutex's.
  MaxDepth = 1
  \* An owned guard may move to the other task.
  Owned = TRUE
  \* After one lost race a release reserves its permits for the waiter.
  Bound = 1
  \* Liveness is checked for both roles: the large request and the small one.
  Watched = {1, 2}
  \* The design, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* The waiters count is exactly the tasks registered or queued.
INVARIANT WaitersCounted
\* One task at a time holds the drain token.
INVARIANT DrainExclusive
\* Permits are never created or lost.
INVARIANT PermitsConserved
\* No more permits are out than the semaphore has.
INVARIANT MutualExclusion
\* Guards out match the depth (trivial for a Semaphore).
INVARIANT ReentrancyDepth
\* A waiter loses at most Bound races.
INVARIANT BoundedBypass
\* While a handoff is owed, nobody barges.
INVARIANT HandoffExclusive
\* A handoff is followed by a wake, and no waiter sleeps while it could go on.
INVARIANT NoLostWakeup
\* An idle task holds nothing: a dropped waiter passed the lock on.
INVARIANT CancelPassesOn
\* The promise of this run: every parked waiter stops waiting.
PROPERTY EveryWaiterServed
