\* GREEN. A file of one byte in a segment of 2, an append of one byte and
\* a set_len to 3, with one reader. set_len in place links a segment of 2
\* and zeroes bytes 1 and 2 (or 2, after the append); by a copy, it zeroes
\* them in the new extent. Every rule holds.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where everyone finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two writers.
  Writers = {1, 2}
  \* The write each makes.
  Ops <- OpsExtend
  \* One reader.
  Readers = {1}
  \* Bytes of 7 in the file at the start.
  InitLen = 1
  \* The room of its one segment.
  InitCap = 2
  \* The smallest segment a file grows by.
  MinCap = 1
  \* The room from which a replaced extent is submitted.
  Big = 2
  \* The real code: no bug planted.
  Mutant = "none"
