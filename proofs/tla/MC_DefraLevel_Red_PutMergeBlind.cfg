\* Green_Counters with the counter the rebase puts validated as a blind merge
\* (Mutant PutMergeBlind): the rebase commits over an increment it never saw,
\* and its put erases that increment. INV_CounterExact fails.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {11}
  Rebasers = {12}
  Resetters = {10}
  Clearers = {13}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PutMergeBlind"
INVARIANT TypeOK
INVARIANT INV_CounterExact
