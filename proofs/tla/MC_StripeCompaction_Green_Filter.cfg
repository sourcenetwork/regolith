\* The fix with a compaction filter on every stripe: it removes the value 0
\* and lowers the value 3 to 2, so it both removes and changes. The reads of
\* every live snapshot and the head move only by those decisions: after each
\* install they read what the tree read just before, with the filter
\* applied in place to every stripe's terminator.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1}
  MaxSeq = 4
  MaxRuns = 2
  Readers = {r1}
  PutValues = {0, 1}
  Cap = 3
  Operator = "Exact"
  FoldOperandOnly = "IfExact"
  Capture = "AfterInputs"
  Stripes = "PerSnapshot"
  Filter = "Expire"
INVARIANT TypeOK
INVARIANT SnapshotReadsKept
INVARIANT HeadKept
INVARIANT NewestKept
