\* The fix with a compaction filter on every stripe: it removes the value 0
\* and lowers the value 3 to 2, so it both removes and changes. The reads of
\* every live snapshot and the head move only by those decisions: after each
\* install they read what the tree read just before, with the filter
\* applied in place to every stripe's terminator.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: three
\* writes where there were four (183,751 states and 20 seconds; now 20,078
\* states and about 7). Still here: one reader's snapshot between writes,
\* so two stripes, with the filter's two decisions (remove a 0, lower a 3)
\* applied wherever those values arise, across every flush and compaction.
\* Gone: a fourth write.
\* Lean covers every number of versions and snapshots:
\* reduce_reads, window_reads_kept and reduce_keeps_newest in
\* Regolith/Stripes.lean.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1}
  \* Three writes: see SHRUNK above.
  MaxSeq = 3
  MaxRuns = 2
  Readers = {r1}
  PutValues = {0, 1}
  Cap = 3
  Operator = "Exact"
  FoldOperandOnly = "IfExact"
  Capture = "AfterInputs"
  Stripes = "PerSnapshot"
  Filter = "Expire"
INVARIANT TypeOK
INVARIANT SnapshotReadsKept
INVARIANT HeadKept
INVARIANT NewestKept
