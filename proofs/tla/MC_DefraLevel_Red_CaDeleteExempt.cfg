\* Green_ContentAddressed with a content-addressed delete exempt from
\* validation, the rule before E17. The collector sees no pin, a linker puts the
\* block and pins it, and the collection then commits over that put: the pin
\* names a deleted block. INV_NoDanglingReference fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- ContentAddressedWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {6}
  Level = "DefraLevel"
  Mutant = "CaDeleteExempt"
INVARIANT INV_NoDanglingReference
INVARIANT INV_LinksCommit
INVARIANT INV_HoldsCurrent
INVARIANT INV_ReasonsExact
