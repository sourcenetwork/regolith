\* RED. The bug: a piece of progress lands the unit only when the stop
\* cleared. Story: the stop is on; writer 1's relieving step takes the
\* gate; writer 2 finds it held and waits; writer 1's step leaves the stop
\* on, its count lands nothing, and writer 1 gives up (an owed step returns
\* the same way). NoStrandedWait breaks.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* Two pieces of progress may leave the stop on.
  MaxSteps = 2
  \* The planted bug.
  Mode = "NoHandBack"
  \* The engine never latches and no rotation flushes at the memtable
  \* cap: the run is the one this row had before those were modelled.
  Failures = FALSE
  \* The relief never fails: the run is the one this row had before a
  \* failing relief was modelled.
  ReliefFails = FALSE
\* The invariant this bug must break.
INVARIANT NoStrandedWait
\* Checked as well.
INVARIANT TypeOK
