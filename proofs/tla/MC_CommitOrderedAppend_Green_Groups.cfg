\* The design with groups of two, in either order: the two writers sharing
\* once key o1 may meet in one group, as may the writer appending twice and
\* the writer appending o2 twice, and a group may hold a commit that
\* appends nothing. Each member reads the head and the once keys from the
\* view plus the earlier members. Every invariant holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1"}
  SharedOnce = {"s1", "s2"}
  Doubles = {"d1"}
  RepeatOnce = {"r1"}
  Silent = {"n1"}
  MayAbort = {}
  GroupSize = 2
  Depth = 1
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_AtMostOnce
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
