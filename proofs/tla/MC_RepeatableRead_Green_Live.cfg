\* Liveness at RepeatableRead, on a run small enough to check a temporal
\* property in a few seconds: one appender, the pruner, the writer and the
\* patcher. The append lands in the end (EventuallyAllAppendsCommit), and
\* every safety invariant of MC_RepeatableRead_Green holds here too.
\*
\* Example of what it rules out: the pruner keeps deleting superseded head
\* keys the appender's scan yielded, the appender is refused each time and
\* retries for ever. At RepeatableRead the scan is recorded per stretch, the
\* head set it derived did not change, and the append commits.
\*
\* This run is the liveness half of MC_RepeatableRead_Green, which keeps two
\* appenders and the safety invariants (466 states here against 17,469
\* there). What one appender does not show is two appends racing each
\* other; the safety run shows neither is refused (INV_AppendsCommit), which
\* is the fact the liveness rests on. No Lean theorem states this liveness
\* claim; all_classes_serial (Regolith/Validation.lean) covers the safety.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every transaction has finished is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* One appender: see above.
  Appenders = {1}
  \* The block already established as the head.
  Seed = 0
  \* The transaction that prunes superseded heads.
  Pruner = 3
  \* The transaction that writes a document under the definition it read.
  Writer = 4
  \* The transaction that replaces the definition.
  Patcher = 5
  \* No merge of remote blocks in this run.
  Mergers = {}
  \* The remote block, unused without mergers.
  Remote = 9
  \* No remote parents, for the same reason.
  RemoteParents = {}
  \* None of the counter workload's transactions.
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  \* No migration.
  Migrators = {}
  \* None of the later workloads.
  Extras <- NoExtras
  \* No key class is declared: every key is ordinary.
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  \* The isolation level under test.
  Level = "RepeatableRead"
  \* The engine's rule, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* No appender is refused.
INVARIANT INV_AppendsCommit
\* No document commits against a replaced definition.
INVARIANT INV_NoStaleDefinition
\* The derived head set is the DAG's tips.
INVARIANT INV_HeadsExact
\* Every abort names a key and a newer write that decides it.
INVARIANT INV_ReasonsExact
\* The promise of this run: in the end the append has committed, and stays so.
PROPERTY EventuallyAllAppendsCommit
