\* An operator without an exact partial_merge (a rounding sum, as with
\* floating point). The fix leaves its operand-only stripes unfolded and
\* folds operands only onto a base in the same stripe, by full_merge one
\* operand at a time, which is what a read does. Every read is kept.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1}
  MaxSeq = 4
  MaxRuns = 2
  Readers = {r1}
  PutValues = {1}
  Cap = 3
  Operator = "Inexact"
  FoldOperandOnly = "IfExact"
  Capture = "AfterInputs"
  Stripes = "PerSnapshot"
  Filter = "None"
INVARIANT TypeOK
INVARIANT SnapshotReadsKept
INVARIANT HeadKept
INVARIANT NewestKept
