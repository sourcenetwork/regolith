\* dropping their futures. Every promise holds, and while the app keeps
\* calling persist the mirror and OPFS end up the same.
\*
\* What this small run still covers: every race between two batches and
\* between a batch and a later call; a MANIFEST older than the mirror's in
\* flight while another call waits; a removal of a name that never reached
\* OPFS (NotFoundError); a write or a removal that fails and is made again.
\*
