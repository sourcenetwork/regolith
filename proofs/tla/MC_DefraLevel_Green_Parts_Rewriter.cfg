\* DefraLevel projected reads [3.4], the rewriter's half of the parts
\* workload. A part reader reads part 1 of the part key with get_parts and
\* decides on it; a rewriter reads part 1 and puts the whole key back with
\* part 1 bumped; one part writer makes one blind write: an identical put, a
\* put that changes part 2, a delete, or an operand touching part 1 or part
\* 2. No projected reader commits on changed inputs (INV_PartsCurrent), and
\* a reader that found the key is never refused when every newer write is an
\* operand touching only part 2 (INV_PartsRelaxed).
\*
\* Example of what it rules out: the rewriter reads the key, a writer's
\* operand then changes part 2, and the rewriter commits the whole value it
\* read, putting the old part 2 back. Its put decides on every part, so
\* that commit is refused.
\*
\* This run and MC_DefraLevel_Green_Parts are the two halves of one that
\* took 24,801 states and 23 seconds (479 states here). Lean covers every
\* size: parts_serial and parts_current in Regolith/Validation.lean.
\* The behaviours to check: Init, then any steps of Next.
SPECIFICATION Spec
\* Only the later workloads move: the first ones stay idle.
CONSTRAINT NewWorkloadOnly
\* A run where every transaction has finished is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* The first workloads' transactions, named and left idle.
  Appenders = {1}
  \* Block 0 is the head that exists before anything runs.
  Seed = 0
  \* Transaction 4 is the pruner, which sweeps superseded head keys.
  Pruner = 4
  \* Transaction 5 is the writer, which reads the definition and writes a document from it.
  Writer = 5
  \* Transaction 6 is the patcher, which replaces the definition.
  Patcher = 6
  \* No transaction applies a remote block.
  Mergers = {}
  \* The remote block's id is 9.
  Remote = 9
  \* The remote block names no parent (unused when no merger runs).
  RemoteParents = {}
  \* None of the counter workload's transactions.
  Incrementers = {}
  \* No transaction reads the counter and then merges into it.
  ReadMergers = {}
  \* No transaction puts the counter and merges on top.
  Rebasers = {}
  \* No transaction deletes the counter.
  Resetters = {}
  \* No plain range delete runs over the counter's range.
  Clearers = {}
  \* No migration.
  Migrators = {}
  \* The reader, the rewriter and one writer.
  Extras <- PartsRewriterWorkload
  \* No key class is declared for a range.
  CommutativeRanges = {}
  \* The caller declares no key range content-addressed.
  ContentAddressedRanges = {}
  \* The isolation level under test.
  Level = "DefraLevel"
  \* The engine's rule, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* No projected reader commits on changed inputs.
INVARIANT INV_PartsCurrent
\* A reader that found the key is not refused over an operand on another part.
INVARIANT INV_PartsRelaxed
\* Every abort names a key and a newer write that decides it.
INVARIANT INV_ReasonsExact
