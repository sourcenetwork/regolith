\* Two transact calls of up to two attempts each, two committers that help
\* each other complete outcomes, and close at any moment, at Immediate.
\* Every attempt runs exactly one outcome, in order, with its own callbacks
\* only; before_commit writes are validated; on_commit waits for the fsync;
\* a panic aborts; and everything settles.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owners = {1, 2}
  Committers = {1, 2}
  MaxAttempts = 2
  Durability = "Immediate"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT AtMostOnce
INVARIANT ExactlyOnce
INVARIANT OneCommitPerTransact
INVARIANT CallbacksBeforeHooks
INVARIANT NoLostUpdate
INVARIANT AttemptIsolation
INVARIANT CommitAfterDurable
INVARIANT PanicAborts
PROPERTY Settles
