\* RED. The bug: a transaction member is not checked against the registry
\* (only its validation runs). Story: the family is created (sequence 1);
\* writer 1's transaction checks "live" and queues; the drop commits its
\* tombstone at 2 and retires the family; a drain runs writer 1's group and
\* the transaction lands at 3, over the tombstone. NoWriteAfterDrop breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
