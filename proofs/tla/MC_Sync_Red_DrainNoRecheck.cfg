\* The drainer lets the token go without looking again. A release that
\* found the token taken left its permit for the drainer, which had already
\* decided there was nothing to do; the waiter sleeps beside a free lock.
\* NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "DrainNoRecheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT FifoHandoff
INVARIANT CancelPassesOn
