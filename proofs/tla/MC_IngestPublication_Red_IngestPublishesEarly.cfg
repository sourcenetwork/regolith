\* The ingest's sequence is published before its table is installed. A
\* snapshot at that sequence reads the ingested keys as absent, then as
\* present once the table lands. RepeatableSnapshot fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Commits = {"c1", "c2", "c3"}
  CommitKey = 1
  IngestKeys = {1, 2}
  Readers = {"r1", "r2"}
  Mutant = "IngestPublishesEarly"
INVARIANT RepeatableSnapshot
