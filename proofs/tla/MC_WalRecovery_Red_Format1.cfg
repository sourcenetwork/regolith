\* Format 1's replay (E3): a whole record with a bad checksum is refused
\* unless every byte after it is zero. A crash where the length persisted
\* before the data leaves exactly that, and the database never opens.
\* RecoveryOpens fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 5
  MaxFiles = 3
  MaxCrashes = 2
  Mode = "Eventual"
  Frame = "Checksum"
  Residual = FALSE
  Mutant = "Format1"
INVARIANT RecoveryOpens
INVARIANT TypeOK
INVARIANT NoGap
INVARIANT KeepsSynced
INVARIANT LossIsReported
