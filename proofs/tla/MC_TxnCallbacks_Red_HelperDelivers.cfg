\* RED. The bug: the design before D53, where a committer that decided or
\* synced a commit also delivered it, running its callbacks on the
\* committer's own thread. Story: committer 1 decides owner 1's commit,
\* claims it and runs its on_commit, while owner 1's thread never sees it.
\* OnCommittingThread breaks.

