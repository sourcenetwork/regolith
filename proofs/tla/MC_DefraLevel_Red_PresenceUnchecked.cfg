\* Green_ContentAddressed with a read of a content-addressed key that found it
\* left unvalidated, the rule before E17. The holder reads the block present,
\* the collector deletes it, and the holder still commits a reference to it.
\* INV_HoldsCurrent fails (and the reference dangles).
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- ContentAddressedWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {6}
  Level = "DefraLevel"
  Mutant = "PresenceUnchecked"
INVARIANT INV_HoldsCurrent
INVARIANT INV_LinksCommit
INVARIANT INV_ReasonsExact
