\* GREEN. Two calls of one transaction ask for a key another transaction
\* holds, at the same time; each caller may give its attempt up while it
\* waits. The two calls share one wait, and when the key is freed some call
\* is always running or told. Three wait names: two calls can each make one
\* before either publishes, and the third is never needed.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (the transaction holds the key, or its callers left) is
\* not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two calls of the waiting transaction, on two threads.
  Calls = {1, 2}
  \* Three names for the waits they may make.
  Waits = {1, 2, 3}
  \* Either caller may give up while it waits.
  MayDrop = {1, 2}
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state: every variable holds the kind of value it should.
INVARIANT TypeOK
\* Must hold in every state: the transaction has at most one wait in the line.
INVARIANT OneQueuedWait
\* Must hold in every state: a free key the transaction waits for has a call running or told.
INVARIANT NobodyStranded
