\* E50, write-free transactions at ReadCommitted [3.8]. A commit that writes nothing takes no part
\* in the commit pipeline and takes no sequence. At this level it checks nothing at all, not even a
\* get_for_update: the read-only transaction and the for-update reader commit whatever the skew
\* writer did, each having read one snapshot. The pessimistic promoter reads B later than its
\* snapshot by design and is held to no single point in time. A failure may latch the database at
\* any moment: the skew writer is then refused, and every write-free transaction still commits.
\* The skew writer's commit is decided first and published later, so every write-free
\* transaction may commit in between: its check counts the decided write as well as the published
\* state.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, never stalling for ever
\* while a step is possible.
SPECIFICATION Spec
\* Spend the states on the later workload: no transaction of the first workloads ever begins.
CONSTRAINT NewWorkloadOnly
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Transaction 1 appends one block (the id is also the block's id).
  Appenders = {1}
  \* Block 0 is the head that exists before anything runs.
  Seed = 0
  \* Transaction 4 is the pruner, which sweeps superseded head keys.
  Pruner = 4
  \* Transaction 5 is the writer, which reads the definition and writes a document from it.
  Writer = 5
  \* Transaction 6 is the patcher, which replaces the definition.
  Patcher = 6
  \* No transaction applies a remote block.
  Mergers = {}
  \* The remote block's id is 9.
  Remote = 9
  \* The remote block names no parent (unused when no merger runs).
  RemoteParents = {}
  \* No transaction blind-merges an increment into the counter.
  Incrementers = {}
  \* No transaction reads the counter and then merges into it.
  ReadMergers = {}
  \* No transaction puts the counter and merges on top.
  Rebasers = {}
  \* No transaction deletes the counter.
  Resetters = {}
  \* No plain range delete runs over the counter's range.
  Clearers = {}
  \* No transaction migrates the definition.
  Migrators = {}
  \* The write-free workload runs: read-only 50, promoter 51, skew writer 52 (an identical rewrite
  \* or one more, decided before it is published), for-update reader 53, and failure 57, which
  \* latches the database read-only at any moment.
  Extras <- WriteFreeWorkload
  \* The caller declares no key range commutative: every scan stretch is recorded as at
  \* RepeatableRead.
  CommutativeRanges = {}
  \* The caller declares no key range content-addressed.
  ContentAddressedRanges = {}
  \* Every transaction runs at ReadCommitted: a commit checks only the keys it writes.
  Level = "ReadCommitted"
  \* No planted bug: the commit rule as the engine has it.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: a write-free transaction whose level promises to check none of its
\* reads is never refused.
INVARIANT INV_WriteFreeCommits
\* Checked in every state: every committed write-free transaction read the state of one single point
\* in time, where its level promises that.
INVARIANT INV_WriteFreeConsistent
\* Checked in every state: every read a write-free commit's level promises to check held, when the
\* commit was made, the value it read, with every decided commit counted and at the published point.
INVARIANT INV_WriteFreeAtHorizon
\* Checked in every state: a read checked by value was never refused for a rewrite of the bytes it
\* read, published or only decided.
INVARIANT INV_WriteFreeIdenticalCommits
\* Checked in every state: the sequence counts the commits that wrote, and nothing else.
INVARIANT INV_WriteFreeTakesNoSequence
\* Checked in every state: a committed write-free transaction's receipt is its snapshot.
INVARIANT INV_WriteFreeReceipt
\* Checked in every state: a latched database refused only commits that write.
INVARIANT INV_LatchRefusesOnlyWrites
\* Checked in every state: every abort's reason names a key the transaction really used that way and
\* a newer write that could decide the race.
INVARIANT INV_ReasonsExact
