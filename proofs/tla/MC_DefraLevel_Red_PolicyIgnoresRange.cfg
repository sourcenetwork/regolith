\* Green_Migrations with a policy that drops a stretch when either end lies in
\* a commutative prefix (Mutant PolicyIgnoresRange): the migration's stretch is
\* dropped, its definition write turns blind, and the identical definition the
\* patcher committed after its scan lets that write elide.
\* INV_NoStaleDefinition fails.
SPECIFICATION Spec
CONSTRAINT DefinitionWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {7, 8}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "PolicyIgnoresRange"
INVARIANT TypeOK
INVARIANT INV_NoStaleDefinition
