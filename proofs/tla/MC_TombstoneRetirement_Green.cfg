\* The fix: a pass retires a tombstone only when no deeper run meets its
\* range and no live snapshot is below it. Puts and range deletes over two
\* keys, flushes, passes over any two adjacent runs, and two readers taking
\* and releasing snapshots at any moment: every live snapshot and the head
\* read every key as before.
\*
\* SHRUNK to finish well inside a minute on one TLC worker: three writes
\* where there were four (948,751 states, 34 seconds; now about 62
\* thousand). Three writes still hold a put, the range delete over it and a
\* later put, in runs a pass can meet in any order, which is all either RED
\* needs: both still break SnapshotReadsKept with three writes. A fourth
\* write beside them is left to the Lean proof (retire_keeps_reads), which
\* covers every number of writes, runs and snapshots.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  \* Three writes: see SHRUNK above.
  MaxSeq = 3
  MaxRuns = 3
  Readers = {r1, r2}
  Retire = "Fix"
INVARIANT TypeOK
INVARIANT SnapshotReadsKept
INVARIANT HeadKept
