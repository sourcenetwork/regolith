\* Notify: task 3 calls notify_one and notify_waiters (twice); tasks 1 and 2
\* wait on notified(), cancelling at will. No waiter misses a stored permit
\* or a broadcast it registered before, a notification handed to a dropped
\* waiter is passed on, and a notified waiter completes.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, in which a started
\* operation finishes and a woken task is polled.
SPECIFICATION Spec
