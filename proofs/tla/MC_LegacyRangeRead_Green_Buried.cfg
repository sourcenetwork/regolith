\* The engine as built (E37). A 0.1.x database holds a key put at sequence 1
\* in level 1 (or in its log) and, in the bottom level, the ingested table's
\* range delete over it at sequence 2; nothing overlaps, so nothing is
\* moved. The open's check finds the range delete (a layer read before it
\* holds the key), copies it into the memtable it recovers, writes that
\* memtable to the log, and only then records the check in the manifest.
\* Through every power cut, put, flush, compaction and bottom pass that
\* retires range deletes, a read and a scan at the newest sequence return
\* what the writes say.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the size, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* At most 4 sequences: the put, the range delete, and two puts after the open.
  MaxSeq = 4
  \* The range delete at the bottom, below the key, nothing moved (E37).
  Layout = "Buried"
  \* The open copies the range delete into the memtable (the engine).
  Hoist = TRUE
  \* A read gathers no range delete ahead of its walk (the engine).
  PreScan = FALSE
  \* The log is written before the manifest records the check (the engine).
  RecordFirst = FALSE
  \* A pass writing the bottom level retires range deletes (the engine since E27).
  Retire = TRUE
