\* New plain readers enter while an upgrade waits, so the readers it waits
\* for may never drain. UpgradeHoldsBack fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Bound = 1
  Watched = {1}
  Asks <- AsksAll
  Mutant = "UpgradeNoHoldBack"
INVARIANT UpgradeHoldsBack
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT NoUpgradeDeadlock
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
