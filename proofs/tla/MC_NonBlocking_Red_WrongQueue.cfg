\* RED. The bug: a read's "read" note goes to the OTHER thread's queue.
\* Story: thread 1 misses block 2, the note lands in thread 2's inbox, and
\* thread 2's poll would finish thread 1's read. OwnQueue breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* Two blocks reads can miss.
  Blocks = {1, 2}
  \* Thread 1 reads blocks 1 and 2; thread 2 reads block 1.
  Want <- WantPool
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* Block 1 can be made twice (once per thread), block 2 once.
  MaxUnits = 3
  \* The planted bug.
  Mutant = "WrongQueue"
\* The invariant this bug must break.
INVARIANT OwnQueue
