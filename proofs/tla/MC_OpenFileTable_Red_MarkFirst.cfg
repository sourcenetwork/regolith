  \* The reading threads.
  Threads = {1, 2}
  \* The tables they read.
  Files = {1, 2}
  \* How many slots: max_open_files.
  Cap = 1
  \* Which table each thread reads.
  Want <- WantTwo
  \* How many times each thread reads it.
  Reads = 2
  \* At most this many file openings in one run: one per read.
  MaxDesc = 4
  \* Thread 2's reads are queue units.
  NoWait = {2}
  \* The planted bug.
  Mutant = "MarkFirst"
