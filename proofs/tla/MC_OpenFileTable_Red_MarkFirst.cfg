\* RED. The bug: a park marks the busy slots WANTED before it puts its
\* queue on the parked list.
\* Story: thread 1 reads in the only slot; thread 2's unit marks it WANTED.
\* Thread 1 leaves, sees the mark, clears it and wakes the list: the list is
\* empty, so it tells nobody. Only now does thread 2 join the list and
\* park. No slot is marked, nobody is waking, and no message waits: the
\* unit is never run again. RetryNeverLost breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
