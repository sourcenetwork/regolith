\* Validation checks the write set captured before before_commit ran. Two
\* transactions' callbacks read the counter at the same snapshot and both
\* write it plus one; neither write is validated, both commit, and one
\* increment is lost. NoLostUpdate fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owners = {1, 2}
  Committers = {1, 2}
  MaxAttempts = 2
  Durability = "Immediate"
  Mutant = "SkipCallbackWrites"
INVARIANT NoLostUpdate
INVARIANT TypeOK
INVARIANT AtMostOnce
INVARIANT ExactlyOnce
INVARIANT CallbacksBeforeHooks
INVARIANT AttemptIsolation
INVARIANT CommitAfterDurable
INVARIANT PanicAborts
