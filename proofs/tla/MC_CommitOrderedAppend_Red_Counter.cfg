\* #1911's Counter: the head key is read and bumped inside the transaction
\* as an ordinary validated write. Three writers that append once each and
\* touch nothing else in common: one commits, and another, which read the
\* old head in its snapshot, aborts on it. INV_NoDisjointConflict fails.
\* Every other invariant is checked first and holds up to that state (no
\* once key here, so INV_AtMostOnce is not listed).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Counter"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_NoDisjointConflict
