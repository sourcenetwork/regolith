\* RED. Not a bug: the tight bound checked where it does not hold. The writer
\* has a queue, and its owed steps wait there until it polls. Story: writes
\* 1-2 seal memtable A and leave a job; writes 3-4 seal B, and the rotation
\* flushes A first (L0 = 1); writes 5-6 flush B and seal C (L0 = 2, the
\* trigger). The writer polls at last, and the job's one step flushes C, the
\* oldest sealed memtable, before any pass could compact: L0 = 3, over its
\* trigger of 2. L0Bounded breaks. So the compaction trigger bounds L0 only
\* when every owed step runs before the next write.
