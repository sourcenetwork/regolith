\* RED. The bug: at Immediate, a commit's outcome is told before the WAL is
\* synced through it. The blocking commit returns without waiting for the
\* fsync, and a pending ticket is delivered before its group has landed.
\* Story: a commit is decided at sequence 1 while nothing is durable; its
\* on_commit runs; a crash now would lose a commit the caller was told about.
\* CommitAfterDurable breaks. (ResolvedAfterLanding breaks one step earlier on
\* the commit_nowait path and is left out of this row.)
\*
\* The runs checked: every run that starts in Init and takes steps of Next, in which every owner,
\* every pipeline thread and a close that has begun keep making progress.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
