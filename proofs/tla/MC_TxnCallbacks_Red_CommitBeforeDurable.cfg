\* RED. The bug: at Immediate, the committing thread's poll delivers a
\* decided commit and runs its on_commit before the WAL is synced through
\* it (its group not landed yet). Story: owner 1's commit is decided at
\* sequence 1 while nothing is durable; the poll delivers it and on_commit
\* runs; a crash now would lose a commit the caller was told about.
\* CommitAfterDurable breaks.

\* The runs checked: every run that starts in Init and takes steps of Next, in which every owner,
\* every pipeline thread and a close that has begun keep making progress.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two transact calls.
  Owners = {1, 2}
  \* Two committers that decide and sync.
  Committers = {1, 2}
  \* Up to two attempts each.
  MaxAttempts = 2
  \* Commits wait for the fsync.
  Durability = "Immediate"
  \* The planted bug.
  Mutant = "CommitBeforeDurable"
\* The promise the planted bug must break: at Immediate, on_commit runs only once the log sync
\* covers the commit.
INVARIANT CommitAfterDurable
