\* At Immediate, a committer claims a decided commit and runs on_commit
\* before the WAL is synced through it. CommitAfterDurable fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owners = {1, 2}
  Committers = {1, 2}
  MaxAttempts = 2
  Durability = "Immediate"
  Mutant = "CommitBeforeDurable"
INVARIANT CommitAfterDurable
INVARIANT TypeOK
INVARIANT AtMostOnce
INVARIANT ExactlyOnce
INVARIANT CallbacksBeforeHooks
INVARIANT NoLostUpdate
INVARIANT AttemptIsolation
INVARIANT PanicAborts
