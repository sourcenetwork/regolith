\* A waiter parks right after pushing its node. notify_one stored its
\* permit between the waiter's failed check and its push, found no node,
\* and left the permit stored: the waiter sleeps beside it. NoLostWakeup
\* fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Notifiers = {3}
  Watched = {1}
  MaxBcast = 0
  Mutant = "NoRecheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT FifoHandoff
INVARIANT CancelPassesOn
