\* RED. The bug: a transaction joins the line and does not look at the lock
\* once more. Story: transaction 2 finds the lock held and is about to join
\* the line. Transaction 1 releases; the line is empty, so nobody is told.
\* Transaction 2 joins. The lock is free, 2 waits, and nobody will ever tell
\* it.

\* The behaviours of the model.
SPECIFICATION Spec
