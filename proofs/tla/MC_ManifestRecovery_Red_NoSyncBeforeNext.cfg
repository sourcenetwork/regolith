\* The writer appends while a batch still waits for its sync. A crash can
\* then mangle that batch and keep a later batch of the synced kind with
\* bytes after it, which reads as a proof: the open refuses a state a crash
\* produced. RecoveryOpens fails.
\* The run: two keys, at most three writes, at most seven batches.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  Mutant = "NoSyncBeforeNext"
INVARIANT RecoveryOpens
INVARIANT TypeOK
INVARIANT ReadsNewest
