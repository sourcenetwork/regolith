\* RED. The bug: a poll that leaves the wait pending ignores a wake that came
\* while it ran. Story: call 1 polls the queued wait and finds nothing yet.
\* The holder lets go: wait 1 is told "try now" and call 1's note is told.
\* Call 2 records its note only now, finds call 1 polling, and returns to
\* wait. Call 1 ends its poll without telling anyone, returns, and its caller
\* gives up. The key is free, call 2 waits, and nobody will tell it.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two calls of the waiting transaction, on two threads.
  Calls = {1, 2}
  \* Three names for the waits they may make.
  Waits = {1, 2, 3}
  \* Either caller may give up while it waits.
  MayDrop = {1, 2}
  \* The planted bug.
  Mutant = "NoHandBack"
\* The invariant this bug must break.
INVARIANT NobodyStranded
\* Checked as well: every variable holds the kind of value it should.
INVARIANT TypeOK
\* Checked as well: the transaction has at most one wait in the line.
INVARIANT OneQueuedWait
