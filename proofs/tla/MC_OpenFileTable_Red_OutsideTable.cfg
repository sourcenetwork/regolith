\* RED. The bug: a thread that finds every slot busy opens its table
\* outside the table instead of waiting for a slot.
\* Story: thread 1 is reading through the only slot; thread 2 finds no slot
\* to claim and opens table 2 anyway: two files open, the limit is one.
\* AtMostCap breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* The reading threads.
  Threads = {1, 2}
  \* The tables they read.
  Files = {1, 2}
  \* How many slots: max_open_files.
  Cap = 1
  \* Which table each thread reads.
  Want <- WantTwo
  \* How many times each thread reads it.
  Reads = 2
  \* At most this many file openings in one run.
  MaxDesc = 4
  \* No thread is a queue unit: every read is Blocking.
  NoWait = {}
  \* The planted bug.
  Mutant = "OutsideTable"
\* The invariant this bug must break.
INVARIANT AtMostCap
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT NeverClosedInUse
\* Checked as well.
INVARIANT ReadsOwnFile
