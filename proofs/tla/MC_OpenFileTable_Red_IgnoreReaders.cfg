\* RED. The bug: a claim takes an open slot whatever its readers.
\* Story: thread 1 joins table 1's slot and is about to read; thread 2
\* claims that slot and closes table 1's file. Thread 1 now reads through a
\* closed file. NeverClosedInUse breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* The reading threads.
  Threads = {1, 2}
  \* The tables they read.
  Files = {1, 2}
  \* How many slots: max_open_files.
  Cap = 1
  \* Which table each thread reads.
  Want <- WantTwo
  \* How many times each thread reads it.
  Reads = 2
  \* At most this many file openings in one run.
  MaxDesc = 4
  \* The planted bug.
  Mutant = "IgnoreReaders"
\* The invariant this bug must break.
INVARIANT NeverClosedInUse
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT AtMostCap
\* Checked as well.
INVARIANT ReadsOwnFile
