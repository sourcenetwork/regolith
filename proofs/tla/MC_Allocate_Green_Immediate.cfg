\* The design under Immediate durability: four callers reserve two values
\* each in the ordered step, without a sync; c2 may abort after allocating
\* (a gap); each commit syncs, carrying the earlier allocation records with
\* it; two power cuts each keep any prefix holding every durable record. No
\* conflict, no value handed out or used twice, ranges only grow, and every
\* durable use has its durable allocation.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Four callers of allocate: c1, c2, c3 and c4.
  Clients = {"c1", "c2", "c3", "c4"}
  \* Each caller reserves 2 values in its one call.
  N = 2
  \* The transaction of c2 may give up after allocating, leaving its values unused (a gap).
  MayAbort = {"c2"}
  \* Every commit syncs the log before it returns (DurabilityMode::Immediate).
  Durability = "Immediate"
  \* Two power cuts may happen, at any moments.
  MaxCrashes = 2
  \* No planted bug: allocation as the engine has it, in the ordered step, logged before it returns.
  Mutant = "none"
