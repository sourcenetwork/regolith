\* The design under Immediate durability: four callers reserve two values
\* each in the ordered step, without a sync; c2 may abort after allocating
\* (a gap); each commit syncs, carrying the earlier allocation records with
\* it; two power cuts each keep any prefix holding every durable record. No
\* conflict, no value handed out or used twice, ranges only grow, and every
\* durable use has its durable allocation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Clients = {"c1", "c2", "c3", "c4"}
  N = 2
  MayAbort = {"c2"}
  Durability = "Immediate"
  MaxCrashes = 2
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NeverConflicts
INVARIANT INV_Unique
INVARIANT INV_Monotonic
INVARIANT INV_UseDurable
INVARIANT INV_UsesUnique
