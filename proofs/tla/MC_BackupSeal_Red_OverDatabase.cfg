\* The bug planted: restore runs over a target that already holds a
\* MANIFEST.
\* How it breaks the promise: backup 1 holds a table under key 1 and is
\* restored. The table is resealed under key 2 and backup 2 taken.
\* Restoring backup 2 over the finished target copies its table over
\* backup 1's, and the power goes before the new MANIFEST: the old one
\* names a table the target no longer holds as it recorded.
\* FaithfulRestore fails.
\*
\* SHRUNK to finish inside a minute on one TLC worker: one table slot where
\* there were two (1.86 million states; now about 160 thousand). The defect
\* needs one table, two backups and two restores, exactly as told above,
\* and it still breaks FaithfulRestore. It needs no attacker either, so the
\* run leaves the attacker out (26,425 states where there were 231,442).
SPECIFICATION Spec
\* The attacker is not part of the story above.
CONSTRAINT NoAttack
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two backups, as in the GREEN run.
  MaxBackups = 2
  \* Two restores, as in the GREEN run.
  MaxRestores = 2
  \* One table slot: see SHRUNK above.
  Slots = 1
  \* The defect above.
  Mutant = "OverDatabase"
\* The promise this bug breaks.
INVARIANT FaithfulRestore
\* Every variable keeps its type.
INVARIANT TypeOK
