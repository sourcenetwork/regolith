\* RED. The bug: a call records how it is to be told only after it polled.
\* Story: transaction 2 joins the line and returns. Before it records its
\* note, transaction 1 releases and nudges it: there is no note to deliver.
\* Transaction 2 then records its note and waits, marked "try again" but
\* never told.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (the budget of lock calls is spent) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Three transactions, each on its own thread with its own inbox.
  Txns = {1, 2, 3}
  \* One entry name: a retired entry's name is used again.
  Entries = {1}
  \* Nobody sleeps for the lock: all use try_get_for_update.
  Blocking = {}
  \* Nobody uses commit_nowait: every release follows a visible commit.
  Nowait = {}
  \* Nobody gives a wait up.
  MayCancel = {}
  \* A waiter is owed after one lost race.
  Bound = 1
  \* Three lock calls in the whole run.
  Takes = 3
  \* Every transaction's wait is watched.
  Watched = {1, 2, 3}
  \* The planted bug.
  Mutant = "NoteAfterPoll"
\* The invariant this bug must break.
INVARIANT WokenIsTold
\* Checked as well: every variable holds the kind of value it should.
INVARIANT TypeOK
\* Checked as well: at most one transaction holds the key.
INVARIANT MutualExclusion
\* Checked as well: an entry out of the table is used by nobody.
INVARIANT TableSound
\* Checked as well: a free lock with a line has told its front waiter.
INVARIANT NoStrandedFront
\* Checked as well: no waiter loses more than Bound races.
INVARIANT BoundedBypass
\* Checked as well: a note lands in its own inbox and nowhere else.
INVARIANT OwnQueue
\* Checked as well: nobody takes the key under a commit not yet visible.
INVARIANT IsolationAtLanding
\* Checked as well: a lock does not outlive the landing of its commit.
INVARIANT HeldOnlyWhileNeeded
