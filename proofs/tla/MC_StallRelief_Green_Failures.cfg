\* GREEN, with what can fail (E35). Two writers and one job, as in
\* MC_StallRelief_Green, and on top: the engine may latch at any moment
\* (its flag stored first, its landing second), and a write let in may have
\* to rotate at the memtable cap, flushing under the gate, with a seal that
\* goes through or fails. The latch lands the unit, a writer reads the
\* latch's flag again once registered, and a rotation counts its progress
\* on every way out. NoStrandedWait and NoWaitOnceLatched hold.
\*
\* SIZED to finish in a few seconds of CPU on one TLC worker: two writers,
\* and two pieces of progress that may leave the stop on where the row
\* without failures has three. Two writers still hold every case the two
\* new rules are for: a writer waiting when the engine latches, a writer
\* that registers between the latch's flag and its landing or after both,
\* and a writer contended by a rotation whose seal fails. More writers are
\* left to the Lean proof (no_stranded_wait, no_wait_once_latched), which
\* covers every number of them.
