\* DefraLevel write-free transactions [3.8]. An optimistic read-only
\* transaction reads both skew keys at its snapshot and validates nothing, so it
\* never conflicts. A pessimistic promoter reads key A at its snapshot and key B
\* with get_for_update after a writer changed both; it validates as at
\* RepeatableRead, so it aborts. Every committed write-free transaction read one
\* point in time.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- WriteFreeWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_WriteFreeCommits
INVARIANT INV_WriteFreeConsistent
INVARIANT INV_ReasonsExact
