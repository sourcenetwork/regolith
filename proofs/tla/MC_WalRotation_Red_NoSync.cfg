\* The defect: a rotation opens the next file without syncing the sealed
\* one. A power cut tears a record in the sealed file and recovery refuses,
\* or cuts it at a record boundary and the newer file's commits arrive
\* without the earlier ones. RecoversPrefix fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxRecords = 6
  MaxFiles = 4
  Rotation = "NoSync"
INVARIANT RecoversPrefix
