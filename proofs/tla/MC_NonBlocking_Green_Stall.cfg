\* GREEN. Stall 5 stops the writes of threads 1 and 2. Each stopped write
\* returns, installs or finds the stall's passive unit, registers on its own
\* queue and looks at the stall again; background work clears the stall at
\* any point, and the database may close. Every invariant holds and every
\* write lands in the end.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (every write done) is not an error.
