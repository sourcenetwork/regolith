\* min_wal_id goes in a batch of its own, ahead of the table's, needing no
\* sync. A crash keeps it and tears the table's batch: recovery skips the
\* log while no table holds its writes. AckedSurvive fails.
\* The run: two keys, at most three writes, at most seven batches.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  MaxFrozen = 1
  Sealed = FALSE
  Mutant = "RetireBeforeTable"
INVARIANT AckedSurvive
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT ReadsNewest
INVARIANT RotSafe
