\* A fresh read enters whenever no writer holds, even while one waits. Two
\* readers take turns holding the lock and the waiting writer is passed
\* again and again. WritersBoundedBypass fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Watched = {1}
  Mutant = "ReaderBarging"
INVARIANT WritersBoundedBypass
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
