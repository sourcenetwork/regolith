\* The design, with every step of deciding and of publishing taken on its
\* own: two committers and one ordered unit with overlapping keys
\* (Overlapping), committer 1 at Immediate, in every interleaving of the
\* three. Every invariant holds.
\*
\* SHRUNK to finish inside 20 seconds of CPU on one TLC worker: nobody stops
\* here, the log never fails and the memtable never fills, and this run
\* checks no liveness. A stopped thread among three is in
\* MC_CommitPipeline_Green_Stop; liveness with a stopped thread is in the
\* Live runs (two threads) and the LiveThree runs (three); a failing log is
\* in the Rollback runs; rotation is in the Rotation runs. Lean
\* (Regolith/Pipeline.lean) proves the order rules for every number of slots.
\* Check every behaviour of the model, the live threads kept running.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* The committing threads.
  Committers = {1, 2}
  \* Every committer is a transaction.
  Plain = {}
  \* Every transaction begins at the moment it commits.
  EarlyBegin = {}
  \* The thread that asks for an ordered unit (an ingest's install).
  Units = {3}
