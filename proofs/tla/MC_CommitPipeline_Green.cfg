\* The design: helping, void slots, decide in ring order, publish over the
\* publishable prefix. Two committers and one ingest with overlapping keys
\* (Overlapping), one committer at Immediate, in every interleaving of the
\* three. Every invariant holds.
\*
\* SHRUNK twice to finish inside 20 seconds of CPU on one TLC worker. First
\* the two liveness properties left this run (46 seconds over 130,140
\* states). Now nobody stops in it either (those 130,140 states took 27
\* seconds for the invariants alone; without a stop there are 37,606 and
\* about 16). Still here: every invariant over all three threads, with the
\* committers conflicting on key 1 and committer 2 conflicting with the
\* ingest on key 2. A thread stopping for good anywhere in its commit, and
\* LockFree and EveryLiveCommitCompletes, are checked on each pair of
\* threads: MC_CommitPipeline_Green_Live (the two committers),
\* MC_CommitPipeline_Green_LiveIngest (committer 2 and the ingest) and
\* MC_CommitPipeline_Green_LiveApart (committer 1 and the ingest). What no
\* run checks any more is three threads with one of them stopped, and
\* liveness for three threads. Lean (Regolith/Pipeline.lean) proves the
\* order rules for every number of threads: publication_order,
\* reader_sees_published, seqs_dense and seqs_strictly_increasing. No Lean
\* theorem covers helping past a stopped thread or the liveness properties.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Committers = {1, 2}
  Ingesters = {3}
  Writes <- Overlapping
  Immediate = {1}
  MaxSlots = 6
  \* Nobody stops here: see SHRUNK above.
  MaxStops = 0
  Mutant = "none"
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
