\* The design: helping, void slots, decide in ring order, publish over the
\* publishable prefix. Two committers and one ingest with overlapping keys
\* (Overlapping), one committer at Immediate; one thread may stop for good
\* anywhere in its commit. Every invariant holds.
\*
\* SHRUNK to finish well inside a minute on one TLC worker: this run no
\* longer checks the two liveness properties, which took most of its 46
\* seconds over these 130,140 states and pushed it past the two-minute
\* limit on a busy machine. It still checks every invariant for all three
\* threads with a stop, NoLiveThreadBlocked among them: once nothing more
\* can happen, every live thread's commit is done. LockFree and
\* EveryLiveCommitCompletes are checked by MC_CommitPipeline_Green_Live
\* (two committers, one stop), MC_CommitPipeline_Green_LiveIngest (a
\* committer and an ingest, one stop) and MC_CommitPipeline_Green_LiveNoStop
\* (all three threads, no stop). What no run checks any more is the two
\* liveness properties for three threads with one of them stopped.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Committers = {1, 2}
  Ingesters = {3}
  Writes <- Overlapping
  Immediate = {1}
  MaxSlots = 6
  MaxStops = 1
  Mutant = "none"
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
