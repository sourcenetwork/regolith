  \* The gate is a Barrier: it lets a full group through, then closes for the next group.
  Kind = "Barrier"
  \* The count is 2: a Latch needs two count-downs to open; a Barrier lets groups of two through.
  Count = 2
  \* Each task waits at the barrier at most twice.
