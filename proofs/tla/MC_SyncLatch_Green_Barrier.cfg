\* A Barrier of 2 parties used by three tasks, two rounds each, so
\* generations overlap: a released waiter may be polled after the next
\* generation has begun. No task passes a generation before it is
\* released, no released waiter is left asleep, and every one passes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Barrier"
  Count = 2
  Rounds = 2
  Mutant = "none"
INVARIANT TypeOK
INVARIANT GateHolds
INVARIANT NoLostWakeup
PROPERTY ReleasedWaitersPass
