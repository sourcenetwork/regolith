\* The bug: a read sums only shard 1. A thread on shard 2 adds once; a read
\* that begins after it reports 0, below the total of 1 when it began.
\* Check every behaviour of the spec.
SPECIFICATION Spec
\* A state with no next step is fine: the adds are bounded.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three threads.
  Threads = {t1, t2, t3}
  \* Two shards, so at least two threads share one.
  NShards = 2
  \* Two adds per thread.
  MaxAdds = 2
  \* The code: an add is one fetch_add.
  AddMode = "Atomic"
  \* The bug: the read sums shard 1 only.
  ReadMode = "OwnShard"
\* Fails: the read reports less than the total when it began.
INVARIANT ReadBetween
