\* The engine under the attacker. One table, two keys rotated at will, two
\* backups, one restore under every provider, power cuts at every step,
\* deletes and purges of any backups, and one attacker edit of a listing,
\* one swap of two files' names, or one metadata file that stops reading,
\* before, during or after the restore or the delete. A provider with every
\* key the backup needs is never refused, a finished restore holds exactly
\* what the backup held, a refused one wrote nothing, the listing names
\* every backup, and a delete or a purge removes nothing while a metadata
\* file cannot be read.
\*
\* Example of what it rules out: backup 2's metadata stops reading, backup
\* 1 is deleted, and the collection, unable to see what backup 2 lists,
\* removes the table backup 2 needs. Second example: the attacker edits
\* backup 1's listing to name backup 2's copy of the table, and the restore
\* copies it without noticing.
\*
\* This run is the attacker's half of MC_BackupSeal_Green, which keeps two
\* restores and leaves the attacker out (95,398 states here, about 9
\* seconds; 24,994 there). Deletes and purges stay in this run: the rule
\* "nothing is removed while a listing cannot be read" needs the unreadable
\* file and a delete together, and the defect GcSkipsUnreadable breaks it.
\* What this size does not show: a second restore after the attacker's act.
\* The Lean proof covers every number of tables, backups and restores,
\* one restore or delete at a time: entitled_restore_is_faithful,
\* refusal_writes_nothing, edited_listing_refuses, renamed_file_refuses and
\* finished_target_refuses for a restore; collect_keeps_listed,
\* collect_stops_on_unreadable and purge_keeps_the_newest for a delete;
\* listing_names_every_backup and unreadable_is_listed for the listing;
\* restore_manifest_follows_its_tables, backup_metadata_follows_its_tables
\* and last_write_holds_all for the order of writes (Regolith/BackupSeal.lean).
