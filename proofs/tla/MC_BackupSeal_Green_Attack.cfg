\* A restore under the attacker. One table, two keys rotated at will, two
\* backups, one restore under every provider, power cuts at every step,
\* and one attacker edit of a listing, one swap of two files' names, or one
\* metadata file that stops reading, before or during the restore. A
\* provider with every key the backup needs is never refused, a finished
\* restore holds exactly what the backup held, a refused one wrote nothing,
\* and the listing names every backup. No delete and no purge here:
\* MC_BackupSeal_Green has them with two restores, and
\* MC_BackupSeal_Green_Sweep has them under the attacker.
SPECIFICATION Spec
\* No delete and no purge in this run: see above.
CONSTRAINT NoCollection
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
