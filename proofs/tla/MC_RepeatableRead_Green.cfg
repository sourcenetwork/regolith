\* RepeatableRead: point reads validated, scans recorded per stretch. Every append
\* lands under reclamation, no document commits over a replaced definition,
\* and the derived head set is the DAG's tips throughout.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1, 2}
  Seed = 0
  Pruner = 3
  Writer = 4
  Patcher = 5
  Level = "RepeatableRead"
INVARIANT TypeOK
INVARIANT INV_AppendsCommit
INVARIANT INV_NoStaleDefinition
INVARIANT INV_HeadsExact
PROPERTY EventuallyAllAppendsCommit
