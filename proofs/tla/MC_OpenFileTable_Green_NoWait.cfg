\* GREEN. One slot, two threads, twice each: thread 1 is a Blocking read of
\* table 1, thread 2 a queue unit reading table 2 that never waits (D60).
\* Whenever thread 1 reads in the slot, thread 2 parks; thread 1's leave
\* tells it, and its next poll reads. Every rule holds, and under fair
\* scheduling the unit finishes both its reads.

\* The behaviours of the model, every thread scheduled fairly.
SPECIFICATION FairSpec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* The reading threads.
  Threads = {1, 2}
  \* The tables they read.
  Files = {1, 2}
  \* How many slots: max_open_files.
  Cap = 1
  \* Which table each thread reads.
  Want <- WantTwo
  \* How many times each thread reads it.
  Reads = 2
  \* At most this many file openings in one run: one per read.
  MaxDesc = 4
  \* Thread 2's reads are queue units.
  NoWait = {2}
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK
\* Must hold in every state.
INVARIANT AtMostCap
\* Must hold in every state.
INVARIANT NeverClosedInUse
\* Must hold in every state.
INVARIANT ReadsOwnFile
\* Must hold in every state.
INVARIANT NeverWaits
\* Must hold in every state.
INVARIANT RetryNeverLost
\* Must hold of every fair behaviour: the unit finishes.
PROPERTY UnitsFinish
