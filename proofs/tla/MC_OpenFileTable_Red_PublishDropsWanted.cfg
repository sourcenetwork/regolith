\* RED. The bug: publishing a loaded slot writes its state word whole, so a
\* WANTED mark set while the slot was claimed is lost.
\* Story: thread 1 claims the only slot to load table 1; thread 2's unit
\* finds it busy, joins the list, marks it WANTED and parks. Thread 1
\* publishes the slot open and drops the mark; when it leaves, it sees no
\* mark and wakes nobody. RetryNeverLost breaks as soon as the mark is gone.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
