\* Liveness with a stopped thread, between a committer and an ingest that
\* share no key: committer 1 at Immediate and the ingest, and either may
\* stop for good anywhere in its commit. The other helps its slot along:
\* some slot always completes (LockFree) and the live thread's commit
\* completes (EveryLiveCommitCompletes). Every invariant holds too.
\*
\* Example of what it rules out: the ingest reserves the slot ahead of
\* committer 1 and stops before its table is installed; committer 1's
\* commit is decided and applied behind it (the E8 window) and then waits
\* for ever to become visible. Committer 1 helps the ingest's slot along to its
\* end, so the publishable prefix reaches its own.
\*
\* The third of three pair runs: MC_CommitPipeline_Green_Live has the two
\* committers and MC_CommitPipeline_Green_LiveIngest has committer 2 and
\* the ingest, which share a key. Together they replace a liveness run of
\* all three threads with no stop (37,606 states and 40 seconds; 1,093
\* states here). No Lean theorem covers helping or these two properties.
\* Check every behaviour of the spec, the live threads kept running.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* The committing thread: committer 1, which writes key 1 only.
  Committers = {1}
  \* The ingesting thread, which installs key 2.
  Ingesters = {3}
  \* Which keys each thread writes: these two share none.
  Writes <- Overlapping
  \* The committer waits for its record to be durable.
  Immediate = {1}
  \* More slots than the threads ever reserve (BoundNeverBinds checks it).
  MaxSlots = 6
  \* One thread may stop for good, anywhere.
  MaxStops = 1
  \* The design, no defect.
  Mutant = "none"
\* Every invariant of the model.
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
\* Some slot always completes while a live thread has work.
PROPERTY LockFree
\* Every commit of a thread that did not stop completes.
PROPERTY EveryLiveCommitCompletes
