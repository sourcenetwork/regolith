\* A reduction that ignores the live snapshots and treats every key as one
\* stripe: a newer version shadows the one a live snapshot reads, and the
\* snapshot's version is dropped. SnapshotReadsKept fails; the head and the
\* newest sequence are unaffected.
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1}
  MaxSeq = 4
  MaxRuns = 2
  Readers = {r1, r2}
  PutValues = {1}
  Cap = 3
  Operator = "Exact"
  FoldOperandOnly = "IfExact"
  Capture = "AfterInputs"
  Stripes = "Ignore"
  Filter = "None"
INVARIANT SnapshotReadsKept
INVARIANT TypeOK
INVARIANT HeadKept
INVARIANT NewestKept
