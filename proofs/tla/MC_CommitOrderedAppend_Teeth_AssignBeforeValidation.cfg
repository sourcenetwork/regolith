\* Teeth for Red_AssignBeforeValidation: the same mutant and writers, every
\* invariant but INV_Dense, over the whole state space. All hold: the hole
\* is the only damage, and a reader fails on it rather than skipping.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Three writers that each append one entry with no once key: a1, a2 and a3.
  Singles = {"a1", "a2", "a3"}
  \* No writer uses the shared once key.
  SharedOnce = {}
  \* No writer appends twice.
  Doubles = {}
  \* No writer repeats a once key inside one transaction.
  RepeatOnce = {}
  \* Every writer appends something.
  Silent = {}
  \* The commit of a1 may be refused because of another key it read.
  MayAbort = {"a1"}
  \* The leader may take two transactions into one commit group.
  GroupSize = 2
  \* One decided group at a time: the pipeline mutex.
  Depth = 1
  \* No write-ahead-log error is injected.
  MaxWalErrors = 0
  \* Positions are given out by the design the engine implements: in the ordered step, after
  \* validation.
  Mode = "Append"
  \* The planted bug: positions are taken before the member is validated, so a refused member has
  \* already used them up.
  Mutant = "AssignBeforeValidation"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: every row at or below the reader's cursor was handed to the reader.
INVARIANT INV_NoSkip
\* Checked in every state: no two appends were given the same position.
INVARIANT INV_UniqueCursors
\* Checked in every state: a smaller position belongs to an earlier commit, or to an earlier append
