\* Liveness of the Mutex, on a run small enough to check a temporal property
\* in a few seconds: two tasks lock (barging), cancel a pending lock and move
\* an owned guard, with Bound 2. Every parked waiter is served
\* (EveryWaiterServed), and every safety invariant holds here too.
\*
\* Example of what it rules out: task 1 parks, task 2 unlocks and at once
\* locks again, for ever, and task 1 never gets the lock. After two lost
\* races the release hands the lock straight to task 1.
\*
\* This run is the liveness half of MC_Sync_Green_Mutex, which keeps three
\* tasks and the safety invariants (1,103 states here against 112,029
\* there). What two tasks do not show is a waiter queued behind another
\* waiter; the safety run shows the queue stays in order (BoundedBypass,
\* HandoffExclusive, NoLostWakeup), and Lean's release_hands_off_at_bound and
\* no_stranded_head (Regolith/Sync.lean) hold for every number of tasks.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every task is idle is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two tasks: one to wait, one to barge past it.
  Tasks = {1, 2}
  \* A Mutex is a Semaphore of one permit.
  Kind = "Semaphore"
  \* One permit: the lock.
  Permits = 1
  \* Every task asks for the one permit.
  Need <- NeedOne
  \* Every task is its own owner (owners matter to the ReentrantMutex only).
  Owner <- OwnerEach
  \* No nesting: that is the ReentrantMutex's.
  MaxDepth = 1
  \* An owned guard may move to the other task.
  Owned = TRUE
  \* After two lost races a release hands the lock to the waiter.
  Bound = 2
  \* Liveness is checked for task 1; task 2 is the same by renaming.
  Watched = {1}
  \* The design, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* The waiters count is exactly the tasks registered or queued.
INVARIANT WaitersCounted
\* One task at a time holds the drain token.
INVARIANT DrainExclusive
\* Permits are never created or lost.
INVARIANT PermitsConserved
\* At most one task holds the lock.
INVARIANT MutualExclusion
\* Guards out match the depth (trivial for a Mutex).
INVARIANT ReentrancyDepth
\* A waiter loses at most Bound races.
INVARIANT BoundedBypass
\* While a handoff is owed, nobody barges.
INVARIANT HandoffExclusive
\* A handoff is followed by a wake, and no waiter sleeps while it could go on.
INVARIANT NoLostWakeup
\* An idle task holds nothing: a dropped waiter passed the lock on.
INVARIANT CancelPassesOn
\* The promise of this run: every parked waiter stops waiting.
PROPERTY EveryWaiterServed
