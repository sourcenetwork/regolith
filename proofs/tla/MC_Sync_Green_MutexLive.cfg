\* Liveness of the Mutex, on a run small enough to check promises about whole
\* runs: task 1 waits, task 2 only tries and takes the lock whenever it is
\* free, as often as it likes, Bound 2. Every waiter is served; a drain's
\* passes are earned; and once no more waiter operations land on a drain,
\* every drain ends.
\*
\* Example of what it rules out: task 2 takes the lock back after every
\* release, for ever, and task 1 never gets it, whether because its losses
\* are never counted or because it is kept serving the queue; or task 2, in
\* the drain role with nobody queued, is kept passing by task 1's releases.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, in which a started
\* operation finishes, a woken task is polled and a holder eventually lets go.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two tasks use the lock: 1 and 2.
  Tasks = {1, 2}
  \* The lock is a semaphore; with one permit it is a Mutex.
  Kind = "Semaphore"
  \* One permit: at most one holder.
  Permits = 1
  \* Every task asks for one permit.
  Need <- NeedOne
  \* Every task is its own owner (unused unless the lock is reentrant).
  Owner <- OwnerEach
  \* A task holds at most one guard at a time.
  MaxDepth = 1
  \* Guards stay with the task that took them.
  Owned = FALSE
  \* A waiter is owed a handoff after two lost races.
  Bound = 2
  \* Task 1 waits when the lock is taken; task 2 only tries.
  Waits = {1}
  \* No waiting future is dropped.
  Drops = {}
  \* Every task asks for the lock as often as it likes.
  Turns <- TurnsAny
  \* Nobody holds the lock when the run starts.
  Start = {}
  \* The tasks may ask in any order.
  Follows <- FollowsNobody
  \* The "every waiter is served" promise is checked for task 1.
  Watched = {1}
  \* The passes of a drain are not counted in this run (what each drain has earned is).
  PassMax = 0
  \* No planted bug: the code as built.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: only the holder of the drain role is inside the drain.
INVARIANT DrainExclusive
\* Checked in every state: every waiting node is linked exactly once.
INVARIANT NodesLinked
\* Checked in every state: every permit is somewhere: free, pending, in a guard, or in a pass's hand.
INVARIANT PermitsConserved
\* Checked in every state: never more permits out than exist (a Mutex: at most one holder); a
\* reentrant lock's guards all belong to its one owner.
INVARIANT MutualExclusion
\* Checked in every state: a reentrant lock's depth is the number of guards out, and it has an owner
\* exactly while a guard is out.
INVARIANT ReentrancyDepth
\* Checked in every state: no waiter is passed over more than Bound times, and at Bound the HANDOFF
\* bit is up.
INVARIANT BoundedBypass
\* Checked in every state: nobody barges while a handoff is owed.
INVARIANT HandoffExclusive
\* Checked in every state: a marked sleeper is woken, and no waiter sleeps while it could take the
\* lock.
INVARIANT NoLostWakeup
\* Checked in every state: an idle task holds nothing: a waiter dropped after a grant gave the
\* permits back.
INVARIANT CancelPassesOn
\* Checked in every state: a future that spins on its node is inside its poll, so its node has no
\* waker a release could claim.
INVARIANT SpinningUnarmed
\* Checked in every state: a drain runs one pass, and one more for each waiter operation, or release
\* with somebody to tell, that lands while it runs; none for a release over an empty queue.
INVARIANT DrainBounded
\* Checked over whole runs: once no more waiter operations land on a drain, every drain ends.
PROPERTY DrainsEndWhenWaitersSettle
\* Checked over whole runs: every watched waiter eventually gets the lock, granted it or taking it
\* on a retry; being woken to retry is not enough (see the SCOPE note in Sync.tla).
PROPERTY EveryWaiterServed
