\* The defect: an aborted slot takes a sequence when it is decided. No
\* record ever carries it, so the committed sequences have a hole that
\* recovery, a log reader and the durable watermark all stop at. NoHole
\* fails; the other invariants are checked too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Committers = {1, 2}
  Ingesters = {3}
  Writes <- Overlapping
  Immediate = {1}
  MaxSlots = 6
  MaxStops = 0
  Mutant = "AbortHole"
INVARIANT NoHole
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
