\* GREEN. Liveness with one thread (the single-threaded wasm case): it reads
\* one block, starts one job, polls its own queue when it has nothing else to
\* run, and finishes both by itself, in every fair run (AllDone). Every
\* invariant holds.
\*
\* Example of what it rules out: the one thread misses block 1, marks itself
\* idle, and waits for another thread to do the read. There is no other
\* thread, so its own poll must do the read.
\*
\* This run is the liveness half of MC_NonBlocking_Green_Single, which keeps
\* the second block and the safety invariants (1,010 states here against
\* 45,109 there). What this size does not show: two reads waiting at once on
\* the one queue. Lean covers the safety for every number of threads and
\* units: claim_once, told_at_most_once, every_waiter_told,
\* no_lost_idle_wakeup and busy_never_woken in Regolith/IoQueue.lean;
\* single_thread_finishes there proves that one thread finishes everything.
\* No Lean theorem states that many threads do.

\* The behaviours of the model: Init, then steps of Next, each thread fair.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* One thread, with one queue: the single-threaded wasm case.
  Threads = {1}
  \* One block it reads.
  Blocks = {1}
  \* It reads block 1.
  Want <- WantSingleOne
  \* One job regolith starts on its call.
  Jobs = {3}
  \* The job is the one thread's.
  JobOf <- JobOfSingle
  \* No commit group in this setup.
  Groups = {}
  \* So no group has members.
  MembersOf <- MembersNone
  \* No write stall in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* One unit for the block and one for the job.
  MaxUnits = 2
  \* The real code: no bug planted.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* A unit's disk read runs at most once.
INVARIANT SingleRun
\* A queue gets at most one note per unit, and only if it registered.
INVARIANT ExactlyOnce
\* Every queue that registered on a finished unit gets its note.
INVARIANT EveryWaiterTold
\* A read's request sits only on its own thread's queue.
INVARIANT OwnQueue
\* No thread sleeps unwoken with a note in its inbox.
INVARIANT NoLostIdleWakeup
\* Only an idle thread is ever woken.
INVARIANT BusyNeverWoken
\* Every free unit is held by some queue, so some poll runs it.
INVARIANT NoOrphanUnit
\* The promise of this run: every read and job finishes, in every fair run.
PROPERTY AllDone
