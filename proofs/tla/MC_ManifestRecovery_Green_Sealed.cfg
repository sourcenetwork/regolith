\* The fix on an encrypted database: every batch is sealed, and the judge of
\* a damaged end opens each batch before it reads whether the writer synced
\* it. A torn reservation followed by a whole one and a table's batch is a
\* crash's doing, and opens. Every invariant holds.
\* The run: two keys, at most three writes, at most seven batches, one
\* memtable waiting at a time.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  MaxFrozen = 1
  Sealed = TRUE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT AckedSurvive
INVARIANT ReadsNewest
INVARIANT RotSafe
