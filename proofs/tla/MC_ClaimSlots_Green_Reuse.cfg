\* GREEN. Owner 1 runs two transactions one after the other while close
\* drains, so the slot it gives back is taken again for its second claim
\* while close may be looking at it: close takes whichever claim the slot
\* holds when it gets there. Every rule holds. (Owner 2 runs nothing: with
\* both owners and close the run is over the time bound; the two owners
\* sharing reused slots are MC_ClaimSlots_Green_ReuseShared.)

\* The behaviours of the model.
SPECIFICATION Spec
\* A state where nothing can move before everybody is done is an error.
CHECK_DEADLOCK TRUE
\* The setup this configuration checks.
CONSTANTS
  \* Two owners run transactions.
  Owners = {1, 2}
  \* What each owner does.
  Script <- TwoInARowAlone
  \* How many chunks the table may hold.
  Chunks = 2
  \* Free slots on the stack at the start.
  PreFree = 0
  \* Whether close runs.
  Closes = TRUE
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK OneHolder FreeStackSound CellBelongsToHolder DroppedOnce LiveTakenByClose DrainInBounds AtRest
