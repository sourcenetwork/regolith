\* Eventual durability with an external reader. a1's commit is published
\* before it is durable, the external reader records position 1 as a1's,
\* and a power cut drops a1's record. Another writer commits next and takes
\* position 1.
\* INV_ExternalStable fails. Left out because Eventual does not promise
\* them: INV_VisibleDurable and INV_AckStable. Every other invariant is
\* checked first and holds up to that state; Green_Eventual checks them
\* over the whole state space.
\*
\* SHRUNK with Green_Eventual, so the two keep the same constants: one
\* writer without a once key where there were two. The defect needs one
\* dropped commit and one later commit by anyone, and INV_ExternalStable
\* still fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  \* One writer without a once key: see SHRUNK above.
  Singles = {"a1"}
  SharedOnce = {"s1", "s2"}
  Doubles = {}
  Durability = "Eventual"
  MaxCrashes = 1
INVARIANT TypeOK
INVARIANT INV_Dense
INVARIANT INV_UniqueCursors
INVARIANT INV_AtMostOnce
INVARIANT INV_NoSkip
INVARIANT INV_ExternalStable
