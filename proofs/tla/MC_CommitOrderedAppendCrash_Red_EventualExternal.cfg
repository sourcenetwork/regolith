\* Eventual durability with an external reader. a1's commit is published
\* before it is durable, the external reader records position 1 as a1's,
\* and a power cut drops a1's record. a2 commits next and takes position 1.
\* INV_ExternalStable fails. Left out because Eventual does not promise
\* them: INV_VisibleDurable and INV_AckStable. Every other invariant is
\* checked first and holds up to that state; Green_Eventual checks them
\* over the whole state space.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writers that each append one entry with no once key: a1 and a2.
  Singles = {"a1", "a2"}
  \* Two writers that each append once with the same once key "o1", so only one of them may get a
  \* row: s1 and s2.
  SharedOnce = {"s1", "s2"}
  \* No writer appends twice.
  Doubles = {}
  \* A commit may be published before its record is on disk (DurabilityMode::Eventual).
  Durability = "Eventual"
  \* One power cut may happen, at any moment.
  MaxCrashes = 1
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: the visible rows sit at exactly positions 1 up to the head, and no read
\* found one missing.
INVARIANT INV_Dense
\* Checked in every state: no two appends were given the same position.
INVARIANT INV_UniqueCursors
\* Checked in every state: at most one row carries a given once key, and the key holds that row's
\* position.
INVARIANT INV_AtMostOnce
\* Checked in every state: every row at or below the reader's cursor was handed to the reader.
INVARIANT INV_NoSkip
\* The promise the planted bug must break: a position an outside reader wrote down never holds a
\* different entry later.
INVARIANT INV_ExternalStable
