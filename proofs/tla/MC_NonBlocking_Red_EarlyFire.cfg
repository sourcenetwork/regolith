\* RED. The bug: the poll completes every timed wait it holds without
\* looking at the clock.
\* Story: thread 1 asks for timed wait 6, its poll takes the wait in and
\* completes it at once. The task that asked to wait runs again before the
\* wait's due time. TimerNotEarly breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run that ends (everything done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* One thread, with one queue.
  Threads = {1}
  \* No block in this setup.
  Blocks = {}
  \* So the thread reads none.
  Want <- WantSingleNone
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* No unit is ever made here; the bound only needs a value.
  MaxUnits = 1
  \* No sync rounds in this setup.
  Rounds = {}
  \* So no round covers a commit.
  CommittersOf <- CommittersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* One timed wait.
  Timers = {6}
  \* It is thread 1's.
  TimerOf <- TimerOfOne
  \* The thread keeps its queue.
  Droppers = {}
  \* The planted bug.
  Mutant = "EarlyFire"
\* The invariant this bug must break.
INVARIANT TimerNotEarly
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT NoLostIdleWakeup
\* Checked as well.
INVARIANT BusyNeverWoken
\* Checked as well.
INVARIANT DeliveredOnOwnPoll
\* Checked as well.
INVARIANT TimerOnOwnQueue
\* Checked as well.
INVARIANT DroppedHoldsNothing
