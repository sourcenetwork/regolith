\* GREEN. A file of two bytes in a segment of 2, an append of one byte and
\* a set_len to 1 (always a copy), with one reader that may hold the old
\* extent while it is replaced and freed. Every rule holds.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where everyone finished is not an error.
