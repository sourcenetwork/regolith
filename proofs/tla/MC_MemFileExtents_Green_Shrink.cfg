  Ops <- OpsShrink
  \* One reader.
  Readers = {1}
  \* Bytes of 7 in the file at the start.
  InitLen = 2
  \* The room of its one segment.
  InitCap = 2
  \* The smallest segment a file grows by.
  MinCap = 1
  \* The room from which a replaced extent is submitted.
  Big = 2
  \* The real code: no bug planted.
  Mutant = "none"
