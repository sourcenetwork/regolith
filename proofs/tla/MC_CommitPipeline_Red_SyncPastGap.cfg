\* The defect: the fsync publishes the last written sequence rather than
\* the end of the written prefix, so the durable watermark covers a
\* committed slot whose record is not written yet. DurableImpliesWritten
\* fails; the other invariants are checked too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Committers = {1, 2}
  Ingesters = {3}
  Writes <- Overlapping
  Immediate = {1}
  MaxSlots = 6
  MaxStops = 0
  Mutant = "SyncPastGap"
INVARIANT DurableImpliesWritten
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
