\* The design under fair scheduling: one worker and two callers that take the
\* gate alone again and again, with jobs handed to the worker as well. Bound
\* is 1 to keep the search small. In the end the worker's pass always gets
\* another turn (E28), however the callers' waits overlap.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: this run no
\* longer checks that every waiter gets in, which took most of its 46
\* seconds over these 1,516 states. MC_CompactionGate_Green_LiveServed
\* checks that, with one caller. What no run checks any more is "every
\* waiter gets in" for two callers whose waits overlap; the bound on how
\* often each is passed over (BoundedBypass) is still checked for two, and
\* the Lean proof (CompactionGate.lean) proves it both ways for every size.
\* The system as CompactionGate.tla describes it, with fair scheduling.
SPECIFICATION Spec
\* The values this check fixes.
CONSTANTS
  \* The compaction workers.
  Workers = {"w"}
  \* The callers that wait for the gate on their own thread.
  Blockers = {"b1", "b2"}
  \* The callers whose job parks on their I/O queue.
  Owners = {}
  \* The losses after which a waiter is owed the gate.
  Bound = 1
  \* The most jobs waiting for the workers at once.
  MaxJobs = 1
  \* The planted defect, or "none".
  Mutant = "none"
\* Every variable holds the kind of value it should.
INVARIANT TypeOK
\* A job is inside with no other job and no pass.
INVARIANT MutualExclusion
\* No waiter is passed over more than Bound times.
INVARIANT BoundedBypass
\* Nobody walks in past a waiter that is owed the gate.
INVARIANT OwedShutsBarging
\* No worker runs two jobs without a pass between them.
INVARIANT WorkerTakesTurns
\* A waiter that could move has its wake-up.
INVARIANT NoLostWake
\* A thread is inside exactly when it believes it is, or was just handed the gate.
INVARIANT InsideMatches
\* In the end: the worker's pass gets its turn again and again.
PROPERTY WorkerAlwaysPasses
