\* The defect: a slot is validated against the published slots only, not
\* against the slots below it decided to commit but not yet published.
\* Two commits of key 1 from one snapshot both land. NoLostUpdate fails;
\* the other invariants are checked too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Committers = {1, 2}
  Ingesters = {3}
  Writes <- Overlapping
  Immediate = {1}
  MaxSlots = 6
  MaxStops = 0
  Mutant = "ValidatePublished"
INVARIANT NoLostUpdate
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLiveThreadBlocked
INVARIANT BoundNeverBinds
