\* The bug: a publisher stores its view without the compare-and-swap. Two
\* racing publishers build from one view and the second overwrites the
\* first: ChainOfPublications breaks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers = {r1, r2}
  Publishers = {p1, p2}
  MaxViews = 5
  Mode = "PlainStore"
INVARIANT ChainOfPublications
