\* Green_Counters with the counter the read-merger read validated as a blind
\* merge (Mutant ReadMergeBlind): it commits over an increment that landed
\* after its read, and its receipt is one short of the count its merge
\* produced. INV_ReceiptsExact fails.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {11}
  Rebasers = {12}
  Resetters = {10}
  Clearers = {13}
  Migrators = {}
  Extras <- NoExtras
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "ReadMergeBlind"
INVARIANT TypeOK
INVARIANT INV_ReceiptsExact
