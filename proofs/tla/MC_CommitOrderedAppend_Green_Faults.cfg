\* The design with groups of two, aborts and a WAL error. a1 and s1 may
\* fail validation on another key, ahead of or behind the other member of
\* their group (s1's once key o1 then stays free for s2); a group may fail
\* at the WAL after its positions were assigned, and the next group
\* reassigns them from the view. Every invariant holds: an aborted member
\* and a failed group leave no hole.
\*
\* SHRUNK to finish in well under 20 seconds of CPU on one TLC worker: one
\* writer without a once key where there were two (45,216 states and 19
\* seconds; now 4,844 states and about 7). Still here: a1 and s1 failing
\* validation ahead of or behind their group's other member, s2 taking the
\* once key s1 left free, the writer that appends twice, and the WAL error
\* after positions were assigned. Gone: a second plain writer, which adds
\* orders of the same steps. Lean covers every number of writers and appends: reachable_inv,
\* dense_from_one, unique_positions, at_most_once and commit_order in
\* Regolith/Append.lean.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  \* One writer without a once key: see SHRUNK above.
  Singles = {"a1"}
  SharedOnce = {"s1", "s2"}
  Doubles = {"d1"}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {"a1", "s1"}
  GroupSize = 2
  Depth = 1
  MaxWalErrors = 1
  Mode = "Append"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_AtMostOnce
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
