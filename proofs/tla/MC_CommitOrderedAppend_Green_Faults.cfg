\* The design with groups of two, aborts and a WAL error. a1 and s1 may
\* fail validation on another key, ahead of or behind the other member of
\* their group (s1's once key o1 then stays free for s2); a group may fail
\* at the WAL after its positions were assigned, and the next group
\* reassigns them from the view. Every invariant holds: an aborted member
\* and a failed group leave no hole.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2"}
  SharedOnce = {"s1", "s2"}
  Doubles = {"d1"}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {"a1", "s1"}
  GroupSize = 2
  Depth = 1
  MaxWalErrors = 1
  Mode = "Append"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_NoSkip
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_AtMostOnce
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
