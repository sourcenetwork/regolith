\* GREEN, with log failures. A reservation is handed out when its slot is
\* decided, before its record is published; a log failure then discards
\* every record not yet published, and the rollback writes the counter back
\* at the last value a discarded reservation handed out. Three callers, one
\* that may abort, background syncs, two log failures and one power cut, in
\* every order. No number is handed out twice without a power cut
\* (INV_HandedOutOnce), and every number a durable commit uses is covered by
\* the counter before it on disk (INV_UseCovered), with the rules that do not
\* name an allocation's own record. INV_UseDurable is left out: a commit
\* that uses a reservation the rollback discarded is covered by the
\* write-back, not by the reservation's record, which is what INV_UseCovered
\* states.
\* The runs checked: every run that starts in Init and then takes steps of Next.
