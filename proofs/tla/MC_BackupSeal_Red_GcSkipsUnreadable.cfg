\* The bug planted: a delete or a purge counts only the listings it can
\* read, so it passes over a backup whose metadata does not read.
\* How it breaks the promise: one table, listed by backups 1 and 2 (one
\* pool file). Backup 2's metadata flips a bit. Deleting backup 1 finds no
\* other listing it can read and removes the pool file, so backup 2 lists
\* a table the pool no longer has, and a newer build, or the disk once it
\* reads again, cannot restore it. ListedRestores fails.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two backups, as in the GREEN run.
  MaxBackups = 2
  \* Two restores, as in the GREEN run.
  MaxRestores = 2
  \* One entry per batch of the walk of meta/: a boundary after every entry.
  Batch = 1
  \* One pool file per batch of the sweep: a boundary after every file.
  Sweep = 1
  \* Two table slots: a backup or a restore copies its tables one at a time.
  Slots = 2
  \* The defect above.
  Mutant = "GcSkipsUnreadable"
\* The promise this bug breaks.
INVARIANT ListedRestores
