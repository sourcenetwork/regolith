\* SnapshotIsolation: a point read is not validated. The patcher replaces the
\* definition under an open writer and the document commits against the old
\* one. INV_NoStaleDefinition fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1, 2}
  Seed = 0
  Pruner = 3
  Writer = 4
  Patcher = 5
  Level = "SnapshotIsolation"
INVARIANT TypeOK
INVARIANT INV_NoStaleDefinition
