\* Task 1 writes and takes upgradable reads; tasks 2 and 3 only read, and
\* may overlap without end. The writer is served, and the upgrade completes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Bound = 1
  Watched = {1}
  Asks <- AsksWriterVsReaders
  Mutant = "none"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT BoundedBypass
INVARIANT NoUpgradeDeadlock
INVARIANT NoLostWakeup
PROPERTY EveryWaiterServed
PROPERTY UpgradeCompletes
