\* `fetch_max`. Thread 2 (sample 2) loads 0; thread 3 (sample 5) raises the maximum to 5;
\* thread 2, whose 2 is above what it loaded, then stores 2. The maximum ends at 2 with a sample
\* of 5 recorded: MaxExact breaks.

\* Check every behaviour of the spec.
