\* The bug: the group goes into the memtable and becomes visible before its
\* fsync. A reader sees transaction 1's Immediate commit while its record is
\* not durable yet; a power cut now would erase what the reader saw.
\* DurableBeforeVisible fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Plain = {4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  \* No commit here is made by commit_nowait: every leader syncs its own group.
  Nowait = {}
  Mutant = "PublishBeforeSync"
INVARIANT DurableBeforeVisible
INVARIANT TypeOK
INVARIANT SerialEquivalent
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT BoundedTurn
INVARIANT NoStuckTicket
