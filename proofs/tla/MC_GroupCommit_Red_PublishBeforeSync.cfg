\* The defect: the group is applied and published before its fsync. An
\* Immediate commit is visible while its record is not yet durable, so a
\* reader can see a commit a crash would lose. DurableBeforeVisible fails;
\* the other invariants are checked too and hold until then.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  Mutant = "PublishBeforeSync"
INVARIANT DurableBeforeVisible
INVARIANT TypeOK
INVARIANT SerialEquivalent
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT NoStuckTicket
