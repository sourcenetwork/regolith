\* The real read view: pinned loads, compare-and-swap publication, and a
\* reclaimer that waits for the readers pinned when a view was retired.
\* Two readers and two racing publishers, up to five views.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers = {r1, r2}
  Publishers = {p1, p2}
  MaxViews = 5
  Mode = "Green"
INVARIANT TypeOK
INVARIANT NoFreedRead
INVARIANT FreshLoad
INVARIANT ChainOfPublications
