\* The real read view: pinned loads, compare-and-swap publication, and a
\* reclaimer that waits for the readers pinned when a view was retired.
\* Two readers and two racing publishers, up to four views.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: four views
\* where there were five (866,726 states, 50 seconds; now about 162
\* thousand). Four views still hold a view that is published, replaced,
\* retired while a reader holds it and freed once the reader lets go, twice
\* over, with both publishers losing and winning the compare-and-swap; each
\* RED still runs with five. A fifth view beside them is left to the Lean
\* proof (reachable_safe, cas_chain), which covers every number of views.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers = {r1, r2}
  Publishers = {p1, p2}
  MaxViews = 4
  Mode = "Green"
INVARIANT TypeOK
INVARIANT NoFreedRead
INVARIANT FreshLoad
INVARIANT ChainOfPublications
