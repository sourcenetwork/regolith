\* GREEN, with a commit and what can fail. Writer w1 is a transaction's
\* commit; writer w2 is a plain write; one job; the engine may latch at any
\* moment, and a write may have to rotate at the memtable cap, with a seal
\* that may fail. The model records how the commit's call ends: with its
\* write in, or told the latch or the seal's error. It is never handed the
\* wait and never gives up while its own steps make progress
\* (NoLostCommit), and it is never left waiting once the engine latched
\* (NoWaitOnceLatched).
\*
\* SIZED like MC_StallRelief_Green_Failures, whose run this is with one of
\* its two writers a commit. A relief that fails and recovers is in
\* MC_StallRelief_Green_Commit.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writer threads.
  Writers = {w1, w2}
  \* As many pieces of progress may leave the stop on as in MC_StallRelief_Green_Failures.
  MaxSteps = 2
  \* The real code.
  Mode = "Green"
  \* The engine may latch, and a rotation may flush at the memtable cap and fail to seal.
  Failures = TRUE
  \* The relief never fails.
  ReliefFails = FALSE
  \* Writer w1 is a commit; w2 is a plain write.
  Commits = {w1}
\* Must hold in every state.
INVARIANT TypeOK
\* Must hold in every state.
INVARIANT NoStrandedWait
\* Must hold in every state.
INVARIANT NoWaitOnceLatched
\* Must hold in every state.
INVARIANT NoWaitOnceFailing
\* Must hold in every state: no commit is lost to the stall.
INVARIANT NoLostCommit
