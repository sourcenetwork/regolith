\* A Barrier waiter decides it may pass by reading the arrival count as 0
\* rather than by its generation. Its generation is released and it is
\* woken, but a task of the next generation arrives before it is polled:
\* the count is 1, it registers its waker again with no node left to wake
\* it, and sleeps past its own release. NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Barrier"
  Count = 2
  Rounds = 2
  Mutant = "CountCheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT GateHolds
