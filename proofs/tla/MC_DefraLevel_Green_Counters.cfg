\* DefraLevel on the counter alone: two blind increments, a read-merger, a
\* rebase that puts the counter and merges into it in one batch, and a
\* reset, in every interleaving. The counter always holds what its
\* contract says (INV_CounterExact), every receipt is the count its merge
\* produced (INV_ReceiptsExact), and a blind increment is refused only when a
\* put, delete or range delete committed after it began
\* (INV_IncrementsCommitUnlessReplaced). The read-merger and the rebase merge
\* into keys the blind-merge path must not claim; Red_ReadMergeBlind and
\* Red_PutMergeBlind break exactly that.
\*
\* SHRUNK to finish well inside a minute on one TLC worker: the range delete
\* left this run (104,395 states and 20 seconds on this branch's model; now
\* about 12 thousand). MC_DefraLevel_Green_Counters_Clear
\* runs the range delete beside the increments, the read-merger and the
\* reset. What no run holds any more is the rebase and the range delete in
\* one behaviour; every other pair of these writers still meets in one of
\* the two, and Red_RangeDeleteNotReplacement still runs all of them.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {11}
  Rebasers = {12}
  Resetters = {10}
  \* No range delete here: see SHRUNK above.
  Clearers = {}
  Migrators = {}
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_CounterExact
INVARIANT INV_ReceiptsExact
INVARIANT INV_IncrementsCommitUnlessReplaced
