\* DefraLevel blind merges. Concurrent increments never refuse each other,
\* an increment is refused only by a reset after it began, and none commits
\* over such a reset.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  Resetters = {10}
  CommutativeRanges = {1, 2}
  Level = "DefraLevel"
INVARIANT TypeOK
INVARIANT INV_IncrementsCommitUnlessReplaced
INVARIANT INV_NoIncrementAcrossReset
