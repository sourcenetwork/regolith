\* DefraLevel on the counter alone, with the range delete: two blind
\* increments, a read-merger, a reset and a range delete over the counter,
\* in every interleaving. The counter always holds what its contract says
\* (INV_CounterExact), every receipt is the count its merge produced
\* (INV_ReceiptsExact), and a blind increment is refused only when a put,
\* delete or range delete committed after it began
\* (INV_IncrementsCommitUnlessReplaced): the range delete is a replacement,
\* which Red_RangeDeleteNotReplacement breaks. The rebase is left to
\* MC_DefraLevel_Green_Counters, so each run stays small.
SPECIFICATION Spec
CONSTRAINT CounterWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {7, 8}
  ReadMergers = {11}
  \* No rebase here: MC_DefraLevel_Green_Counters has it.
  Rebasers = {}
  Resetters = {10}
  \* The range delete over the counter.
  Clearers = {13}
  Migrators = {}
  CommutativeRanges = {1, 2}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT INV_CounterExact
INVARIANT INV_ReceiptsExact
INVARIANT INV_IncrementsCommitUnlessReplaced
