\* Green_Parts at RepeatableRead, where get_parts is a plain get validated in
\* full: an operand touching only part 2 refuses the part reader.
\* INV_PartsRelaxed fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- PartsWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "RepeatableRead"
  Mutant = "none"
INVARIANT INV_PartsRelaxed
INVARIANT INV_PartsCurrent
INVARIANT INV_ReasonsExact
