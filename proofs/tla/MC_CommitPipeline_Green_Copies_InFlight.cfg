\* The witness that MC_CommitPipeline_Green_Copies reaches a late copy: the
\* same run, with the claim "no two threads ever have one record's write in
\* flight" added as an invariant. It breaks: the unit's holder has a run in
\* flight while the other thread, out of patience, writes one of its
\* records too.
\* Check every behaviour of the model.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
\* What this run chooses: who takes part, what may go wrong, and which code is checked.
CONSTANTS
  \* The committing threads.
  Committers = {1, 2}
  \* Every committer is a transaction.
  Plain = {}
  \* Every transaction begins at the moment it commits.
  EarlyBegin = {}
  \* No ordered unit.
  Units = {}
  \* Nobody shares a key: both commits land, so both have a record.
  Writes <- Apart
  \* Which keys each transaction read and has checked: the ones it writes.
  Reads <- Apart
  \* Thread 2 waits for its record to be durable: it syncs.
  Immediate = {2}
  \* More tickets than the threads ever pull (BoundNeverBinds checks it).
  MaxSlots = 3
  \* Nobody walks away: the owner is only slow, which the interleavings give.
  MaxStops = 0
  \* (No thread may stop.)
  Stoppers = {}
  \* Whoever gets there first pulls the first ticket.
  Head = 0
  \* The log never fails.
  MaxFails = 0
  \* The memtable never fills: no rotation in this run.
  Buffer = 9
  \* Every step of deciding and of publishing is taken on its own.
  Coarse = FALSE
  \* Records go to the log as the code sends them: runs of the write unit,
  \* parks, and copies by threads whose patience ran out.
  Copies = TRUE
  \* A parked writer runs out of patience after a while, as in the code.
  Patience = TRUE
  \* The design, no defect.
  Mutant = "none"
\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* An owner who thinks its order is in the ring is right.
INVARIANT OwnerSeesItsFate
\* One thread at a time on the log's device step.
INVARIANT OneRound
\* Orders are settled in ticket order.
INVARIANT DecidedIsPrefix
\* The sequences handed out have no gap.
INVARIANT NoHole
\* Only what may be finished is finished.
INVARIANT PublishedPrefix
\* What a sync vouched for is written.
INVARIANT DurableImpliesWritten
\* At Immediate, visible only once durable.
INVARIANT DurableBeforeVisible
\* Nobody is told "done" for a lost order, or "failed" for a kept one.
INVARIANT NoFalseAck
\* When nothing more can happen, every live thread has returned.
INVARIANT NoLiveThreadBlocked
\* The run's ticket bound never stops a live thread.
INVARIANT BoundNeverBinds
\* No write is in flight over what a sync vouched for or vouches for.
INVARIANT NoWriteUnderSync
\* Only the holder of the write unit has a run gathered or in flight.
INVARIANT OneClaim
\* The witness: "no two copies of a record are ever in flight". It must break.
INVARIANT NoTwoCopies
