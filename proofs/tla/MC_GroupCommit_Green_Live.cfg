\* Liveness of group commit, on a run small enough to check a temporal
\* property in a few seconds: three transactions, groups of up to three, and
\* a group may fail. Every transaction's ticket completes in the end
\* (AllTicketsComplete), and every safety invariant holds here too.
\*
\* Example of what it rules out: transactions 1 and 2 share a group, the
\* group's write fails, the leader reports the failure to itself only, and
\* transaction 2 waits on its ticket for ever. A group fails as one unit, so
\* every member's ticket completes with the error.
\*
\* This run is the liveness half of MC_GroupCommit_Green, which keeps four
\* transactions and the safety invariants (2,385 states here against 68,511
\* there). What three transactions do not show is the blind writer of key 2
\* racing transaction 3; the safety run shows that race decides as a serial
\* order does. No Lean theorem states this liveness claim.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every transaction is done is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Three transactions: two that write key 1, one that reads key 1 and
  \* writes key 2.
  Txns = {1, 2, 3}
  \* The two keys they read and write.
  Keys = {1, 2}
  \* What each transaction reads (ReadsW in GroupCommit.tla).
  Reads <- ReadsW
  \* What each transaction writes (WritesW in GroupCommit.tla).
  Writes <- WritesW
  \* Transactions 1 and 3 wait for their record to be durable.
  Immediate = {1, 3}
  \* A group takes up to three members.
  MaxGroup = 3
  \* A group's write or sync may fail.
  Faults = TRUE
  \* The design, no defect.
  Mutant = "none"
\* Every safety invariant of MC_GroupCommit_Green.
INVARIANT TypeOK
INVARIANT SerialEquivalent
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT NoStuckTicket
\* The promise of this run: in the end every transaction is done.
PROPERTY AllTicketsComplete
