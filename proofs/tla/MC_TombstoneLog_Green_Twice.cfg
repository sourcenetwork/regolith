\* The witness that the GREEN run has a tombstone appended twice: the same
\* run with one reader, and the claim "no tombstone is ever in the log twice"
\* added. It breaks: two threads applied the same commit, neither found its
\* tombstone there, and both appended it. Every other invariant holds, which
\* is why that is harmless.
\* Check every behaviour of the model.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two commits, each with one range tombstone.
  Commits = 2
  \* The threads that apply them: any of them may apply any commit.
  Appliers = {a1, a2}
  \* The reader.
  Readers = {r1}
  \* The real code.
  Mode = "Green"
\* The one that must break. Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* No two appends share a slot.
INVARIANT OneSlotEach
\* A reader never reads a slot before its tombstone is in it.
INVARIANT ReadWhole
\* A reader sees every tombstone its snapshot includes.
INVARIANT PublishedSeen
\* The witness: "no tombstone is ever in the log twice". It must break.
INVARIANT NeverTwice
