\* The owed bit is never set. A writer waits behind readers that keep
\* overlapping; each release wakes it, it loses each time, and nothing ever
\* holds the readers back. BoundedBypass fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Plain"
  Owner <- OwnerEach
  MaxDepth = 1
  Bound = 1
  Watched = {1}
  Asks <- AsksAll
  Mutant = "UnboundedBarging"
INVARIANT BoundedBypass
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT UpgradableExclusive
INVARIANT ReentrancyDepth
INVARIANT HandoffExclusive
INVARIANT UpgradeHoldsBack
INVARIANT NoUpgradeDeadlock
INVARIANT NoSelfDeadlock
INVARIANT NoLostWakeup
INVARIANT CancelPassesOn
