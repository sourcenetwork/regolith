\* A scan inside a commutative prefix, used as the contract says [3.1 exempt
\* reads, 3.2]. The roster is declared commutative. Three joiners each scan it
\* and add a key of their own, and each rewrites the seat with the bytes every
\* joiner writes. They decide nothing on what the scan returned.
\* The scan's stretch stays inside the prefix, so it records nothing, and the
\* writes inside it are blind: a joiner's own key meets no other writer, and
\* its rewrite of the seat is the bytes the seat already holds. No joiner is
\* refused (INV_JoinsCommit), and the roster ends as the union of the joiners
\* that committed (INV_RosterIsUnion): that the set may have grown under a
\* joiner's scan changes nothing it wrote.
\* The RED beside this row is MC_DefraLevel_Red_DecideOnCommutativeScan: the
\* same prefix, with a caller that decides an exclusive outcome on the scan.
\* Lean, for every size: Regolith/Validation.lean, exempt_serial;
\* Regolith/Relaxations.lean, commutative_union.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, never stalling for ever
\* while a step is possible.
SPECIFICATION Spec
\* Spend the states on the later workload: no transaction of the first workloads ever begins.
CONSTRAINT NewWorkloadOnly
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
