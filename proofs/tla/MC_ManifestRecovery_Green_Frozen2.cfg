\* The fix with two memtables waiting at once, as group commit allows, and
\* flushed by whichever thread gets there: every flush takes the oldest under
\* one exclusion, so min_wal_id only ever covers flushed logs. Every
\* invariant holds.
\* The run: two keys, at most three writes, at most seven batches, two
\* memtables waiting at a time.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  MaxFrozen = 2
  Sealed = FALSE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT AckedSurvive
INVARIANT ReadsNewest
INVARIANT RotSafe
