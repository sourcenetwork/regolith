\* The combined sweep: a batch boundary after every pool file the walk of
\* shared/ hands out and after every entry the walk of meta/ hands out, so
\* a delete or a purge sweeps the pool one candidate at a time, each batch
\* reading every remaining listing, one per batch of that walk. Two
\* backups, deletes and purges of any of them (or of none), power cuts at
\* every step, and one attacker edit, one swap, or one file that stops
\* reading, before or during a sweep. Every pool file nobody lists goes,
\* none that a listing names does, a listing that does not read stops the
\* sweep, and the sweep holds one candidate. Restores, which the sweep
\* does not touch, are left out.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two backups in one behaviour: enough for two to share a table and for
  \* one to be deleted.
  MaxBackups = 2
  \* No restore: the sweep does not touch one.
  MaxRestores = 0
  \* One entry per batch of the walk of meta/: a boundary after every entry.
  Batch = 1
  \* One pool file per batch of the sweep: a boundary after every file.
  Sweep = 1
  \* Two table slots: a backup or a restore copies its tables one at a time.
  Slots = 2
  \* The engine, no defect.
  Mutant = "none"
\* Every variable keeps its type.
INVARIANT TypeOK
\* No metadata file and no restored MANIFEST is plain text.
INVARIANT SealedMetadata
\* A provider with every key the backup needs is never refused.
INVARIANT RightKeysRestore
\* A finished restore holds exactly what the backup held.
INVARIANT FaithfulRestore
\* A refused restore wrote nothing.
INVARIANT RefusalWritesNothing
\* Every table an untampered backup lists is in the pool, even while its
\* metadata does not read.
INVARIANT ListedRestores
\* The listing names every backup the repository holds.
INVARIANT ListingNamesEvery
\* A collection holds one batch of candidates.
INVARIANT CollectionBounded
\* A sweep that finishes leaves no pool file nobody lists.
INVARIANT SweepRemovesEveryUnlisted
