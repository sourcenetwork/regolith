\* The bug planted: when the walk of meta/ has handed out a whole batch and
\* fetches the next, it starts one entry too far, so the first entry of
\* every batch after the first is never handed out (an iterator that
\* resumes past its cursor, or a caller that takes a broken walk for a
\* finished one).
\* How it breaks the promise: backups 1 and 3 both list table t, backup 2
\* does not. Deleting backup 1, the walk hands out backup 2's file, crosses
\* the batch boundary, and loses backup 3's. Nothing struck t, so the delete
\* removes it, and backup 3 lists a table the pool no longer has.
\* ListedRestores fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* SHRUNK when deletes and purges learned that their sync of meta/ can fail
\* (413 thousand states, 25 seconds of CPU; now about 53 thousand and 10
\* seconds): no sync fails in this run, and
\* no attacker acts, since the story needs neither. The walk that loses an
\* entry still meets every backup, every delete and purge and every power
\* cut; the GREEN runs keep the failed sync and the attacker.
CONSTRAINT NoSyncFailure
\* No attacker: see SHRUNK above.
CONSTRAINT NoAttack
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
