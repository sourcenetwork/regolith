\* The bug planted: when the walk of meta/ has handed out a whole batch and
\* fetches the next, it starts one entry too far, so the first entry of
\* every batch after the first is never handed out (an iterator that
\* resumes past its cursor, or a caller that takes a broken walk for a
\* finished one).
\* How it breaks the promise: backups 1 and 3 both list table t, backup 2
\* does not. Deleting backup 1, the walk hands out backup 2's file, crosses
\* the batch boundary, and loses backup 3's. Nothing struck t, so the delete
\* removes it, and backup 3 lists a table the pool no longer has.
\* ListedRestores fails.
