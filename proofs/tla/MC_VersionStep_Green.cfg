\* GREEN. Two callers hand a section over each and a job keeps the step
\* while it hands over its own, in every order: the push that finds the
\* step free takes it and runs the list, the others wait for their section,
\* and the job parks when the step is taken and is told when it is given up.
\* Sections never overlap, run in the order handed over, none is left
\* behind, no edit is lost, and every section runs.
\*
\* The runs checked: every run that starts in Init, takes steps of Next, and in which a thread
\* that can go on does go on.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
