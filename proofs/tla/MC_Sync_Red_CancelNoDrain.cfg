\* A cancelled waiter does not drain. Task 1, at the head, waits for both
\* permits while one is free; task 2 behind it needs one. Task 1 cancels and
\* leaves, and nobody looks at the queue again: task 2 sleeps beside the
\* free permit it needs. NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 2
  Need <- NeedFirstAll
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "CancelNoDrain"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT FifoHandoff
INVARIANT CancelPassesOn
