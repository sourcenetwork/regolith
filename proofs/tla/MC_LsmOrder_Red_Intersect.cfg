\* The picker run_compact_range uses today: only the L0 files that intersect
\* the range. A newer file meeting the range moves to L1 while an older file
\* holding an older version of one of its keys stays in L0, and the read of
\* that key returns the older version. ReadNewest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2, 3}
  MaxSeq = 5
  MaxL0 = 3
  Picker = "Intersect"
INVARIANT ReadNewest
