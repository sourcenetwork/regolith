\* RED. The bug: a writer is checked when it takes its slot of the ring,
\* and not again when the slot is decided. Story: the family is created
\* (sequence 1); the drop takes a slot; writer 1 takes the slot behind it
\* and is checked there, live; the drop is decided, tombstone at 2, and
\* retires the family; writer 1's slot is decided on the strength of its
\* earlier pass and lands at 3, over the tombstone. NoWriteAfterDrop breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where nothing is left to do is not an error.
CHECK_DEADLOCK FALSE
\* Keep runs short enough for TLC (see Bounded).
CONSTRAINT Bounded
\* The setup this configuration checks.
CONSTANTS
  \* One family id.
  Families = {1}
  \* The writers.
  Writers = {1, 2}
  \* The family each writer writes to.
  WriteTo <- WriteToOne
  \* How each writer writes.
  Kind <- KindsPlain
  \* One reader.
  Readers = {1}
  \* It watches family 1.
  Watch <- WatchOne
  \* It looks three times.
  Looks = 3
  \* The planted bug.
  Mutant = "FenceAtInstall"
\* The invariant this bug must break.
INVARIANT NoWriteAfterDrop
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT NoWriteBeforeBirth
\* Checked as well.
INVARIANT LifeInOrder
