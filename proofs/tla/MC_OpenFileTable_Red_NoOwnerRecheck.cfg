\* RED. The bug: a join trusts the owner it saw before its CAS.
\* Story: thread 1 sees table 1 open in the slot with no reader; thread 2
\* claims the slot, opens table 2, reads and leaves, so the word is again
\* "open, no reader". Thread 1's CAS wins on the same word and it reads
\* table 2. ReadsOwnFile breaks.

\* The behaviours of the model.
SPECIFICATION Spec
\* A run where every thread finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* The reading threads.
  Threads = {1, 2}
  \* The tables they read.
  Files = {1, 2}
  \* How many slots: max_open_files.
  Cap = 1
  \* Which table each thread reads.
  Want <- WantTwo
  \* How many times each thread reads it.
  Reads = 2
  \* At most this many file openings in one run.
  MaxDesc = 4
  \* The planted bug.
  Mutant = "NoOwnerRecheck"
\* The invariant this bug must break.
INVARIANT ReadsOwnFile
\* Checked as well.
INVARIANT TypeOK
\* Checked as well.
INVARIANT AtMostCap
\* Checked as well.
INVARIANT NeverClosedInUse
