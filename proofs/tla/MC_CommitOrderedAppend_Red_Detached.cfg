\* #1911's Detached (defradb.rs #1897): the transaction writes an
\* unnumbered pending row, and a second, separate commit numbers the
\* pending rows later. That second commit is a durable commit no write
\* asked for. INV_OneCommitPerWrite fails. Left out because the design
\* breaks them too, each in its own RED: INV_CommitOrder (DetachedOrder)
\* and INV_NumberedAtCommit (DetachedNumbering). Every other invariant is
\* checked first and holds up to that state (no once key here).
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Three writers that each append one entry with no once key: a1, a2 and a3.
  Singles = {"a1", "a2", "a3"}
  \* No writer uses the shared once key.
  SharedOnce = {}
  \* No writer appends twice.
  Doubles = {}
  \* No writer repeats a once key inside one transaction.
  RepeatOnce = {}
  \* Every writer appends something.
  Silent = {}
  \* No commit is refused: no writer's validation on another key fails.
  MayAbort = {}
  \* The leader commits one transaction at a time.
  GroupSize = 1
  \* One decided group at a time: the pipeline mutex.
  Depth = 1
  \* No write-ahead-log error is injected.
  MaxWalErrors = 0
  \* The rejected design planted here: a commit writes an unnumbered row, and a second, later commit
  \* numbers the waiting rows in begin order.
  Mode = "Detached"
  \* No misuse of the design is planted.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: every row at or below the reader's cursor was handed to the reader.
INVARIANT INV_NoSkip
\* Checked in every state: no two appends were given the same position.
INVARIANT INV_UniqueCursors
\* Checked in every state: no writer is refused unless its own validation on another key failed: an
\* append never causes a conflict.
INVARIANT INV_NoDisjointConflict
\* Checked in every state: the visible rows sit at exactly positions 1 up to the head, and no read
\* found one missing.
INVARIANT INV_Dense
\* Checked in every state: no row of a transaction is visible while that transaction is still open.
INVARIANT INV_OwnAppendsInvisible
\* The promise the planted bug must break: every write costs exactly one durable commit.
INVARIANT INV_OneCommitPerWrite
