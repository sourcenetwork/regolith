\* A waiter parks right after pushing its node. The holder released between
\* the waiter's failed CAS and its push, saw no waiter, and freed the lock:
\* nobody wakes the waiter. NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  Bound = 1
  Watched = {1}
  Mutant = "NoRecheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT WaitersCounted
INVARIANT DrainExclusive
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT ReentrancyDepth
INVARIANT BoundedBypass
INVARIANT HandoffExclusive
INVARIANT CancelPassesOn
