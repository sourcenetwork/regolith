\* The waiter parks right after pushing its node, without draining. The
\* holder released between the waiter's failed fast path and its push,
\* found no node, and left the lock free; nobody hands it over and the
\* waiter sleeps beside a free lock. NoLostWakeup fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Tasks = {1, 2, 3}
  Kind = "Semaphore"
  Permits = 1
  Need <- NeedOne
  Owner <- OwnerEach
  MaxDepth = 1
  Owned = FALSE
  MaxBcast = 0
  Notifiers = {}
  Watched = {1}
  Mutant = "NoRecheck"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT PermitsConserved
INVARIANT MutualExclusion
INVARIANT FifoHandoff
INVARIANT CancelPassesOn
