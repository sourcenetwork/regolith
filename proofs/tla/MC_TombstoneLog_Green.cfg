\* The real log: look whether the tombstone is there, take a position with
\* one add, write the slot, set its flag, mark the commit applied, then raise
\* the horizon. Two commits, two threads that may each apply either (so both
\* may apply the same one, and one may still be appending for the first while
\* the other appends for the second), and one reader. Every invariant holds.
\* SHRUNK from two readers (945,168 states, 34 seconds of CPU): readers do
\* not affect one another, a second one is in MC_TombstoneLog_Green_Readers,
\* and Lean proves the rules for any number.
\* Check every behaviour of the model.
SPECIFICATION Spec
