\* The fix: the ingest's sequence is a pending slot until its table is
\* installed, and no publication passes a pending slot. Three commits race
\* the ingest and two readers snapshot at any moment; every snapshot reads
\* every key the same from the moment it is taken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Commits = {"c1", "c2", "c3"}
  CommitKey = 1
  IngestKeys = {1, 2}
  Readers = {"r1", "r2"}
  Mutant = "none"
INVARIANT TypeOK
INVARIANT NoPendingAtOrBelowVisible
INVARIANT RepeatableSnapshot
