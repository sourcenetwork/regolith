\* #1911's StampLatest, on the design: the reader bounds itself by the
\* latest assigned position instead of the head in its snapshot. A group is
\* decided but not yet published; the reader moves its cursor past its
\* position, and the row lands below the cursor once published, never
\* read. INV_NoSkip fails. Every other invariant is checked first and holds
\* up to that state (no once key here).
