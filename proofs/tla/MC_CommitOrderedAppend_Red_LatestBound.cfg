\* #1911's StampLatest, on the design: the reader bounds itself by the
\* latest assigned position instead of the head in its snapshot. A group is
\* decided but not yet published; the reader moves its cursor past its
\* position, and the row lands below the cursor once published, never
\* read. INV_NoSkip fails. Every other invariant is checked first and holds
\* up to that state (no once key here).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2", "a3"}
  SharedOnce = {}
  Doubles = {}
  RepeatOnce = {}
  Silent = {}
  MayAbort = {}
  GroupSize = 1
  Depth = 1
  MaxWalErrors = 0
  Mode = "Append"
  Mutant = "LatestBound"
INVARIANT TypeOK
INVARIANT INV_UniqueCursors
INVARIANT INV_CommitOrder
INVARIANT INV_NoDisjointConflict
INVARIANT INV_OneCommitPerWrite
INVARIANT INV_Dense
INVARIANT INV_NumberedAtCommit
INVARIANT INV_OwnAppendsInvisible
INVARIANT INV_NoSkip
