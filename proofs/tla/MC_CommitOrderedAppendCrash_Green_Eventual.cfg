\* Eventual durability: a record is published before it is durable, so a
\* power cut may drop acknowledged commits, and the next commits take their
\* positions again. The recovered log is still a dense, unique prefix, and
\* the internal reader, whose cursor commits in the same database, never
\* skips. This is also Red_EventualExternal's teeth: the same constants,
\* every invariant but the three Eventual does not promise.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two writers that each append one entry with no once key: a1 and a2.
  Singles = {"a1", "a2"}
  \* Two writers that each append once with the same once key "o1", so only one of them may get a
  \* row: s1 and s2.
  SharedOnce = {"s1", "s2"}
  \* No writer appends twice.
  Doubles = {}
  \* A commit may be published before its record is on disk (DurabilityMode::Eventual).
  Durability = "Eventual"
  \* One power cut may happen, at any moment.
  MaxCrashes = 1
