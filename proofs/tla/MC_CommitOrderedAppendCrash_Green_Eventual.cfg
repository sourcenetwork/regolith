\* Eventual durability: a record is published before it is durable, so a
\* power cut may drop acknowledged commits, and the next commits take their
\* positions again. The recovered log is still a dense, unique prefix, and
\* the internal reader, whose cursor commits in the same database, never
\* skips. This is also Red_EventualExternal's teeth: the same constants,
\* every invariant but the three Eventual does not promise.
\*
\* SHRUNK to finish in a few seconds of CPU on one TLC worker: one writer
\* without a once key where there were two (568,625 states and 50 seconds;
\* now 19,599 states and under 5). Still here: that writer beside the two
\* that share a once key, the background sync, both readers and the power
\* cut, in every order, so a dropped commit's position is still taken again
\* and the once key still lands once. Gone: a second plain writer, which adds
\* orders of the same steps. Lean covers every number of writers and
\* records: snapshot_sees_prefix, dense_from_one, unique_positions and
\* at_most_once in Regolith/Append.lean, recovers_prefix in
\* Regolith/WalRecovery.lean.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  \* One writer without a once key: see SHRUNK above.
  Singles = {"a1"}
  SharedOnce = {"s1", "s2"}
  Doubles = {}
  Durability = "Eventual"
  MaxCrashes = 1
INVARIANT TypeOK
INVARIANT INV_Dense
INVARIANT INV_UniqueCursors
INVARIANT INV_AtMostOnce
INVARIANT INV_NoSkip
