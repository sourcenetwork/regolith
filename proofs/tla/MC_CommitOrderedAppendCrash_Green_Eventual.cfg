\* Eventual durability: a record is published before it is durable, so a
\* power cut may drop acknowledged commits, and the next commits take their
\* positions again. The recovered log is still a dense, unique prefix, and
\* the internal reader, whose cursor commits in the same database, never
\* skips. This is also Red_EventualExternal's teeth: the same constants,
\* every invariant but the three Eventual does not promise.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Singles = {"a1", "a2"}
  SharedOnce = {"s1", "s2"}
  Doubles = {}
  Durability = "Eventual"
  MaxCrashes = 1
INVARIANT TypeOK
INVARIANT INV_Dense
INVARIANT INV_UniqueCursors
INVARIANT INV_AtMostOnce
INVARIANT INV_NoSkip
