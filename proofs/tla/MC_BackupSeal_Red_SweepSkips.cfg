\* The bug planted: when the walk of shared/ has filled a batch of
\* candidates, the file it hands out next is dropped, not kept for the next
\* batch (a loop that takes the next entry before it checks whether the
\* batch is full), so the file that would start each later batch is never a
\* candidate.
\* How it breaks the promise: backup 1 holds two tables; deleting it sweeps
\* one pool file per batch. The first batch removes one table; the walk
\* drops the other at the boundary, so it is never a candidate, and it
\* stays in the pool, listed by nobody, for ever. SweepRemovesEveryUnlisted
\* fails.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two backups, as in the GREEN run.
  MaxBackups = 2
  \* No restore: the sweep does not touch one.
  MaxRestores = 0
  \* One entry per batch of the walk of meta/: a boundary after every entry.
  Batch = 1
  \* One pool file per batch of the sweep: a boundary after every file.
  Sweep = 1
  \* Two table slots: a backup or a restore copies its tables one at a time.
  Slots = 2
  \* The defect above.
  Mutant = "SweepSkips"
\* The promise this bug breaks.
INVARIANT SweepRemovesEveryUnlisted
\* Every variable keeps its type.
