\* A witness, not a promise: the code as built, and a drain that runs three
\* passes. Two tasks both wait for a Mutex. One takes the drain role; while it
\* passes, the other queues, or withdraws, or lets the lock go with a waiter
\* queued, and each of those costs the holder of the role one more pass. So
\* the passes of one drain do grow with what the other threads do to the
\* queue: the locks are lock-free, not wait-free. FewPasses ("no drain runs
\* three passes") fails, as it must; DrainBounded, which counts those
\* operations, holds in MC_Sync_Green_MutexBoth on the same run.
\*
\* The runs checked: every run that starts in Init and takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
