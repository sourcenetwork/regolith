\* GREEN. Liveness with a job of regolith's own: thread 1 misses block 1
\* while a call on thread 2 starts a job, which runs on thread 2's queue;
\* either may go idle or wake, and the database may close at any point. The
\* read and the job both finish in every fair run (AllDone), and every
\* invariant holds.
\*
\* Example of what it rules out: thread 2's call starts the job and goes idle
\* before polling; the job's request sits on thread 2's queue, nothing wakes
\* thread 2, and the job never runs.
\*
\* This run is the liveness half of MC_NonBlocking_Green_Jobs, which keeps
\* the block shared by both threads and the safety invariants (1,844 states
\* here against 44,504 there). What this size does not show: the job's thread
\* also waiting on a block the other thread reads. Lean covers the safety for
\* every number of threads and units: claim_once, told_at_most_once,
\* every_waiter_told, no_lost_idle_wakeup and busy_never_woken in
\* Regolith/IoQueue.lean; single_thread_finishes there proves that one thread
\* finishes everything. No Lean theorem states that many threads do.

\* The behaviours of the model: Init, then steps of Next, each thread fair.
SPECIFICATION Spec
\* A run that ends (every read done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two threads, each with its own queue.
  Threads = {1, 2}
  \* One block.
  Blocks = {1}
  \* Thread 1 reads block 1; thread 2 reads nothing.
  Want <- WantOne
  \* One job regolith starts itself.
  Jobs = {3}
  \* Thread 2's call starts it.
  JobOf <- JobOfJobs
  \* One unit for the block and one for the job.
  MaxUnits = 2
  \* The real code: no bug planted.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* A unit's disk read runs at most once.
INVARIANT SingleRun
\* A queue gets at most one note per unit, and only if it registered.
INVARIANT ExactlyOnce
\* Every queue that registered on a finished unit gets its note.
INVARIANT EveryWaiterTold
\* A read's request sits only on its own thread's queue.
INVARIANT OwnQueue
\* No thread sleeps unwoken with a note in its inbox.
INVARIANT NoLostIdleWakeup
\* Only an idle thread is ever woken.
INVARIANT BusyNeverWoken
\* Every free unit is held by some queue, so some poll runs it.
INVARIANT NoOrphanUnit
\* The promise of this run: every read and job finishes, in every fair run.
PROPERTY AllDone
