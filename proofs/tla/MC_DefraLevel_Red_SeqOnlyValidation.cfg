\* Green_ValueReads with reads validated by sequence, as at RepeatableRead: an
\* identical rewrite of the version key refuses the reader although the value
\* it read is the value now (a spurious conflict).
\* INV_IdenticalRewritesCommit fails.
SPECIFICATION Spec
CONSTRAINT NewWorkloadOnly
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {1}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {}
  Remote = 9
  RemoteParents = {}
  Incrementers = {}
  ReadMergers = {}
  Rebasers = {}
  Resetters = {}
  Clearers = {}
  Migrators = {}
  Extras <- ValueWorkload
  CommutativeRanges = {}
  ContentAddressedRanges = {}
  Level = "DefraLevel"
  Mutant = "SeqOnlyValidation"
INVARIANT INV_IdenticalRewritesCommit
INVARIANT INV_ValueReadsCurrent
INVARIANT INV_ReasonsExact
