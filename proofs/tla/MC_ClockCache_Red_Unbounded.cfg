\* The bug: an insert takes its bytes without checking the budget. The third
\* block goes in on top of two: ByteBound breaks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks = {b1, b2, b3}
  Readers = {r1, r2}
  Queues = {q1}
  Size <- UnitSizes
  Cap = 2
  Mode = "Unbounded"
INVARIANT ByteBound
