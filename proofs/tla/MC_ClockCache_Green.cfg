\* The real cache: pins honoured by the hand's compare-and-swap, every insert
\* reserving its bytes, every landing holding its own reference. Three
\* blocks against a budget of two, two readers and one CacheOnly queue.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks = {b1, b2, b3}
  Readers = {r1, r2}
  Queues = {q1}
  Size <- UnitSizes
  Cap = 2
  Mode = "Green"
INVARIANT TypeOK
INVARIANT NoFreedPin
INVARIANT ByteBound
INVARIANT UsedExact
INVARIANT LandedReadable
INVARIANT RefsExact
