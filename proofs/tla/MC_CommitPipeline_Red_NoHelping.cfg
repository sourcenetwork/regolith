\* The defect: no helping. A slot is decided, written, applied and
\* published only by its owner, and nobody voids an empty one. The owner
\* of an early slot stops, and every later thread waits on it forever
\* with no step it may take. NoLiveThreadBlocked fails; the other
\* invariants are checked too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Committers = {1, 2}
  Ingesters = {3}
  Writes <- Overlapping
  Immediate = {1}
  MaxSlots = 6
  MaxStops = 1
  Mutant = "NoHelping"
INVARIANT NoLiveThreadBlocked
INVARIANT TypeOK
INVARIANT DecidedIsPrefix
INVARIANT PublishedPrefix
INVARIANT ReadersSeePrefix
INVARIANT NoHole
INVARIANT SeqInRingOrder
INVARIANT DurableImpliesWritten
INVARIANT DurableBeforeVisible
INVARIANT IngestNotPassed
INVARIANT NoLostUpdate
INVARIANT BoundNeverBinds
