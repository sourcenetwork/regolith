\* GREEN. Green_Shrink with fairness: every thread that can go on does,
\* and an extent handed to the reclaimer is freed once nobody holds it. The
\* extent the set_len replaces has room 2, the prompt size here, so the
\* writer submits it after it let go: LargeFreed holds.

\* The behaviours of the model, with every thread going on and the prompt
\* reclamation taken.
SPECIFICATION LiveSpec
\* A run where everyone finished is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* Two writers.
  Writers = {1, 2}
  \* The write each makes.
  Ops <- OpsShrink
  \* One reader.
  Readers = {1}
  \* Bytes of 7 in the file at the start.
  InitLen = 2
  \* The room of its one segment.
  InitCap = 2
  \* The smallest segment a file grows by.
  MinCap = 1
  \* The room from which a replaced extent is submitted.
  Big = 2
  \* The real code: no bug planted.
  Mutant = "none"
\* Must hold in every state.
INVARIANT TypeOK
\* Must hold in every state.
INVARIANT CurrentIsFile
\* Must hold in every state.
INVARIANT PublishedInitialized
\* Must hold in every state.
INVARIANT ReadIsSnapshot
\* Must hold in every state.
INVARIANT NoUseAfterFree
\* Must hold in every state.
INVARIANT FreedUnreachable
\* Must hold of every run: every large replaced extent is freed.
PROPERTY LargeFreed
