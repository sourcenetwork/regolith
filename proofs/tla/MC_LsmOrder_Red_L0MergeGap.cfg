\* RED (E38). The bug: a universal merge takes level-0 files that do not lie
\* next to one another and leaves one between them out. Story: key 1 is
\* written at sequence 1 and flushed (file C), written again at sequence 2
\* and flushed (file B), and again at sequence 3 and flushed (file A, the
\* newest). The merge takes A and C and leaves B out; the merged file takes
\* the place of C, the oldest file merged, which is below B. A read of key 1
\* reaches B first and returns the version of sequence 2, though sequence 3
\* is in the tree. ReadNewest breaks. The engine picked like this when it
\* took the order of file ids for the order of level 0.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two keys, 1 and 2.
  Keys = {1, 2}
  \* Four writes.
  MaxSeq = 4
  \* At most 3 files pile up in level 0.
  MaxL0 = 3
  \* compact_range picks the level-0 files that meet the range and every older file whose keys
  \* overlap theirs (the engine's rule).
  Picker = "Closure"
  \* No frozen memtables: a flush writes the memtable straight to level 0.
  MaxImm = 0
  \* A flush always installs the oldest frozen memtable (the engine's rule).
  FlushOrder = "Oldest"
  \* A flush installs its table and retires its memtable in one publication.
  FlushPublish = "Together"
  \* One level below level 0.
  Levels = 1
  \* No external file is ingested.
  Ingest = "Off"
  \* No legacy database: no level ever overlaps.
  Legacy = "Off"
  \* The planted bug: a universal merge may leave out a file that lies between the files it takes.
  L0Merge = "Gapped"
\* The promise the planted bug must break: every read of every key at every snapshot returns the
\* newest version that snapshot may see.
INVARIANT ReadNewest
