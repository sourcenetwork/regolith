\* The design: every member validated against the view plus the keys written
\* by members accepted earlier in its group, one append and one fsync per
\* group, publication after the fsync. Four transactions, groups of up to
\* three, and a group may fail. Every invariant and AllTicketsComplete hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT SerialEquivalent
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT NoStuckTicket
PROPERTY AllTicketsComplete
