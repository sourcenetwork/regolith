\* The design, as the code runs it. Three transactions and one plain write:
\* transactions 1 and 2 write key 1, transaction 3 reads key 1 and writes
\* key 2, and the plain write 4 writes key 1. Groups of up to three, and
\* every leader hands off after one group. Every invariant holds.
\*
\* Example of what it rules out: transactions 1 and 2 land in one group,
\* both took their snapshot before either wrote, and both are told
\* "committed" although each wrote key 1 over the other. Validated one at a
\* time, the second would have been refused; SerialEquivalent says a group
\* refuses it too.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: this
\* run no longer lets a group fail and no longer checks the liveness
\* property (118,165 states and 33 seconds with both; now 75,708 states and
\* about 13). Still here: every safety invariant over four commits, so a
\* full group of three with a fourth commit behind it, and every order of
\* the two writers of key 1, the reader of key 1 and the plain write.
\* Moved to runs of three commits: a failed group and "every commit gets
\* its answer" are MC_GroupCommit_Green_Live's (the three transactions) and
\* MC_GroupCommit_Green_LivePlain's (two transactions and the plain write).
\* Gone: a failed group while four commits are in play. Every defect shows
\* within three commits: ViewOnly, TrustEarly, PublishBeforeSync and
\* DrainAll each fail on their named invariant with commits {1, 2, 3},
\* {1, 3, 4} and {1, 3, 5} (their own runs keep four and a failing group).
\* Lean covers the safety for every number of commits and every group size:
\* group_eq_serial, early_check_split and plain_write_counts_in_group in
\* Regolith/GroupCommit.lean, seqs_dense in Regolith/Pipeline.lean. No Lean
\* theorem states the failed group or the liveness claim.
\* The behaviours to check: Init, then any steps of Next, with fairness.
SPECIFICATION Spec
\* A run where every commit is done is not an error.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Four commits: transactions 1, 2 and 3, and the plain write 4.
  Txns = {1, 2, 3, 4}
  \* Commit 4 is a plain write: no snapshot, no validation, it always lands.
  Plain = {4}
  \* The two keys they read and write.
  Keys = {1, 2}
  \* What each commit reads (ReadsW in GroupCommit.tla).
  Reads <- ReadsW
  \* What each commit writes (WritesW in GroupCommit.tla).
  Writes <- WritesW
  \* Transactions 1 and 3 wait for their record to be durable.
  Immediate = {1, 3}
  \* A group takes up to three members.
  MaxGroup = 3
  \* No group fails here: see SHRUNK above.
  Faults = FALSE
  \* No commit here is made by commit_nowait: every leader syncs its own group.
  Nowait = {}
  \* The design, no defect.
  Mutant = "none"
\* Every value has the shape the model says it has.
INVARIANT TypeOK
\* The commits that succeeded are the ones a one-at-a-time order would accept.
INVARIANT SerialEquivalent
\* Sequences are handed out in the order the commits were decided.
INVARIANT SeqFollowsDecisionOrder
\* The memtable holds exactly the writes of the commits that landed.
INVARIANT StoreHoldsCommits
\* A reader sees a group all or nothing: what is visible is in the memtable.
INVARIANT VisibleIsApplied
\* A commit that waits for an fsync is not visible before that fsync.
INVARIANT DurableBeforeVisible
\* Every caller is answered at most once, and a done commit exactly once.
INVARIANT TicketsCompleteOnce
\* A "committed" answer is true: the commit is visible, and durable if it asked.
INVARIANT TicketMeansVisible
\* A leader leads one group, then hands off.
INVARIANT BoundedTurn
\* When no step is possible, every commit has its answer.
INVARIANT NoStuckTicket
