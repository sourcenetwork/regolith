\* The design: every member validated against the view plus the keys written
\* by members accepted earlier in its group, one append and one fsync per
\* group, publication after the fsync. Four transactions, groups of up to
\* three, and a group may fail. Every invariant holds.
\*
\* SHRUNK to finish well inside 20 seconds of CPU on one TLC worker: the
\* liveness property left this run (68,511 states either way, but 16 to 22
\* seconds with the property and 14 without). Still here: every safety
\* invariant over four transactions in groups of up to three, with a failed
\* group. "Every ticket completes" is now MC_GroupCommit_Green_Live's, on
\* three transactions. Lean covers the safety for every size:
\* group_eq_serial and early_check_split in Regolith/GroupCommit.lean,
\* seqs_dense in Regolith/Pipeline.lean. No Lean theorem states the
\* liveness claim.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  Mutant = "none"
INVARIANT TypeOK
INVARIANT SerialEquivalent
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT NoStuckTicket
