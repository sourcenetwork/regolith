\* The judge reads a sealed batch's bytes as plain records: they decode as
\* nothing it knows, so every whole batch counts as one the writer synced. A
\* crash tears a reservation and leaves the next reservation and the table's
\* batch whole: the whole reservation "proves" the damage synced, and the
\* open refuses a state a crash produced. RecoveryOpens fails.
\* The run: two keys, at most three writes, at most seven batches, one
\* memtable waiting at a time.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  MaxFrozen = 1
  Sealed = TRUE
  Mutant = "JudgeCiphertext"
INVARIANT RecoveryOpens
INVARIANT TypeOK
INVARIANT AckedSurvive
INVARIANT ReadsNewest
INVARIANT RotSafe
