\* RED. The bug is the owner's: it ignores how long its poll said it might
\* idle, and stays idle past a timed wait's due time.
\* Story: thread 1 asks for timed wait 6, its poll takes the wait in, and
\* thread 1 goes idle before the wait is due. The wait comes due. Nothing is
\* pushed to a queue for a timed wait, so nobody wakes thread 1, and the
\* wait is never completed. AllDone breaks.

\* The behaviours of the model: Init, then steps of Next, each thread fair.
SPECIFICATION Spec
\* A run that ends (everything done) is not an error.
CHECK_DEADLOCK FALSE
\* The setup this configuration checks.
CONSTANTS
  \* One thread, with one queue.
  Threads = {1}
  \* No block in this setup.
  Blocks = {}
  \* So the thread reads none.
  Want <- WantSingleNone
  \* No job in this setup.
  Jobs = {}
  \* So no job has an owner.
  JobOf <- JobOfNone
  \* No unit is ever made here; the bound only needs a value.
  MaxUnits = 1
  \* No sync rounds in this setup.
  Rounds = {}
  \* So no round covers a commit.
  CommittersOf <- CommittersNone
  \* No write stalls in this setup.
  Stalls = {}
  \* So no stall stops anyone.
  StoppedBy <- StoppedNone
  \* One timed wait.
  Timers = {6}
  \* It is thread 1's.
  TimerOf <- TimerOfOne
  \* The thread keeps its queue.
  Droppers = {}
  \* The planted bug.
  Mutant = "IdlePastDue"
\* The promise this bug must break: the timed wait finishes.
PROPERTY AllDone
