\* A plain RwLock: writer 1 waits behind reader 2, and reader 3 barges in ahead
\* of it, so the writer loses its retry and spins on its own node. A release that
\* nudges it then calls no waker, because the writer is spinning. The planted
\* bug: when the spin runs out, the writer arms its waker and sleeps without
\* reading its node's marks once more. The nudge is never read and never woken
\* for: NoLostWakeup fails.
