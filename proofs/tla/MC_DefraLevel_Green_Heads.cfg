\* DefraLevel with the head and marker ranges declared commutative and the
\* block range content-addressed. Two transactions applying the same remote
\* block both land: their head scans record no stretch, and the read of the
\* block key that decides whether to apply it is dropped, since each puts the
\* block (E17); one that finds the block stored writes nothing, and a
\* write-free commit validates nothing. Appends land
\* under reclamation, and the derived head set is the DAG's tips throughout:
\* dropping the head stretches loses nothing. The writer and the patcher stay
\* idle (HeadsWorkloadOnly); Green_Migrations checks them at DefraLevel.
\* One appender here; with Appenders = {1, 3} it is also green, over 24,345
\* distinct states, about ten seconds on one worker.
\* Every abort names a key and a newer write that decides it (INV_ReasonsExact).
\*
\* The runs checked: every run that starts in Init and takes steps of Next, never stalling for ever
\* while a step is possible.
SPECIFICATION Spec
\* Spend the states on the head-set workload: the writer, the patcher, the counter transactions and
\* the migrators never begin.
CONSTRAINT HeadsWorkloadOnly
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Transaction 3 appends one block (the id is also the block's id).
  Appenders = {3}
  \* Block 0 is the head that exists before anything runs.
  Seed = 0
  \* Transaction 4 is the pruner, which sweeps superseded head keys.
  Pruner = 4
  \* Transaction 5 is the writer, which reads the definition and writes a document from it.
  Writer = 5
  \* Transaction 6 is the patcher, which replaces the definition.
  Patcher = 6
  \* Transactions 7 and 8 each apply the same remote block.
  Mergers = {7, 8}
  \* The remote block's id is 2.
  Remote = 2
  \* The remote block names the seed, block 0, as its parent.
  RemoteParents = {0}
  \* No transaction blind-merges an increment into the counter.
  Incrementers = {}
  \* No transaction reads the counter and then merges into it.
  ReadMergers = {}
  \* No transaction puts the counter and merges on top.
  Rebasers = {}
  \* No transaction deletes the counter.
  Resetters = {}
  \* No plain range delete runs over the counter's range.
  Clearers = {}
  \* No transaction migrates the definition.
  Migrators = {}
  \* None of the later workloads runs.
  Extras <- NoExtras
  \* The caller declares the head range and the marker range commutative
  \* (KeyClass::CommutativePrefix): a scan stretch that stays inside one of them records nothing.
  CommutativeRanges = {1, 2}
  \* The caller declares the block range content-addressed (KeyClass::ContentAddressed): a key there
  \* is named after its bytes, so writing it twice stores the same thing.
  ContentAddressedRanges = {6}
  \* Every transaction runs at DefraLevel: RepeatableRead with the relaxations the caller declares.
  Level = "DefraLevel"
  \* No planted bug: the commit rule as the engine has it.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: no appender is ever refused.
INVARIANT INV_AppendsCommit
\* Checked in every state: the head set a scan derives from the keys is exactly the DAG's tips.
INVARIANT INV_HeadsExact
\* Checked in every state: no merger is refused over writes identical to its own.
INVARIANT INV_DuplicateMergesCommit
\* Checked in every state: every abort's reason names a key the transaction really used that way and
\* a newer write that could decide the race.
INVARIANT INV_ReasonsExact
