\* DefraLevel with the head and marker ranges declared commutative. Two
\* transactions applying the same remote block both land, appends land under
\* reclamation, point reads stay validated, and the derived head set is the
\* DAG's tips throughout: dropping the head stretches loses nothing.
\* One appender keeps this to seconds in CI; with Appenders = {1, 3} it is
\* also green, over 34,951,743 distinct states (about ten minutes).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Appenders = {3}
  Seed = 0
  Pruner = 4
  Writer = 5
  Patcher = 6
  Mergers = {7, 8}
  Remote = 2
  RemoteParents = {0}
  Incrementers = {}
  Resetters = {}
  CommutativeRanges = {1, 2}
  Level = "DefraLevel"
INVARIANT TypeOK
INVARIANT INV_AppendsCommit
INVARIANT INV_NoStaleDefinition
INVARIANT INV_HeadsExact
INVARIANT INV_DuplicateMergesCommit
