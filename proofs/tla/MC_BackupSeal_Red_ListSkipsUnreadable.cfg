\* The bug planted: list_backups leaves out every backup whose metadata
\* does not read, as it did before this rule.
\* How it breaks the promise: two backups; backup 2's metadata flips a
\* bit. The listing names backup 1 only, so a caller believes it has one
\* backup and decides what to keep, delete or restore on a list that is
\* not whole. ListingNamesEvery fails.
SPECIFICATION Spec
\* The model stops on purpose once its budgets are spent; that is not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two backups, as in the GREEN run.
  MaxBackups = 2
  \* Two restores, as in the GREEN run.
  MaxRestores = 2
  \* The defect above.
  Mutant = "ListSkipsUnreadable"
\* The promise this bug breaks.
INVARIANT ListingNamesEvery
\* Every variable keeps its type.
INVARIANT TypeOK
