\* The open moves only the overlapping level (L2) to L0. L0 is read before
\* L1, which holds a newer version of a key the demoted tables also hold,
\* so the read returns the older one. ReadNewest fails; the levels left are
\* sorted, and binary search on them finds what a scan finds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {1, 2}
  MaxSeq = 4
  MaxL0 = 2
  Picker = "Closure"
  MaxImm = 0
  FlushOrder = "Oldest"
  Levels = 2
  Ingest = "Off"
  Legacy = "DemoteLevelOnly"
INVARIANT ReadNewest
INVARIANT TypeOK
INVARIANT LevelsSorted
INVARIANT BisectIsScan
