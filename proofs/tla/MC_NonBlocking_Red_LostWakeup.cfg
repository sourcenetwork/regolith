\* The defect: a task checks its handle first and registers its waker
\* after, with no recheck. The sync completes the ticket in between, finds
\* no waker, and the task parks on a complete ticket for good.
\* NoLostWakeup fails; the other invariants are checked too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  CommitTasks = {1, 2}
  Callbacks = {1}
  ReadTasks = {3, 4}
  Blocks = {1}
  BlockOf <- OneBlock
  IoThreads = {1, 2}
  SelfJobs = 1
  Mode = "pool"
  Mutant = "LostWakeup"
INVARIANT NoLostWakeup
INVARIANT TypeOK
INVARIANT TicketCompletesWithItsIo
INVARIANT CallbackOnce
INVARIANT SingleFlight
INVARIANT IoPendingFires
INVARIANT NothingStuck
