\* The bug: a block lands for a waiting queue with no reference of its own.
\* The hand sees only the cache's reference, evicts it and frees it before
\* the queue's read runs again: LandedReadable breaks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks = {b1, b2, b3}
  Readers = {r1, r2}
  Queues = {q1}
  Size <- UnitSizes
  Cap = 2
  Mode = "LandingUnheld"
INVARIANT LandedReadable
