\* A flush takes the newer of two waiting memtables, as two threads racing
\* without the `flushing` exclusion could. Its batch records min_wal_id past
\* the older memtable's log, the power goes before the older one is flushed,
\* and recovery skips a log whose acknowledged writes no table holds.
\* AckedSurvive fails.
\* The run: two keys, at most three writes, at most seven batches, two
\* memtables waiting at a time.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys = {"a", "b"}
  MaxSeq = 3
  MaxBatches = 7
  MaxFrozen = 2
  Sealed = FALSE
  Mutant = "NewestFirst"
INVARIANT AckedSurvive
INVARIANT TypeOK
INVARIANT RecoveryOpens
INVARIANT ReadsNewest
INVARIANT RotSafe
