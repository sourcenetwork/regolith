\* The bug: after its group a leader keeps the mutex and commits the next
\* group of waiting tickets itself, as the code did before E21. A writer
\* whose own commit is done ends up doing the work of everyone queued behind
\* it. BoundedTurn fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {1, 2, 3, 4}
  Plain = {4}
  Keys = {1, 2}
  Reads <- ReadsW
  Writes <- WritesW
  Immediate = {1, 3}
  MaxGroup = 3
  Faults = TRUE
  \* No commit here is made by commit_nowait: every leader syncs its own group.
  Nowait = {}
  Mutant = "DrainAll"
INVARIANT BoundedTurn
INVARIANT TypeOK
INVARIANT SerialEquivalent
INVARIANT SeqFollowsDecisionOrder
INVARIANT StoreHoldsCommits
INVARIANT VisibleIsApplied
INVARIANT DurableBeforeVisible
INVARIANT TicketsCompleteOnce
INVARIANT TicketMeansVisible
INVARIANT NoStuckTicket
