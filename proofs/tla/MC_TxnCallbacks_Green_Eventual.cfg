\* GREEN. As Green_Immediate at Eventual: on_commit runs once the commit is
\* visible, with no wait for the fsync, still on the committing thread.
\* Every other law holds the same.

\* The runs checked: every run that starts in Init and takes steps of Next, in which every owner,
\* every pipeline thread and a close that has begun keep making progress.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Two transact calls.
  Owners = {1, 2}
  \* Two committers that decide and sync.
  Committers = {1, 2}
  \* Up to two attempts each.
  MaxAttempts = 2
  \* Commits do not wait for the fsync.
  Durability = "Eventual"
  \* The real code: no bug planted.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: no attempt's on_commit and on_abort callbacks run more than once in
\* total, and neither does the hooks' outcome.
INVARIANT AtMostOnce
\* Checked in every state: once everything has settled, every attempt that began ran exactly one
\* outcome, and on_commit exactly when it committed.
INVARIANT ExactlyOnce
\* Checked in every state: a transact call commits at most once, with its last attempt.
INVARIANT OneCommitPerTransact
\* Checked in every state: the transaction's own callbacks run before the hooks', and validation
\* after every before_commit.
INVARIANT CallbacksBeforeHooks
\* Checked in every state: the shared counter equals the number of commits: every write a
\* before_commit callback made was validated.
INVARIANT NoLostUpdate
\* Checked in every state: every callback that ran reported the outcome of the attempt that
\* registered it.
INVARIANT AttemptIsolation
\* Checked in every state: an attempt whose before_commit panicked never commits and never runs
\* on_commit.
INVARIANT PanicAborts
\* Checked in every state: no outcome callback runs on a pipeline thread: only on the queue's
\* thread, the owner's or the closer's.
INVARIANT OnCommittingThread
\* Checked over whole runs: every transact call eventually returns and every worker goes idle.
PROPERTY Settles
