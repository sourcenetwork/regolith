\* As Green_Immediate at Eventual: on_commit runs once the commit is
\* visible, with no wait for the fsync. Every other law holds the same.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owners = {1, 2}
  Committers = {1, 2}
  MaxAttempts = 2
  Durability = "Eventual"
  Mutant = "none"
INVARIANT TypeOK
INVARIANT AtMostOnce
INVARIANT ExactlyOnce
INVARIANT OneCommitPerTransact
INVARIANT CallbacksBeforeHooks
INVARIANT NoLostUpdate
INVARIANT AttemptIsolation
INVARIANT PanicAborts
PROPERTY Settles
