\* The bug planted: the manifest records the check before the log holding
\* the copy is written. The power is cut between the two. The next open finds
\* a manifest that says the check was done, so it copies nothing, and the log
\* it replays never got the copy. The read finds the key put at sequence 1 in
\* level 1 before it reaches the range delete at 2 in the bottom level, and
\* returns a deleted key. HeadNewest fails.
\*
\* The runs checked: every run that starts in Init and then takes steps of Next.
SPECIFICATION Spec
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the size, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* At most 4 sequences: the put, the range delete, and two puts after the open.
  MaxSeq = 4
  \* The range delete at the bottom, below the key, nothing moved (E37).
  Layout = "Buried"
  \* The open copies the range delete into the memtable (the engine).
  Hoist = TRUE
  \* A read gathers no range delete ahead of its walk (the engine).
  PreScan = FALSE
  \* The planted bug: the manifest records the check before the log is written.
  RecordFirst = TRUE
  \* A pass writing the bottom level retires range deletes (the engine since E27).
  Retire = TRUE
\* The promise the planted bug must break: once the memtable is rebuilt, a read at the newest
\* sequence returns what the writes say.
INVARIANT HeadNewest
