\* The bug: the horizon is raised over a commit whose append has not
\* returned. A reader whose snapshot includes the delete finds the slot's
\* flag not set, skips it and misses the delete: PublishedSeen breaks. The
\* other invariants are checked too.
\* Check every behaviour of the model.
SPECIFICATION Spec
\* A state with no next step is the end of the run, not a bug.
CHECK_DEADLOCK FALSE
CONSTANTS
  \* Two commits, each with one range tombstone.
  Commits = 2
  \* The threads that apply them: any of them may apply any commit.
  Appliers = {a1, a2}
  \* The reader.
  Readers = {r1}
  \* The bug: the horizon is raised before the append returned.
  Mode = "HorizonFirst"
\* The one that must break. A reader sees every tombstone its snapshot includes.
INVARIANT PublishedSeen
\* Every variable holds the kind of thing it should.
INVARIANT TypeOK
\* No two appends share a slot.
INVARIANT OneSlotEach
\* A reader never reads a slot before its tombstone is in it.
INVARIANT ReadWhole
