\* The bug: the commit's horizon is published before the length. A reader
\* whose snapshot includes the delete reads the old length and misses it:
\* PublishedSeen breaks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Appends = 3
  Readers = {r1, r2}
  Mode = "HorizonFirst"
INVARIANT PublishedSeen
